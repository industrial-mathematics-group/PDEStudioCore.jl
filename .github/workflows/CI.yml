name: CI

on:
  push:
    branches: [ "main" ]
    tags: ["*"]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'
          - '1' 
        os:
          - ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false 

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    needs: test
    permissions:
      actions: write
      contents: write
      statuses: write
      pull-requests: read # Needed for Documenter to process PR preview links
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the whole history: SIGNOFF.toml declares lines from it ([history])

      - name: Set up Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: '1'

      - uses: julia-actions/cache@v3

      # aisignoff's blame cache (.git/aisignoff): the report only blames the commits since the cached one.
      - uses: actions/cache@v4
        with:
          path: .git/aisignoff
          key: aisignoff-${{ github.sha }}
          restore-keys: aisignoff-

      # The interactive AI signoff report, published with the docs (page "AI Signoff Report", docs/src/aisignoff.md).
      # In a pull request it marks what the pull request changes. A failure here doesn't stop the docs.
      - name: AI signoff report
        continue-on-error: true
        env:
          AISIGNOFF_VERSION: "0.20.1"   # keep at the aisignoff release File-signoff uses
          SINCE: ${{ github.event_name == 'pull_request' && 'origin/main' || '' }}
        run: |
          pipx run --spec "aisignoff==${AISIGNOFF_VERSION}" aisignoff report \
            --html docs/src/assets/aisignoff.html --title "PDEStudioCore.jl" --with-source ${SINCE:+--since "$SINCE"}

      - name: Build and deploy documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
          julia --project=docs docs/make.jl