* { box-sizing: border-box; }

.seg button:first-child { border-left: 0; }

Human-Review to the pull request","commit db9c889 (List the data files of a run in RunSummary) leaves AI-Review to the pull request"],"advisory":true}],"source":"# Advanced Simulation Configurations\n\nBeyond running a few methods, you will often want to sweep parameter spaces, compare against an exact solution, post-process every dataset, or make a batch reproducible from its source files. All of this is configured through the keyword arguments of [`SimulationConfig`](@ref).\n\n## 1. Varied Parameters (Sweeps)\n\n`varied` maps parameter names to vectors (or ranges) of values. The backend runs the Cartesian product of all vectors for every active method:\n\n```julia\nconfig = SimulationConfig(shared, methods, [:upwind];\n    varied = Dict(:N => [50, 100, 200], :cfl => 0.1:0.2:0.9),\n)\n```\n\nA varied key is applied to a method only if the method's parameters (shared plus overrides) contain that key. This lets you sweep a parameter that only some methods use (e.g. `:theta` of a θ-scheme) without duplicating the runs of the others. Duplicate parameter sets are removed, and a key that no active method uses triggers a warning (usually a typo).\n\n### Tuple Sweeps\n\nIf your solver expects a tuple (e.g. a 2D resolution `:Ns => (100, 100)`), sweep its entries independently by appending `__x`, `__y`, `__z` or `__1`, `__2`, … to the base key. The tuple is reconstructed (as `Tuple{Int, Int}` for integers) before it reaches your solver:\n\n```julia\nvaried = Dict(\n    :Ns__x => [50, 100],   # first entry\n    :Ns__y => [50, 100],   # second entry\n)\n```\n\nThis sweeps the entries independently (here 2 × 2 runs). To change several entries *together*, e.g. for a\nconvergence study on square grids, address them with one key: `__xy` (`__xz`, `__yz`, `__xyz`) sets the named\nentries and `__all` every entry of the tuple to the same value. The swept values are then plain numbers, which\nfrontends can use directly as slider positions and axis values:\n\n```julia\nvaried = Dict(:Ns__all => [50, 100, 200])   # (50, 50), (100, 100), (200, 200)\n```\n\n`__all` works for tuples of any length (the shape comes from the tuple in the parameters), so one sweep\ndefinition serves 1D, 2D and 3D setups. The generated parameters—and therefore the data files—are identical to\nthose of an explicit tuple sweep such as `:Ns => [(50, 50), (100, 100), (200, 200)]`.\n\n## 2. Analytical Reference Functions\n\nError statistics (L1/L2 errors, …) need the exact solution. Provide the **name of a reference factory**: a function that receives the run's parameters and returns the exact solution as a function of a spacetime coordinate `x::SVector{D}` (`x[end]` is the time for transient data). The factory lets the exact solution depend on the parameters (wave speed, initial condition, …):\n\n```julia\nexact_wave_factory(params) = x -> SVector(sin(2π * (x[1] - params[:c] * x[end])))\n\nconfig = SimulationConfig(shared, methods, [:upwind];\n    reference = :exact_wave_factory,\n)\nrun_all_simulations(config; calculate_stats = true)\n```\n\nThe reference may return an `SVector`, a tuple/vector or (for scalar fields) a plain number. It is evaluated once at every grid node or particle, in parallel. Statistics that come out entirely `NaN` (for example errors without a reference) are dropped.\n\nMethods whose name contains a word starting with `analytic`, `reference`, `exact`, `baseline` or `true` (e.g. `:analytic`, `:exact_solution`) are treated as reference methods and skipped by the pipeline; frontends can generate them on demand with [`generate_reference_simdata`](@ref).\n\n## 3. Custom Post-Processing\n\n`postprocess` names a function that receives every dataset after the statistics pass. Change the data and return `true` to save the changes; any other return value (including `nothing`) leaves the data untouched. Each file records the post-processors that ran on it (per name: the digests of the `sources` and the package's version), so each runs once per dataset: on new data, and for a post-processor of another name (configurations that differ only in the post-processor share their data files). Data post-processed by another version of it (other `sources` or package version; with `on_changed_sources = :ignore` only another package version) is kept and counted as `outdated` in the summary, with a warning: `run_all_simulations(config; force_postprocess = true)` applies it to every dataset again, also to data it has processed already. So make the function idempotent where you can (e.g. set a statistic rather than accumulate into the solution). Files written by earlier versions of PDEStudioCore have no record: the first run post-processes them. Return `true` only when it changed something (the data, its statistics or its `metadata`): saving rewrites the file (and drops its cached conversions). Statistics stored in the file are not recomputed after a post-processor changed the solution.\n\n```julia\nfunction add_maximum(data)\n    add_stat!(data, :maximum, maximum(v -> v[1], data.u), Symbol[])\n    return true   # save the modified dataset\nend\n\nconfig = SimulationConfig(shared, methods, [:upwind]; postprocess = :add_maximum)\n```\n\n## 4. Source Files\n\n`sources` lists files that are included into the target module at the start of [`run_all_simulations`](@ref), so your solvers and reference functions are always defined and up to date (`load_sources = false` skips that, for a caller that includes them itself). For reproducibility, the SHA-256 digest of every source file is stored with each newly computed dataset (`data.metadata[:sources]`, mapping the absolute path to its digest).\n\nThe digests are compared on later runs: a stored result made with other source code (other contents of the source files, or another version of the solver's package) is kept with a warning by default. `on_changed_sources = :recompute` runs these tasks again, `:ignore` keeps them silently. Every dataset written by this version also records its provenance in its metadata (`data.metadata[:provenance]`: versions, host, git commit, solver and wall time, see [Metadata](data.md#Metadata)).\n\n```julia\nconfig = SimulationConfig(shared, methods, [:upwind];\n    sources = [\"src/wave_equations.jl\", \"src/boundary_conditions.jl\"],\n)\n```\n\n## 5. Execution Options\n\n```julia\nrun_all_simulations(config;\n    force_overwrite = false,   # rerun and recompute everything\n    calculate_stats = false,   # pass 2: evaluate registered statistics\n    force_stats = false,       # recompute all statistics (solvers are not rerun)\n    post_process    = true,    # pass 3: run `config.postprocess`\n    force_postprocess = false, # run it on datasets it ran on already\n    parallel        = false,   # pass 1 over Julia threads\n    on_changed_sources = :warn,  # stored results of other source code: :warn, :recompute or :ignore\n    dry_run         = false,   # only report what would run\n)\n```\n\nIt returns a [`RunSummary`](@ref): the tasks that ran, were cached, produced nothing or failed (with the error message), the results made with other source code, the outcome counts of the statistics and post-processing passes, and the data file of every task (`files`). It prints as a short report:\n\n```text\nRunSummary: 12 task(s) in 41.3 s: 2 ran, 9 cached, 1 failed\n  stored: 11 of 12 result(s) (files)\n  statistics: 2 ran, 10 cached\n  post-processing: 2 ran, 10 skipped\n  failed: N = 400, scheme = weno: DomainError with -0.1: …\n```\n\nWith `dry_run = true` no solver, statistic or post-processor runs and nothing is written (the `sources` are still included); the summary lists what would run, and its `files` the data the configuration needs that is stored already (`nothing` for what would be computed). That makes it easy to work on a copy, e.g. on shared data that must not change:\n\n```julia\ns = run_all_simulations(config; dry_run = true)\nwork = mktempdir()                         # or a folder of your own\nmkpath(joinpath(work, \"data\"))\nfor f in filter(!isnothing, s.files)       # the stored results (the file names keep their hashes)\n    cp(f, joinpath(work, \"data\", basename(f)))\nend\nset_save_path!(work)                       # the copies are found under the same parameters\nrun_all_simulations(config; calculate_stats = true)   # computes only what is missing, into the copies\n```\n\nThe configuration's code (`config.sources`, the post-processor and custom statistics) belongs with it; see [Source Files](#4.-Source-Files).\n\n- Existing data is never recomputed unless `force_overwrite = true`; statistics are only evaluated for datasets that miss them (or whose kept dimensions changed, or that were evaluated without a reference that is now configured). `force_stats = true` recomputes the statistics only.\n- A failing solver, statistic or post-processing step is logged with its parameters, listed in the summary, and the batch continues.\n- Solvers may return `NoSimData()` (or `nothing`) when there is nothing to store.\n- If a solver modifies its parameters, the result is still stored under the parameters of the task (with a warning), so it can always be found again.\n- Functions defined while the pipeline runs (e.g. through `sources`) are called in the latest world age.\n","changed":[[98,98],[102,102],[108,121]],"added":16,"removed":2},{"name":"aisignoff.md","path":"docs/src/aisignoff.md","type":"file","files":1,"lines":35,"levels":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A0"},"declaration":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A0","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":[],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"commit 5a733de (Publish the AI signoff report with the docs (#1…), pull request checkboxes"},"errors":[],"parts":[{"lines":35,"runs":[[1,35]],"declaration":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A0","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":[],"Reviewed-by":["Pascal Jung \u003c "],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [4]"},"errors":[],"counts":{"AI-Generation":{"files":{"G2":0.013333333333333334,"G3":0.9866666666666667},"lines":{"G2":2,"G3":148}},"Human-Review":{"files":{"H0":0.013333333333333334,"H1":0.2533333333333333,"H2":0.7333333333333333},"lines":{"H0":2,"H1":38,"H2":110}},"AI-Review":{"files":{"A0":0.006666666666666667,"A1":0.9933333333333333},"lines":{"A0":1,"A1":149}}},"parts":[{"lines":110,"runs":[[1,53],[75,96],[100,103],[111,111],[113,132],[134,138],[142,143],[147,149]],"declaration":{"AI-Generation":"G3","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [4]"},"levels":{"AI-Generation":"G3","Human-Review":"H2","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":36,"runs":[[54,74],[97,99],[104,109],[139,141],[144,146]],"declaration":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] 5dd99bd"},"levels":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":1,"runs":[[110,110]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] 6e36904"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":1,"runs":[[112,112]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A0","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":[],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"commit d60e6c7 (restricted name lookup, derived datasets, hash …), pull request checkboxes"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A0"},"errors":[],"advisory":false},{"lines":2,"runs":[[133,133],[150,150]],"declaration":{"AI-Generation":"G2","Human-Review":"H1","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] 7018d35"},"levels":{"AI-Generation":"G2","Human-Review":"H1","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"# Data: Creation, Storage and Conversion\n\n## 1. Creating Datasets\n\n[`create_sim_data`](@ref) builds Eulerian and Lagrangian datasets of any dimension. The global statistic registry is copied into the dataset, the parameters are copied, and `:Solution` is coupled to `u`.\n\n### Eulerian (grids)\n\n```julia\n# 1D + time: u[i, n]\ncreate_sim_data(x, u, t, params)\n\n# 2D + time from axis vectors: u[i, j, n]\ncreate_sim_data((x, y), u, t, params)\n\n# static 3D field with custom axis names\ncreate_sim_data((r, θ, φ), ρ, params; dims = (:r, :θ, :φ))\n\n# ndgrid-style coordinate arrays (x_grid[i, j] == x[i])\ncreate_sim_data((x_grid, y_grid), u, t, params)\n```\n\nThe solution may be given as\n- an array of `SVector`s (`M` components),\n- an array of numbers (a scalar field, `M = 1`),\n- an array of numbers with one extra trailing dimension holding the components (`u[i, j, n, c]`),\n- an array of vectors.\n\nInteger data is stored as `Float64`; `Float32` data stays `Float32`. Axes must be sorted. Beyond three spatial dimensions the default axis names are `:x1, :x2, …`; time is always the last axis (`time_dim = :t` by default).\n\n`xmins`, `xmaxs`, `tmin` and `tmax` override the bounding box (e.g. the physical domain `[0, 1]` of a cell-centred grid). The integration measure (`domain.spacing`) is always the mean node distance of the axes, independent of these overrides.\n\n### Lagrangian (particles)\n\n```julia\n# x_traj[n][p]::SVector{DS}, u_traj[n][p]::SVector{M} (or numbers), one entry per time step\ncreate_sim_data(x_traj, u_traj, t, params; dims = (:x, :y))\n\n# static particles (no time axis)\ncreate_sim_data(positions, values, params)\n```\n\nParticle counts may differ between time steps. The bounding box defaults to the extent of all positions.\n\n### Direct construction\n\nThe `ESimData`/`LSimData` constructors validate their input (matching axes and solution sizes, consistent dimensions, time as the last axis) and couple `:Solution` themselves, so derived datasets never need any bookkeeping:\n\n```julia\nESimData(params, domain, axes, u)          # DS is inferred from the domain\nLSimData(params, domain, t, x, u)\n```\n\n### Metadata\n\nInformation about a run that isn't data, such as iteration counts, a convergence flag or the provenance, goes into `data.metadata` (a `Dict{Symbol, Any}`), not into the statistics: it is saved and loaded with the data but never plotted.\n\n```julia\ndata = create_sim_data(x, u, t, params; metadata = Dict(:iterations => 412, :converged => true))   # e.g. in a solver\ndata.metadata[:note] = \"rerun with the fixed boundary\"\nsave_sim_data(data; overwrite = true)\nload_sim_data(params).metadata[:iterations]   # 412\n```\n\nThe pipeline writes three entries itself (any value of the same name is replaced):\n\n| Entry | Content |\n| :--- | :--- |\n| `:provenance` | how the data was made: versions of PDEStudioCore and Julia, host, time, number of threads, git commit of the active project (the repository its folder is in, read from `.git`; uncommitted changes are not recorded), and for pipeline runs the solver (`:solver`, `:solver_module`, `:solver_version`) and the seconds it took (`:wall_time`) |\n| `:sources` | SHA-256 digests of the source files of the run (pipeline runs with `sources`) |\n| `:postprocessed` | the post-processors that ran on this data (name => the digests of the source files and the package's version), so the pipeline doesn't run them again |\n\nThe metadata saved is the dataset's own: new data replaces the stored metadata (with a new provenance, without `:sources` and `:postprocessed`), and an entry you remove from `data.metadata` stays removed when you save. Writing the same data again (statistics, post-processing, [`rehash_sim_data`](@ref), `save_sim_data` of the stored data, e.g. after [`add_stat!`](@ref), or a recomputed dataset) takes the pipeline's entries of the stored metadata it doesn't have; `:postprocessed` only if the data still has the stored statistics (a recomputed dataset lacks what a post-processor added). Conversions carry the metadata of their source. Metadata is read with every dataset, so keep it small (large results belong into statistics or files of their own).\n\n## 2. The Statistics View\n\n`data.stats` returns a [`StatsView`](@ref): a dictionary whose `:Solution` entry is `data.u` itself.\n\n| Operation | Effect |\n| :--- | :--- |\n| `data.stats[:Solution]` | returns `data.u` |\n| `data.stats[:Solution] = v` / `data.u = v` | replaces the solution (size-checked) |\n| `delete!(data.stats, :Solution)` | error: the solution cannot be removed |\n| `data.stats[:name] = v`, `delete!(data.stats, :name)` | edit derived statistics |\n| `keys`, `values`, `pairs`, `haskey`, `get`, `length` | as for a `Dict`, including `:Solution` |\n| `copy(data.stats)` | plain `Dict` snapshot |\n\nOn disk, the solution is stored once (in `u`).\n\n## 3. Storage Layout\n\nData lives in `\u003csave path>/data/\u003ctimestamp>_\u003csha256>.jld2`. The hash is computed from the normalised parameters ([`calculate_hash`](@ref)), so a run is found again from its parameters alone. Each file contains:\n\n| Entry | Content |\n| :--- | :--- |\n| `\"raw\"` | the native dataset |\n| `\"native\"`, `\"params\"`, `\"stat_keys\"`, `\"registry\"`, `\"shape\"`, `\"dim_keys\"`, `\"time_dim\"` | fast metadata, read without loading the data (`\"shape\"` is `size(u)`, or time steps and total particle count for Lagrangian data; the axes are stored since November 2026, see [`get_sim_data_info`](@ref)) |\n| `\"format_version\"` | the layout of the file (see below) |\n| `\"metadata\"` | the dataset's `metadata` (stored once, here: `\"raw\"` holds the dataset without it), read and updated without loading the data |\n| `\"evaluated_stats\"` | statistics already evaluated for this data |\n| `\"evaluated_with_reference\"` | whether a reference function was available when they were evaluated |\n| `\"conv_L\"`, `\"conv_E_\u003cn1>x\u003cn2>…\"` | cached conversions |\n\nOther entries (e.g. written with JLD2 directly) are kept when the data is rewritten.\n\nThe **format version** is 3 for files written by this version. Files of PDEStudioCore 0.4 (version 1: no version entry, no axes, datasets without the `metadata` field) are read as they are, nothing is recomputed: their datasets are read as the current types, with the entries stored next to the data (`\"sources\"` and those of `save_sim_data(...; metadata)` in 0.4) as metadata. [`upgrade_sim_data`](@ref) writes them in the current layout. The pipeline does the same with a file whose metadata changes (e.g. a post-processing record); cached conversions are dropped then. Files of earlier versions are upgraded by the pipeline when it finds them, or recomputed if their data doesn't load.\n\n**Data folders shared with PDEStudioCore 0.4:** an older version that rewrites a file (e.g. `force_overwrite`) keeps the `\"metadata\"` entry of the data it replaced (its provenance and post-processing record), so this version would take its new data as post-processed already. After such runs, use `run_all_simulations(config; force_postprocess = true)` once.\n\nWrites are atomic: a file is written to a temporary path and renamed into place, so an interrupted run never corrupts existing data, and rewriting the data does not grow the file. This includes the bookkeeping entries of the statistics pass and cached conversions: they are written into a copy of the file that then replaces it (a changed bookkeeping entry grows the file by about its own size, a few hundred bytes to a few kB). When the data itself is rewritten, the other entries are loaded and stored again: load the packages that define the types of entries you stored yourself first, otherwise they are kept as JLD2's reconstructions (with a warning). Writers in several processes are not coordinated: if two of them rewrite the same file at once, the last rename wins. Rewriting the raw data drops stale conversion caches but keeps any other entries (including groups) you stored yourself.\n\nConverted and reference datasets carry the parameters of the native run, so they map to the same file. They are marked as derived (`data.metadata[:derived]` is `:conversion` or `:reference`), and [`calculate_all_stats!`](@ref) never saves them: neither over the native data nor as the data of parameters that have no file yet (the next run would take the reference for the solver's result). An explicit `save_sim_data(...; overwrite = true)` of such a dataset does store it, as the native data of its parameters.\n\n## 4. Loading and Converting\n\n```julia\nload_sim_data(params)                         # native data\nload_sim_data(params, :eulerian, (100, 50))   # grid at spacetime resolution (Nx, Nt)\nload_sim_data(params, :lagrangian)            # particles\nenable_cache!(true)                           # store conversions in the file\n```\n\n- **Eulerian → Eulerian** ([`resample_eulerian`](@ref)): linear interpolation in space, nearest-neighbour in time (no cross-fading of snapshots); statistics are resampled along the dimensions they keep. Axes whose resolution does not change (e.g. adaptive time steps) are kept as they are.\n- **Lagrangian → Eulerian** ([`convert_to_eulerian`](@ref)): inverse-distance scatter of particles and per-particle statistics; empty cells become `NaN`. Output times take the nearest recorded snapshot.\n- **Eulerian → Lagrangian** ([`convert_to_lagrangian`](@ref)): grid nodes become stationary particles (sharing one position vector); fields become per-particle statistics.\n\nThe resolution `res` always lists every axis: the spatial resolutions followed by the number of time slices.\n\n## 5. Managing Data\n\n```julia\ndoes_sim_data_exist(params)                         # without loading the data\nget_sim_data_info(params)                           # kind, shape, axes and stored time steps, without loading the data\nfind_sim_data(Dict(:N => 100))                      # list the files of every run with N = 100 (any subset of the parameters)\ndelete_sim_data(Dict(:scheme => \"upwind\"); dry_run = true)   # preview, then delete\nrehash_sim_data(joinpath(get_save_path(), \"data\"); remove_keys = [:obsolete])\nload_sim_data(\"a1b2c3\"; key = \"raw\")                # by hash prefix (REPL inspection)\ncheck_data(data)                                    # min/max/mean/NaN summary as a DataFrame\nsim_data_table(Dict(:scheme => \"upwind\"))           # one row per run: file, size, shape, stats, solver, wall time, parameters\ntidy_sim_data(dry_run = true)                       # older duplicates of a run and leftovers of killed writes\nupgrade_sim_data()                                  # bring files of earlier versions to the current format\n```\n\n`find_sim_data` prints one line per matching file (newest first) with the remaining parameters and returns the paths; `delete_sim_data` deletes exactly the files it would list and refuses an empty filter. `rehash_sim_data` writes the renamed file before removing the old one. `sim_data_table` reads only the metadata of each file, so it is quick for large data folders. A run stored more than once (e.g. by parallel jobs computing the same parameters) is always looked up as its newest file; `tidy_sim_data` removes the older ones and temporary files of writes that never finished.\n\nLookups list the data directory once per change rather than on every call (an index that is rebuilt when the directory changes), so they stay fast with thousands of files. Files added or removed by other processes are seen. (On file systems with coarse or cached directory times, such as FAT or NFS, a newer duplicate of a stored run that another process wrote can be found only after the directory changes again; until then the older file of the same parameters is used.)\n\n## 6. Parameter Normalisation\n\nBefore hashing and saving, parameters are normalised: closures become `\"Closure\"`, custom structs become a descriptive string and other values round-trip through [`val2str`](@ref)/[`str2val`](@ref). Strings are always kept verbatim, so a parameter such as `:ic => \"sin\"` stays a string. [`str2val`](@ref) only parses literals (numbers, strings, symbols, tuples, vectors, `Dict`s, static arrays, arithmetic like `2π` and a range as the whole value, e.g. a sweep typed as `1:10`); it never executes code. Types come from an allowlist (numbers, text, the containers [`val2str`](@ref) writes and StaticArrays), and what a value may build is bounded (elements, digits, the size of types including static arrays, nesting), so a file cannot run code, and these limits bound what the parser computes and compiles for a text; anything else is kept as a string. Inspect the stored form with [`print_clean_params`](@ref).\n","changed":[],"added":0,"removed":0},{"name":"examples.md","path":"docs/src/examples.md","type":"file","files":1,"lines":45,"levels":{"AI-Generation":"G3","Human-Review":"H2","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["bl },"levels":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"# PDEStudioCore.jl\n\n**PDEStudioCore.jl** is a headless-safe Julia backend for running, storing and analysing Partial Differential Equation (PDE) simulations.\n\nDesigned with reproducible research in mind, it provides strictly typed, precision-agnostic Eulerian and Lagrangian datasets of any dimension, deterministic parameter hashing with atomic on-disk caching, declarative parameter sweeps and a multithreaded statistics pipeline.\n\n---\n\n## 🏗️ Core Data Structures\n\nAll simulation outputs are wrapped in strongly typed structures that map the mathematical domain of the data.\n\n| Type | Description | Main fields |\n| :--- | :--- | :--- |\n| `ESimData{D, DS, M, T}` | Eulerian data: fields on a structured tensor grid. | `axes`, `u`, `stats` |\n| `LSimData{D, DS, M, T}` | Lagrangian data: particles recorded at discrete times. | `t`, `x`, `u`, `stats` |\n\n`D` is the number of spacetime dimensions, `DS` the number of spatial dimensions (`D == DS` for static data), `M` the number of field components and `T` the floating point precision.\n\n*Example: an Eulerian simulation in 2D space over time with 4 state variables in `Float64` precision is an `ESimData{3, 2, 4, Float64}`.*\n\nDatasets of any dimension are created with a single function, [`create_sim_data`](@ref):\n\n```julia\ncreate_sim_data(x, u, t, params)               # 1D + time\ncreate_sim_data((x, y), u, t, params)          # 2D + time\ncreate_sim_data((x, y, z), ρ, params)          # static 3D field\ncreate_sim_data(x_traj, u_traj, t, params)     # particles over time\n```\n\n### The solution is a statistic, by construction\n\n`data.stats` is a dictionary view ([`StatsView`](@ref)) in which `:Solution` is always present and always *is* `data.u`:\n\n```julia\nsim = create_sim_data(x, u, t, params)\nsim.stats[:Solution] === sim.u    # true: the same array, never a copy\nsim.u = u_new                     # :Solution follows automatically\nkeys(sim.stats)                   # :Solution plus every derived statistic\n```\n\nThis holds for every dataset, however it was produced: `create_sim_data`, the `ESimData`/`LSimData` constructors, conversions, resampling, reference generation or loading from disk. `:Solution` cannot be deleted, is never stored twice on disk, and its kept dimensions are always all dimensions.\n\n---\n\n## 🧩 The Simulation Configuration (`SimulationConfig`)\n\n[`SimulationConfig`](@ref) is the blueprint of a batch of runs. It binds your solver (referenced by name) to its parameter space:\n\n| Field | Meaning |\n| :--- | :--- |\n| `shared` | Baseline parameters of every run (including `:sim_func_name`, the solver's name). |\n| `methods` | Per-method parameter overrides (e.g. `:upwind`, `:lax_wendroff`). |\n| `defaults` | The methods that are executed (default: all methods). |\n| `varied` | The parameter sweep; the Cartesian product of all vectors is run. |\n| `reference` | Name of a reference factory `params -> (x -> u_exact)` used for error statistics. |\n| `postprocess` | Name of a function `data -> Bool` run once on every dataset (`true` saves the changes it made). |\n| `sources` | Files included into the target module before running. |\n\n```julia\nconfig = SimulationConfig(shared, methods; varied = Dict(:N => [50, 100, 200]))\nrun_all_simulations(config; calculate_stats = true)\n```\n\n---\n\n## 📖 The Configuration Dictionaries\n\n*   **`ParamDict` (`Dict{Symbol, Any}`):** the flat, resolved parameters of a single run (e.g. `:N => 100`, `:cfl => 0.2`). It is passed to your solver, and its normalised content is hashed to locate the run on disk.\n*   **`MethodDict` (`Dict{Symbol, ParamDict}`):** method-specific overrides on top of the shared parameters. `:ignore => [:key1, :key2]` removes shared keys for one method.\n*   **`VariedDict` (`Dict{Symbol, Vector}`):** the sweep definition. Keys such as `:Ns__x` sweep a single entry of a tuple parameter, `:Ns__all` all of them together.\n\nString keys are accepted everywhere and converted to `Symbol`s.\n\n---\n\n## ⚙️ Main API Functions\n\n*   **[`run_all_simulations`](@ref)`(config; kwargs...)`:** runs every task of the sweep that is not on disk yet, then (optionally) computes statistics and runs your post-processing on the datasets it hasn't processed yet. Failures of single tasks are logged and do not abort the batch; the returned [`RunSummary`](@ref) lists what ran, what was cached and what failed (`dry_run = true` only reports what would run).\n*   **[`generate_tasks`](@ref)`(config)`:** the parameter sets of a sweep, e.g. to load its results: `[load_sim_data(p) for p in generate_tasks(config)]`.\n*   **[`load_sim_data`](@ref)`(params[, kind, res])`:** loads the native data, or an Eulerian/Lagrangian representation that is converted (and optionally cached) on demand.\n*   **[`calculate_all_stats!`](@ref)`(data, ref_func)`:** evaluates all registered statistics (mass, L1/L2 errors, …) against an exact reference, on grids and on particles.\n\n---\n\n## 📊 Custom Statistics\n\nRegister a statistic with the dimensions it *keeps* and implement [`calc_stat`](@ref) for it; the backend integrates out the others:\n\n```julia\nregister_stat!(:my_error, :time)   # one value per time step\n\nfunction PDEStudioCore.calc_stat(::Val{:my_error}, fixed_coords, u, ana, domain::DomainInfo)\n    return sum(abs.(u .- ana)) * get_integration_measure(:my_error, domain)\nend\n```\n\nPre-computed values are attached with [`add_stat!`](@ref). See [Statistics and Analytics](statistics.md) for details.\n\n---\n\n## 🛠️ Dimension Keys (`dim_keys`)\n\nThe `dim_keys` tuple of a [`DomainInfo`](@ref) is the *sole identifier* of the axes, e.g. `(:x, :y, :t)`. Names and order matter for interpolation, statistical slicing and plotting. The time axis, if present, is always the last one. You can name the axes freely (`dims = (:r, :θ)`), but keep the layout of a model stable once data has been written to disk.\n\n---\n\n## 🚀 Examples\n\nEvery `test_*()` function returns a ready configuration of a built-in example, e.g. `run_all_simulations(test_heat_1d())`: linear advection, Burgers, the heat equation in 1D and 2D, the Poisson equation and particles in a rotating flow. See [Examples](examples.md); their solvers in `src/Examples/` are a starting point for your own. The [Simulation Config](simulation_config.md) page walks through a complete setup step by step.\n","changed":[],"added":0,"removed":0},{"name":"simulation_config.md","path":"docs/src/simulation_config.md","type":"file","files":1,"lines":97,"levels":{"AI-Generation":"G3","Human-Review":"H2","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [4]"},"errors":[],"counts":{"AI-Generation":{"files":{"G3":1.0},"lines":{"G3":97}},"Human-Review":{"files":{"H0":0.010309278350515464,"H2":0.9896907216494846},"lines":{"H0":1,"H2":96}},"AI-Review":{"files":{"A0":0.010309278350515464,"A1":0.9896907216494846},"lines":{"A0":1,"A1":96}}},"parts":[{"lines":96,"runs":[[1,8],[10,97]],"declaration":{"AI-Generation":"G3","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [4]"},"levels":{"AI-Generation":"G3","Human-Review":"H2","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":1,"runs":[[9,9]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A0","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":[],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"commit d60e6c7 (restricted name lookup, derived datasets, hash …), pull request checkboxes"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A0"},"errors":[],"advisory":false}],"source":"# Orchestrating with SimulationConfig\n\n[`SimulationConfig`](@ref) is the central orchestration structure of **PDEStudioCore.jl**. Instead of writing nested loops over parameters, numerical methods and resolutions, you describe the batch once. The backend expands it into the exact Cartesian product of your parameter space, hashes every parameter set and runs only what is not on disk yet.\n\n---\n\n## Step 1: Setting the Target Module\n\nPDEStudioCore is a serialised, headless backend: functions are referenced by **name** (a `Symbol` or `String`), never as closures, so that every run is fully described by plain data. First, tell the backend in which module these names are looked up (usually `Main` or your own module). Only functions *defined* in that module (or a submodule of it) are found: a name the module merely imports, such as an export of `Base` or of another package, is refused, so a configuration file cannot name `rm` or `delete_sim_data` as a solver; wrap such a function in your own if you need it.\n\n```julia\nusing PDEStudioCore\nusing StaticArrays\n\nPDEStudioCore.set_target_module!(@__MODULE__)\nset_save_path!(joinpath(@__DIR__, \"results\"))   # data goes to results/data/\n```\n\n## Step 2: Defining the Solver\n\nThe solver receives one argument, the [`ParamDict`](@ref) of a run, and returns a dataset built with [`create_sim_data`](@ref) (or `NoSimData()` if it has nothing to store). It receives a copy of the parameters; the result is always stored under the parameters of the task.\n\n```julia\nfunction my_wave_solver(params::ParamDict)\n    N, cfl, scheme = params[:N], params[:cfl], params[:scheme]\n    x = collect(range(0.0, 1.0, length = N))\n    t = collect(range(0.0, params[:T], length = 50))\n\n    u = zeros(N, length(t))   # ... run your numerical scheme here ...\n\n    return create_sim_data(x, u, t, params)   # numeric arrays are scalar fields (M = 1)\nend\n```\n\n## Step 3: The Shared Parameters\n\nThe first layer of the hierarchy holds the values that every run shares. The solver is selected with the `:sim_func_name` parameter; since it is a parameter, it is part of the hash, and methods may override it to use different solvers.\n\n```julia\nshared = Dict(\n    :sim_func_name => :my_wave_solver,\n    :L => 1.0,     # domain length\n    :T => 5.0,     # final time\n    :N => 100,     # default resolution (swept below)\n)\n```\n\n## Step 4: Method Overrides\n\nThe second layer maps method names to parameter overrides; they replace matching shared keys. Use `:ignore => [:key1, :key2]` to drop shared keys for a single method.\n\n```julia\nmethods = Dict(\n    :upwind       => Dict(:scheme => \"Upwind\",       :cfl => 0.5),\n    :lax_wendroff => Dict(:scheme => \"Lax-Wendroff\", :cfl => 0.8),\n)\n```\n\n## Step 5: The Sweep\n\n`varied` lists the values to sweep. A varied key is applied to every method whose parameters contain that key (here: through `shared`).\n\n```julia\nvaried = Dict(:N => [50, 100, 200])\n```\n\n## Step 6: Assembly and Execution\n\n```julia\nconfig = SimulationConfig(shared, methods, [:upwind, :lax_wendroff]; varied = varied)\n\nconfig                    # prints a summary of the configuration\ngenerate_tasks(config)    # the 6 parameter sets (2 methods × 3 resolutions)\n\nrun_all_simulations(config)                               # runs what is missing\nresults = [load_sim_data(p) for p in generate_tasks(config)]\n```\n\nThe third positional argument (`defaults`, the methods to run) is optional and defaults to all methods of `methods`. Without any methods, the shared parameters are run on their own: `SimulationConfig(shared; varied = varied)`.\n\n---\n\n## Reference: Fields and Arguments\n\n| Field | Constructor argument | Meaning |\n| :--- | :--- | :--- |\n| `shared` | 1st positional | Baseline parameters shared by all runs. |\n| `methods` | 2nd positional | Per-method overrides (`MethodDict`). |\n| `defaults` | 3rd positional | Methods executed by `run_all_simulations` (default: all). |\n| `varied` | keyword `varied` | The sweep (`VariedDict`). |\n| `reference` | keyword `reference` | Name of the reference factory, see [Advanced Config](advanced_config.md). |\n| `postprocess` | keyword `postprocess` | Name of the post-processing function. |\n| `sources` | keyword `sources` | Files included into the target module before running. |\n\nAll dictionaries may use `String` or `Symbol` keys, and assigning a field (e.g. `config.reference = \"exact_factory\"`) accepts the same loose input as the constructor.\n\nUnknown keywords and field names raise an error.\n","changed":[],"added":0,"removed":0},{"name":"statistics.md","path":"docs/src/statistics.md","type":"file","files":1,"lines":101,"levels":{"AI-Generation":"G3","Human-Review":"H2","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [4]"},"errors":[],"counts":{"AI-Generation":{"files":{"G3":1.0},"lines":{"G3":101}},"Human-Review":{"files":{"H0":0.019801980198019802,"H2":0.9801980198019802},"lines":{"H0":2,"H2":99}},"AI-Review":{"files":{"A1":1.0},"lines":{"A1":101}}},"parts":[{"lines":99,"runs":[[1,53],[56,101]],"declaration":{"AI-Generation":"G3","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [4]"},"levels":{"AI-Generation":"G3","Human-Review":"H2","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":2,"runs":[[54,55]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] 6e36904"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"# Statistics and Analytics\n\n**PDEStudioCore.jl** features a multithreaded statistics pipeline. Instead of writing loops that average data over space or time, you register what a statistic keeps; the backend slices your Eulerian tensors or Lagrangian particle series accordingly, evaluates your function on every slice and stores the reduced data with the dataset.\n\nEvery dataset exposes its statistics through `data.stats`, a dictionary view in which `:Solution` is always present and always refers to `data.u`. Derived statistics live next to it:\n\n```julia\ndata.stats[:Solution] === data.u   # true\ndata.stats[:l2error]                # a derived statistic\ncopy(data.stats)                    # a plain Dict snapshot\n```\n\nThe global statistics registry starts empty, so the backend makes no assumptions about your model.\n\n## 1. Loading Presets\n\nPredefined suites of statistics live in the `presets/` directory. For hyperbolic PDEs (mass, L1/L2 errors, …):\n\n```julia\nusing PDEStudioCore\nset_stat_preset!(\"hyperbolic\")\n```\n\n## 2. Automated Integration (via `calc_stat`)\n\n### Step A: Register the Statistic\n\nRegister the statistic's name and the dimensions to **retain**; all other dimensions are integrated out:\n\n```julia\nregister_stat!(:custom_energy, :time)   # one value per time step\n```\n\nValid kept dimensions are the aliases `:all` (pointwise field), `:space` (integrates out time), `:time` (integrates out space), a single dimension name such as `:x`, or a vector of names such as `[:x, :t]` (`Symbol[]` gives a single scalar). The statistic's array always has its axes in domain order, and [`get_kept_dims`](@ref) reports them in that order.\n\n### Step B: Overload `calc_stat`\n\n```julia\nfunction PDEStudioCore.calc_stat(::Val{:custom_energy}, fixed_coords, u, ana, domain::DomainInfo)\n    measure = get_integration_measure(:custom_energy, domain)   # e.g. dx * dy\n    return sum(abs2.(u)) * measure\nend\n```\n\n**Arguments**\n*   `::Val{:name}`: the dispatch token of your statistic.\n*   `fixed_coords`: the coordinates of the kept dimensions for the current slice (an `SVector`).\n*   `u`: the numerical values of the slice (a flat vector of `SVector`s).\n*   `ana`: the reference values of the slice (`NaN`s if no reference is available).\n*   `domain`: the [`DomainInfo`](@ref), giving access to the spacing, bounds and registry.\n\nThe function must return an `SVector` with one entry per field component.\n\nThe integration measure is the product of the mean node spacings of the integrated dimensions, so `sum(u .* measure)` is a rectangle rule over all nodes. That is exact for periodic grids without the duplicate endpoint and harmless where the solution vanishes on the boundary, but on a grid that contains both endpoints of an axis it counts the boundary nodes fully: `u ≡ 1` on `[0, 1]` with `N` nodes integrates to `N/(N - 1)`. Convergence orders are unaffected; absolute masses and norms carry this `O(h)` offset.\n\n### Step C: Evaluate\n\n```julia\ncalculate_all_stats!(data, ref_func)     # ref_func(x::SVector{D}) -> exact value, or nothing\n```\n\n[`calculate_all_stats!`](@ref) evaluates every statistic of the global registry that the dataset does not have yet (all of them with `force_overwrite = true`) and saves the dataset (`save = false` keeps it in memory only). Statistics registered *after* a dataset was created are picked up, and a statistic whose kept dimensions changed is recomputed. Results that are entirely `NaN` (typically errors without a reference) are dropped and remembered as evaluated, so the pipeline does not reload the data for them again. The pipeline also remembers whether a reference was available, so these statistics are evaluated again automatically once `config.reference` is set; `run_all_simulations(config; calculate_stats = true, force_stats = true)` recomputes every registered statistic without rerunning the solvers.\n\nConverted and reference datasets (from `load_sim_data(p, :lagrangian)`, `resample_eulerian`, `generate_reference_simdata`, …) share the parameters of the native run. Their statistics are computed as usual, but they are never saved over the native data: `calculate_all_stats!` warns and keeps them in memory. Pass `save = false` for such datasets to skip the check.\n\n### Lagrangian Data\n\nOn particle data, statistics can keep\n- no dimension: one value over all particles and time steps,\n- the time dimension: one value per time step,\n- all dimensions: one value per particle (`u` and `ana` are 1-tuples).\n\nOther combinations are skipped for Lagrangian data.\n\n## 3. Direct Injection (via `add_stat!`)\n\nSome statistics do not fit the integration pipeline: the run time of a solver, a global quantity that needs the entire dataset, or values computed elsewhere. Attach them directly with [`add_stat!`](@ref), declaring the dimensions they keep:\n\n```julia\nadd_stat!(data, :runtime, elapsed_seconds, Symbol[])          # scalar\nadd_stat!(data, :energy_history, energy_vector, :time)        # one value per time step\n```\n\nNumbers and arrays of numbers are converted to `SVector`s with the dataset's component count. Shapes are checked: against the kept axes for Eulerian data, and against the time steps and particle counts for Lagrangian data. `calculate_all_stats!` leaves statistics added this way alone, unless the same name is also registered globally (you get a warning if the kept dimensions differ). `delete_stat!(data, :runtime)` removes one again, and `delete_stat!(:name)` removes a statistic from the global registry.\n\nAssigning `data.stats[:name] = value` also works, but it does not record kept dimensions; prefer `add_stat!`.\n\n### Using `add_stat!` in Post-Processing\n\nA natural place for custom metrics is the post-processing function of a [`SimulationConfig`](@ref), which runs after the statistics pass:\n\n```julia\nfunction my_post_process(data)\n    add_stat!(data, :global_maximum, maximum(v -> v[1], data.u), Symbol[])\n    return true   # save the dataset\nend\n\nconfig = SimulationConfig(shared, methods, [:upwind]; postprocess = :my_post_process)\n```\n\n> **Note:** The kept dimensions recorded by `register_stat!`/`add_stat!` tell conversions and the **PDEStudio.jl** frontend how to slice and display a statistic.\n","changed":[],"added":0,"removed":0}],"added":16,"removed":2,"changed_files":1},{"name":"make.jl","path":"docs/make.jl","type":"file","files":1,"lines":32,"levels":{"AI-Generation":"G3","Human-Review":"H2","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [4]"},"errors":[],"counts":{"AI-Generation":{"files":{"G3":1.0},"lines":{"G3":32}},"Human-Review":{"files":{"H1":0.03125,"H2":0.96875},"lines":{"H1":1,"H2":31}},"AI-Review":{"files":{"A0":0.03125,"A1":0.96875},"lines":{"A0":1,"A1":31}}},"parts":[{"lines":31,"runs":[[1,23],[25,32]],"declaration":{"AI-Generation":"G3","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [4]"},"levels":{"AI-Generation":"G3","Human-Review":"H2","AI-Review":"A1"},"errors":[],"advis relative_mass, Symbol[])\nregister_stat!(:mass_error, :time)\nregister_stat!(:mass_signed_error, :time)\n\n# ==============================================================================\n# --- STANDARD METRICS ---\n# ==============================================================================\n\nfunction calc_stat(::Val{:mass}, fixed_coords, u, ana, domain::DomainInfo)\n    measure = get_integration_measure(:mass, domain)\n    return sum(u .* measure)\nend\n\nfunction calc_stat(::Val{:l1norm}, fixed_coords, u, ana, domain::DomainInfo)\n    measure = get_integration_measure(:l1norm, domain)\n    return sum(map(v -> abs.(v), u) .* measure)\nend\n\nfunction calc_stat(::Val{:l2norm}, fixed_coords, u, ana, domain::DomainInfo)\n    measure = get_integration_measure(:l2norm, domain)\n    return sqrt.(sum(map(v -> abs2.(v), u) .* measure))\nend\n\nfunction calc_stat(::Val{:wave_height}, fixed_coords, u, ana, domain::DomainInfo)\n    # A Lagrangian step can have no particles at all; there is no maximum then.\n    isempty(u) && return map(_ -> oftype(zero(eltype(eltype(u))), NaN), zero(eltype(u)))\n    return reduce((a, b) -> max.(a, b), u)\nend\n\n\n# ==============================================================================\n# --- ERROR METRICS (Naturally propagates NaNs if analytical data is missing) ---\n# ==============================================================================\nfunction calc_stat(::Val{:l1error}, fixed_coords, u, ana, domain::DomainInfo)\n    measure = get_integration_measure(:l1error, domain)\n    return sum(map((v, a) -> abs.(v - a), u, ana) .* measure)\nend\n\nfunction calc_stat(::Val{:relative_l1error}, fixed_coords, u, ana, domain::DomainInfo)\n    measure = get_integration_measure(:relative_l1error, domain)\n    error_norm = sum(map((v, a) -> abs.(v - a), u, ana) .* measure)\n    ana_norm = sum(map(a -> abs.(a), ana) .* measure)\n    return error_norm ./ ana_norm\nend\n\nfunction calc_stat(::Val{:l2error}, fixed_coords, u, ana, domain::DomainInfo)\n    measure = get_integration_measure(:l2error, domain)\n    return sqrt.(sum(map((v, a) -> abs2.(v - a), u, ana) .* measure))\nend\n\nfunction calc_stat(::Val{:relative_l2error}, fixed_coords, u, ana, domain::DomainInfo)\n    measure = get_integration_measure(:relative_l2error, domain)\n    error_norm = sqrt.(sum(map((v, a) -> abs2.(v - a), u, ana) .* measure))\n    ana_norm = sqrt.(sum(map(a -> abs2.(a), ana) .* measure))\n    return error_norm ./ ana_norm\nend\n\nfunction calc_stat(::Val{:relative_mass}, fixed_coords, u, ana, domain::DomainInfo)\n    measure = get_integration_measure(:relative_mass, domain)\n    sum_u = sum(u .* measure)\n    sum_ana = sum(ana .* measure)\n    m_ana = abs.(sum_ana) \n\n    M = length(eltype(u))\n    T = eltype(eltype(u)) # Dynamically get T\n    return SVector{M, T}(ntuple(M) do c\n        m_ana[c] \u003c 1e-9 ? T(NaN) : T(sum_u[c] / sum_ana[c])\n    end)\nend\n\nfunction calc_stat(::Val{:mass_error}, fixed_coords, u, ana, domain::DomainInfo)\n    measure = get_integration_measure(:mass_error, domain)\n    sum_u = sum(u .* measure)\n    sum_ana = sum(ana .* measure)\n    m_err = abs.(sum_u - sum_ana)\n    M = length(eltype(u))\n    T = eltype(eltype(u)) # Dynamically get T\n    return SVector{M, T}(ntuple(M) do c\n        m_err[c] \u003c 1e-9 ? T(1e-9) : T(m_err[c])\n    end)\nend\nfunction calc_stat(::Val{:mass_signed_error}, fixed_coords, u, ana, domain::DomainInfo)\n    measure = get_integration_measure(:mass_signed_error, domain)\n    sum_u = sum(u .* measure)\n    sum_ana = sum(ana .* measure)\n    return sum_u - sum_ana\nend\n\n# 2. Add the calc_stat overload\nfunction calc_stat(::Val{:spacetime_relative_mass}, fixed_coords, u, ana, domain::DomainInfo)\n    # Gets the combined integration measure for dx * dy * dz * dt\n    measure = get_integration_measure(:spacetime_relative_mass, domain)\n    \n    sum_u = sum(u .* measure)\n    sum_ana = sum(ana .* measure)\n    m_ana = abs.(sum_ana) \n\n    M = length(eltype(u))\n    T = eltype(eltype(u)) \n    \n    return SVector{M, T}(ntuple(M) do c\n        m_ana[c] \u003c 1e-9 ? T(NaN) : T(sum_u[c] / sum_ana[c])\n    end)\nend","changed":[],"added":0,"removed":0}],"added":0,"removed":0,"changed_files":0},{"name":"src","path":"src","type":"dir","files":19,"lines":4536,"counts":{"AI-Generation":{"files":{"G2":15.020359842576699,"G3":3.9796401574232996},"lines":{"G2":2397,"G3":2139}},"Human-Review":{"files":{"H0":0.6523623234744799,"H1":3.937794856268417,"H2":14.365227435641717,"undeclared":0.04461538461538461},"lines":{"H0":231,"H1":2218,"H2":2058,"undeclared":29}},"AI-Review":{"files":{"A0":0.3666984971437198,"A1":18.588686118240894,"undeclared":0.04461538461538461},"lines":{"A0":86,"A1":4421,"undeclared":29}}},"errors":0,"children":[{"name":"Examples","path":"src/Examples","type":"dir","files":7,"lines":444,"counts":{"AI-Generation":{"files":{"G2":6.96875,"G3":0.03125},"lines":{"G2":442,"G3":2}},"Human-Review":{"files":{"H0":0.03125,"H2":6.96875},"lines":{"H0":2,"H2":442}},"AI-Review":{"files":{"A1":7.0},"lines":{"A1":444}}},"errors":0,"children":[{"name":"_main.jl","path":"src/Examples/_main.jl","type":"file","files":1,"lines":42,"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"errors":[],"parts":[{"lines":42,"runs":[[1,42]],"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"\"\"\"\n    PDEStudioCore.Examples\n\nReady-made simulations: each `test_*()` returns a [`SimulationConfig`](@ref) that runs as it is, e.g.\n`run_all_simulations(test_heat_1d())` or, in PDEStudio, `set_sim_config!(test_heat_1d())`.\n\n| Example | Equation | Data | Methods | Sweep |\n|:--------|:---------|:-----|:--------|:------|\n| [`test_advection_1d`](@ref) | linear advection (hyperbolic) | 1D + time | upwind, Lax–Friedrichs, Lax–Wendroff, exact | CFL number |\n| [`test_burgers_1d`](@ref) | inviscid Burgers (nonlinear hyperbolic, shock) | 1D + time | Lax–Friedrichs, Godunov, non-conservative upwind | grid size |\n| [`test_heat_1d`](@ref) | heat equation (parabolic) | 1D + time | explicit, implicit, Crank–Nicolson, exact | diffusion number |\n| [`test_heat_2d`](@ref) | heat equation (parabolic) | 2D + time | explicit, ADI, exact | diffusion number |\n| [`test_poisson_2d`](@ref) | Poisson equation (elliptic) | 2D + iterations (as `t`) | Jacobi, Gauss–Seidel, SOR, exact | grid size |\n| [`test_particles_2d`](@ref) | particles in a rotating flow (ODE) | Lagrangian 2D | explicit Euler, RK2, RK4 | time step |\n\nThe solvers are ordinary functions of the run's parameters (`solve_*`, `exact_*` for the references), written to be\nread: copy one as the starting point of your own. Configurations refer to them by name; names that are not found in\nthe target module ([`set_target_module!`](@ref)) are looked up here, so a function of your own with the same name\ntakes precedence.\n\"\"\"\nmodule Examples\n\nusing ..PDEStudioCore\nusing LinearAlgebra: Tridiagonal, lu, ldiv!\nusing StaticArrays: SVector\n\nexport test_advection_1d, test_burgers_1d, test_heat_1d, test_heat_2d, test_poisson_2d, test_particles_2d\n\n# Time steps of length ≤ `dt_max` that end exactly at `T`\nfunction _time_grid(T, dt_max)\n    nt = max(1, ceil(Int, T / dt_max - 1e-9))\n    return collect(range(0.0, T, length = nt + 1)), T / nt\nend\n\ninclude(\"advection_1d.jl\")\ninclude(\"burgers_1d.jl\")\ninclude(\"heat_1d.jl\")\ninclude(\"heat_2d.jl\")\ninclude(\"poisson_2d.jl\")\ninclude(\"particles_2d.jl\")\n\nend\n","changed":[],"added":0,"removed":0},{"name":"advection_1d.jl","path":"src/Examples/advection_1d.jl","type":"file","files":1,"lines":64,"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"errors":[],"counts":{"AI-Generation":{"files":{"G2":0.96875,"G3":0.03125},"lines":{"G2":62,"G3":2}},"Human-Review":{"files":{"H0":0.03125,"H2":0.96875},"lines":{"H0":2,"H2":62}},"AI-Review":{"files":{"A1":1.0},"lines":{"A1":64}}},"parts":[{"lines":62,"runs":[[1,51],[54,64]],"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":2,"runs":[[52,53]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] 6e36904"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"\"\"\"\n    solve_advection_1d(params) -> ESimData\n\nLinear advection ``u_t + c\\\\,u_x = 0`` on the periodic interval ``[0, 1)`` with ``u(x, 0) = \\\\sin(2\\\\pi x)``, `N`\ncells, end time `T`, time step from the CFL number `cfl` and the scheme `:scheme`:\n- `\"upwind\"`: first order, ``u_i - \\\\nu (u_i - u_{i-1})`` (for ``c > 0``), smears the wave;\n- `\"lax_friedrichs\"`: first order, central, even more diffusive;\n- `\"lax_wendroff\"`: second order, dispersive (the wave lags behind).\n\"\"\"\nfunction solve_advection_1d(params::ParamDict)\n    N, c, T, cfl = params[:N], params[:c], params[:T], params[:cfl]\n    scheme = params[:scheme]\n    dx = 1.0 / N\n    x = collect(range(0.0, step = dx, length = N))\n    t, dt = _time_grid(T, cfl * dx / abs(c))\n    ν = c * dt / dx                                   # the Courant number of the (slightly shortened) step\n\n    u = zeros(SVector{1, Float64}, N, length(t))\n    v = sin.(2π .* x)\n    w = similar(v)\n    u[:, 1] .= SVector.(v)\n    for n in 1:(length(t) - 1)\n        for i in 1:N\n            l, r = v[mod1(i - 1, N)], v[mod1(i + 1, N)]\n            w[i] = if scheme == \"upwind\"\n                v[i] - ν * (v[i] - l)\n            elseif scheme == \"lax_friedrichs\"\n                (l + r) / 2 - ν / 2 * (r - l)\n            elseif scheme == \"lax_wendroff\"\n                v[i] - ν / 2 * (r - l) + ν^2 / 2 * (r - 2v[i] + l)\n            else\n                throw(ArgumentError(\"unknown scheme $(repr(scheme))\"))\n            end\n        end\n        v, w = w, v\n        u[:, n + 1] .= SVector.(v)\n    end\n    return create_sim_data(x, u, t, params)           # dims (:x, :t)\nend\n\n\"\"\"\n    exact_advection_1d(params)\n\nThe exact solution of [`solve_advection_1d`](@ref): ``u(x, t) = \\\\sin(2\\\\pi (x - c\\\\,t))``.\n\"\"\"\nexact_advection_1d(params::ParamDict) = xt -> SVector(sin(2π * (xt[1] - params[:c] * xt[2])))\n\n\"\"\"\n    test_advection_1d() -> SimulationConfig\n\nLinear advection of a sine wave ([`solve_advection_1d`](@ref)) with three schemes and the exact solution, swept\nover the CFL number (at `cfl = 1` all three schemes are exact shifts; below it Lax–Wendroff is the most\naccurate and Lax–Friedrichs the most diffusive).\n\"\"\"\nfunction test_advection_1d()\n    shared = create_param_dict(:N => 100, :c => 1.0, :T => 1.0, :cfl => 0.5, :sim_func_name => :solve_advection_1d)\n    methods = create_method_dict(:exact => create_param_dict(),\n                                 :upwind => create_param_dict(:scheme => \"upwind\"),\n                                 :lax_friedrichs => create_param_dict(:scheme => \"lax_friedrichs\"),\n                                 :lax_wendroff => create_param_dict(:scheme => \"lax_wendroff\"))\n    varied = create_varied_dict(:cfl => [0.25, 0.5, 0.75, 1.0])\n    return SimulationConfig(shared, methods, [:exact, :upwind, :lax_friedrichs, :lax_wendroff];\n                            varied = varied, reference = :exact_advection_1d)\nend\n","changed":[],"added":0,"removed":0},{"name":"burgers_1d.jl","path":"src/Examples/burgers_1d.jl","type":"file","files":1,"lines":65,"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"errors":[],"parts":[{"lines":65,"runs":[[1,65]],"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"\"\"\"\n    solve_burgers_1d(params) -> ESimData\n\nInviscid Burgers ``u_t + (u^2/2)_x = 0`` on the periodic interval ``[0, 1)`` with ``u(x, 0) = 1 + \\\\frac12 \\\\sin(2\\\\pi x)``:\nthe wave steepens and a shock forms at ``t = 1/\\\\pi``. `N` cells, end time `T`, time step from `cfl`, scheme\n`:scheme`:\n- `\"lax_friedrichs\"`: conservative, first order, diffusive;\n- `\"godunov\"`: conservative, first order, with the exact Riemann flux (sharp shock);\n- `\"nonconservative_upwind\"`: upwind for ``u_t + u\\\\,u_x = 0``. Consistent, but not conservative: the mass drifts\n  from the start (about 7 % by ``t = 0.8`` at ``N = 50``) and the shock moves at the wrong speed. Only conservative\n  schemes converge to the right weak solution.\n\"\"\"\nfunction solve_burgers_1d(params::ParamDict)\n    N, T, cfl = params[:N], params[:T], params[:cfl]\n    scheme = params[:scheme]\n    dx = 1.0 / N\n    x = collect(range(0.0, step = dx, length = N))\n    t, dt = _time_grid(T, cfl * dx / 1.5)             # |u| ≤ 1.5 for all times (maximum principle)\n    λ = dt / dx\n\n    f(u) = u^2 / 2\n    function flux(l, r)                                # numerical flux at the face between l and r\n        if scheme == \"lax_friedrichs\"\n            return (f(l) + f(r)) / 2 - (r - l) / (2λ)\n        else                                           # Godunov: the exact Riemann solution at the face\n            return l > r ? max(f(l), f(r)) : (l > 0 ? f(l) : r \u003c 0 ? f(r) : 0.0)\n        end\n    end\n\n    u = zeros(SVector{1, Float64}, N, length(t))\n    v = 1 .+ sin.(2π .* x) ./ 2\n    w = similar(v)\n    u[:, 1] .= SVector.(v)\n    for n in 1:(length(t) - 1)\n        for i in 1:N\n            l, c, r = v[mod1(i - 1, N)], v[i], v[mod1(i + 1, N)]\n            w[i] = if scheme == \"nonconservative_upwind\"\n                c - λ * c * (c > 0 ? c - l : r - c)\n            elseif scheme in (\"lax_friedrichs\", \"godunov\")\n                c - λ * (flux(c, r) - flux(l, c))\n            else\n                throw(ArgumentError(\"unknown scheme $(repr(scheme))\"))\n            end\n        end\n        v, w = w, v\n        u[:, n + 1] .= SVector.(v)\n    end\n    return create_sim_data(x, u, t, params)\nend\n\n\"\"\"\n    test_burgers_1d() -> SimulationConfig\n\nA shock forming in inviscid Burgers ([`solve_burgers_1d`](@ref)): two conservative schemes and a non-conservative one\n(wrong shock speed, see the `mass` statistic), swept over the grid size. There is no exact solution after the shock\nforms, so there is no reference.\n\"\"\"\nfunction test_burgers_1d()\n    shared = create_param_dict(:N => 100, :T => 0.8, :cfl => 0.8, :sim_func_name => :solve_burgers_1d)\n    methods = create_method_dict(:lax_friedrichs => create_param_dict(:scheme => \"lax_friedrichs\"),\n                                 :godunov => create_param_dict(:scheme => \"godunov\"),\n                                 :nonconservative_upwind => create_param_dict(:scheme => \"nonconservative_upwind\"))\n    varied = create_varied_dict(:N => [50, 100, 200])\n    return SimulationConfig(shared, methods, [:lax_friedrichs, :godunov, :nonconservative_upwind]; varied = varied)\nend\n","changed":[],"added":0,"removed":0},{"name":"heat_1d.jl","path":"src/Examples/heat_1d.jl","type":"file","files":1,"lines":66,"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"errors":[],"parts":[{"lines":66,"runs":[[1,66]],"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"\"\"\"\n    solve_heat_1d(params) -> ESimData\n\nThe heat equation ``u_t = \\\\kappa\\\\,u_{xx}`` on ``[0, 1]`` with ``u = 0`` at both ends and\n``u(x, 0) = \\\\sin(\\\\pi x) + \\\\frac12 \\\\sin(3\\\\pi x)``, `N` intervals, end time `T` and the time step from the diffusion\nnumber ``r = \\\\kappa\\\\,\\\\Delta t / \\\\Delta x^2`` (`r`), scheme `:scheme`:\n- `\"explicit\"`: forward Euler in time (FTCS), stable only for ``r \\\\le 1/2``; above, round-off errors in the\n  shortest wave grow by ``|1 - 4r|`` per step and take over;\n- `\"implicit\"`: backward Euler, stable for every `r`, first order in time;\n- `\"crank_nicolson\"`: the average of both, stable and second order in time.\n\"\"\"\nfunction solve_heat_1d(params::ParamDict)\n    N, κ, T, r = params[:N], params[:kappa], params[:T], params[:r]\n    scheme = params[:scheme]\n    dx = 1.0 / N\n    x = collect(range(0.0, 1.0, length = N + 1))\n    t, dt = _time_grid(T, r * dx^2 / κ)\n    ρ = κ * dt / dx^2\n\n    # θ-scheme on the interior points: (I - θρL) vⁿ⁺¹ = (I + (1-θ)ρL) vⁿ, L = tridiag(1, -2, 1)\n    θ = scheme == \"explicit\" ? 0.0 : scheme == \"implicit\" ? 1.0 : scheme == \"crank_nicolson\" ? 0.5 :\n        throw(ArgumentError(\"unknown scheme $(repr(scheme))\"))\n    m = N - 1\n    A = lu(Tridiagonal(fill(-θ * ρ, m - 1), fill(1 + 2θ * ρ, m), fill(-θ * ρ, m - 1)))\n\n    u = zeros(SVector{1, Float64}, N + 1, length(t))\n    v = sin.(π .* x) .+ sin.(3π .* x) ./ 2\n    v[1] = v[end] = 0.0\n    rhs = zeros(m)\n    u[:, 1] .= SVector.(v)\n    for n in 1:(length(t) - 1)\n        for i in 2:N\n            rhs[i - 1] = v[i] + (1 - θ) * ρ * (v[i - 1] - 2v[i] + v[i + 1])\n        end\n        θ == 0 ? (v[2:N] .= rhs) : (v[2:N] .= A \\ rhs)\n        u[:, n + 1] .= SVector.(v)\n    end\n    return create_sim_data(x, u, t, params)\nend\n\n\"\"\"\n    exact_heat_1d(params)\n\nThe exact solution of [`solve_heat_1d`](@ref): each sine mode decays with ``e^{-\\\\kappa k^2 \\\\pi^2 t}``.\n\"\"\"\nfunction exact_heat_1d(params::ParamDict)\n    κ = params[:kappa]\n    return xt -> SVector(exp(-κ * π^2 * xt[2]) * sin(π * xt[1]) + exp(-9κ * π^2 * xt[2]) * sin(3π * xt[1]) / 2)\nend\n\n\"\"\"\n    test_heat_1d() -> SimulationConfig\n\nDiffusion of two sine modes ([`solve_heat_1d`](@ref)) with an explicit, an implicit and the Crank–Nicolson scheme and\nthe exact solution, swept over the diffusion number `r`: at `r = 0.6` the explicit scheme is unstable.\n\"\"\"\nfunction test_heat_1d()\n    shared = create_param_dict(:N => 50, :kappa => 1.0, :T => 0.1, :r => 0.4, :sim_func_name => :solve_heat_1d)\n    methods = create_method_dict(:exact => create_param_dict(),\n                                 :explicit => create_param_dict(:scheme => \"explicit\"),\n                                 :implicit => create_param_dict(:scheme => \"implicit\"),\n                                 :crank_nicolson => create_param_dict(:scheme => \"crank_nicolson\"))\n    varied = create_varied_dict(:r => [0.25, 0.4, 0.5, 0.6])\n    return SimulationConfig(shared, methods, [:exact, :explicit, :implicit, :crank_nicolson];\n                            varied = varied, reference = :exact_heat_1d)\nend\n","changed":[],"added":0,"removed":0},{"name":"heat_2d.jl","path":"src/Examples/heat_2d.jl","type":"file","files":1,"lines":79,"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"errors":[],"parts":[{"lines":79,"runs":[[1,79]],"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"\"\"\"\n    solve_heat_2d(params) -> ESimData\n\nThe heat equation ``u_t = \\\\kappa\\\\,(u_{xx} + u_{yy})`` on the unit square with ``u = 0`` on the boundary and\n``u(x, y, 0) = \\\\sin(\\\\pi x)\\\\sin(\\\\pi y) + \\\\frac12 \\\\sin(2\\\\pi x)\\\\sin(3\\\\pi y)``, `N` intervals per direction, end time\n`T` and the time step from the diffusion number ``r = \\\\kappa\\\\,\\\\Delta t / \\\\Delta x^2`` (`r`), scheme `:scheme`:\n- `\"explicit\"`: forward Euler with the five-point Laplacian, stable only for ``r \\\\le 1/4``;\n- `\"adi\"`: Peaceman–Rachford alternating direction implicit: two half steps, each implicit in one direction\n  (tridiagonal solves along the lines), stable for every `r` and second order.\n\"\"\"\nfunction solve_heat_2d(params::ParamDict)\n    N, κ, T, r = params[:N], params[:kappa], params[:T], params[:r]\n    scheme = params[:scheme]\n    scheme in (\"explicit\", \"adi\") || throw(ArgumentError(\"unknown scheme $(repr(scheme))\"))\n    dx = 1.0 / N\n    x = collect(range(0.0, 1.0, length = N + 1))\n    t, dt = _time_grid(T, r * dx^2 / κ)\n    ρ = κ * dt / dx^2\n\n    v = [sin(π * xi) * sin(π * yj) + sin(2π * xi) * sin(3π * yj) / 2 for xi in x, yj in x]\n    v[[1, end], :] .= 0.0\n    v[:, [1, end]] .= 0.0\n    w = copy(v)\n    m = N - 1\n    A = lu(Tridiagonal(fill(-ρ / 2, m - 1), fill(1 + ρ, m), fill(-ρ / 2, m - 1)))   # I - ρ/2 L on a line\n    rhs = zeros(m)\n\n    u = zeros(SVector{1, Float64}, N + 1, N + 1, length(t))\n    u[:, :, 1] .= SVector.(v)\n    for n in 1:(length(t) - 1)\n        if scheme == \"explicit\"\n            for j in 2:N, i in 2:N\n                w[i, j] = v[i, j] + ρ * (v[i - 1, j] + v[i + 1, j] + v[i, j - 1] + v[i, j + 1] - 4v[i, j])\n            end\n            v, w = w, v\n        else\n            for j in 2:N                               # implicit in x, explicit in y\n                for i in 2:N\n                    rhs[i - 1] = v[i, j] + ρ / 2 * (v[i, j - 1] - 2v[i, j] + v[i, j + 1])\n                end\n                w[2:N, j] .= A \\ rhs\n            end\n            for i in 2:N                               # implicit in y, explicit in x\n                for j in 2:N\n                    rhs[j - 1] = w[i, j] + ρ / 2 * (w[i - 1, j] - 2w[i, j] + w[i + 1, j])\n                end\n                v[i, 2:N] .= A \\ rhs\n            end\n        end\n        u[:, :, n + 1] .= SVector.(v)\n    end\n    return create_sim_data((x, x), u, t, params)      # dims (:x, :y, :t)\nend\n\n\"\"\"\n    exact_heat_2d(params)\n\nThe exact solution of [`solve_heat_2d`](@ref): the mode ``(k, l)`` decays with ``e^{-\\\\kappa (k^2 + l^2) \\\\pi^2 t}``.\n\"\"\"\nfunction exact_heat_2d(params::ParamDict)\n    κ = params[:kappa]\n    return xyt -> SVector(exp(-2κ * π^2 * xyt[3]) * sin(π * xyt[1]) * sin(π * xyt[2]) +\n                          exp(-13κ * π^2 * xyt[3]) * sin(2π * xyt[1]) * sin(3π * xyt[2]) / 2)\nend\n\n\"\"\"\n    test_heat_2d() -> SimulationConfig\n\nDiffusion on the unit square ([`solve_heat_2d`](@ref)) with the explicit scheme, ADI and the exact solution, swept\nover the diffusion number: at `r = 0.3` the explicit scheme is unstable, ADI is not.\n\"\"\"\nfunction test_heat_2d()\n    shared = create_param_dict(:N => 30, :kappa => 1.0, :T => 0.05, :r => 0.2, :sim_func_name => :solve_heat_2d)\n    methods = create_method_dict(:exact => create_param_dict(),\n                                 :explicit => create_param_dict(:scheme => \"explicit\"),\n                                 :adi => create_param_dict(:scheme => \"adi\"))\n    varied = create_varied_dict(:r => [0.1, 0.25, 0.3])\n    return SimulationConfig(shared, methods, [:exact, :explicit, :adi]; varied = varied, reference = :exact_heat_2d)\nend\n","changed":[],"added":0,"removed":0},{"name":"particles_2d.jl","path":"src/Examples/particles_2d.jl","type":"file","files":1,"lines":63,"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"errors":[],"parts":[{"lines":63,"runs":[[1,63]],"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"\"\"\"\n    solve_particles_2d(params) -> LSimData\n\nParticles in a solid-body rotation ``\\\\dot x = -\\\\omega y``, ``\\\\dot y = \\\\omega x`` (one revolution per `period`):\na `K`×`K` grid of particles in ``[-1, 1]^2`` moved for the time `T` with the time step `dt` and the integrator\n`:integrator`:\n- `\"euler\"`: explicit Euler, first order; every step pushes the particles outwards by the factor\n  ``\\\\sqrt{1 + (\\\\omega\\\\,\\\\Delta t)^2}``, so they spiral out;\n- `\"rk2\"`: the midpoint rule, second order (spirals out slowly);\n- `\"rk4\"`: the classical Runge–Kutta method, fourth order (spirals in, very slowly).\n\nEach particle carries its initial distance from the centre, which the exact flow keeps: the reference is the\ndistance of the particle's current position, so the error statistics measure the radial drift of the integrator.\nLagrangian data: in PDEStudio, `set_mode!(:lagrangian)` first.\n\"\"\"\nfunction solve_particles_2d(params::ParamDict)\n    K, T, dt, period = params[:K], params[:T], params[:dt], params[:period]\n    integrator = params[:integrator]\n    integrator in (\"euler\", \"rk2\", \"rk4\") || throw(ArgumentError(\"unknown integrator $(repr(integrator))\"))\n    ω = 2π / period\n    t, h = _time_grid(T, dt)\n    velocity(p) = SVector(-ω * p[2], ω * p[1])\n    function step(p)\n        integrator == \"euler\" && return p + h * velocity(p)\n        integrator == \"rk2\" && return p + h * velocity(p + h / 2 * velocity(p))\n        k1 = velocity(p)\n        k2 = velocity(p + h / 2 * k1)\n        k3 = velocity(p + h / 2 * k2)\n        k4 = velocity(p + h * k3)\n        return p + h / 6 * (k1 + 2k2 + 2k3 + k4)\n    end\n\n    grid = range(-1.0, 1.0, length = K)\n    x = [vec([SVector(a, b) for a in grid, b in grid])]\n    r0 = [SVector(hypot(p...)) for p in x[1]]\n    for _ in 2:length(t)\n        push!(x, step.(x[end]))\n    end\n    return create_sim_data(x, [copy(r0) for _ in t], t, params)   # dims (:x, :y, :t)\nend\n\n\"\"\"\n    exact_particles_2d(params)\n\nThe reference of [`solve_particles_2d`](@ref): the distance from the centre, which every particle keeps in the\nexact flow.\n\"\"\"\nexact_particles_2d(params::ParamDict) = xyt -> SVector(hypot(xyt[1], xyt[2]))\n\n\"\"\"\n    test_particles_2d() -> SimulationConfig\n\nParticles in a rotating flow ([`solve_particles_2d`](@ref)), two revolutions with three integrators, swept over the\ntime step. Lagrangian data (in PDEStudio: `set_mode!(:lagrangian)` first).\n\"\"\"\nfunction test_particles_2d()\n    shared = create_param_dict(:K => 10, :T => 2.0, :period => 1.0, :dt => 0.05, :sim_func_name => :solve_particles_2d)\n    methods = create_method_dict(:euler => create_param_dict(:integrator => \"euler\"),\n                                 :rk2 => create_param_dict(:integrator => \"rk2\"),\n                                 :rk4 => create_param_dict(:integrator => \"rk4\"))\n    varied = create_varied_dict(:dt => [0.05, 0.02, 0.01])\n    return SimulationConfig(shared
