urce":"SIGNOFF.toml [[commits]] 7018d35"},"errors":[],"parts":[{"lines":167,"runs":[[1,167]],"declaration":{"AI-Generation":"G2","Human-Review":"H1","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] 7018d35"},"levels":{"AI-Generation":"G2","Human-Review":"H1","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"# The literal parser of PDEStudioCore before the allowlist (main_dev, Nov 2026), kept verbatim as the reference of\n# `test_str2val_differential.jl`: every literal the old parser accepted must parse to the same value now, except the\n# documented differences. Only its module lookup is pointed at PDEStudioCore (it was `@__MODULE__`).\nmodule OldStr2Val\nusing PDEStudioCore\nstruct _NotALiteral \u003c: Exception end\n\n# (`true`/`false` are parsed as Bool literals already and need no entry.)\nconst _LITERAL_CONSTANTS = Dict{Symbol, Any}(\n    :nothing => nothing, :missing => missing,\n    :Inf => Inf, :NaN => NaN, :Inf16 => Inf16, :Inf32 => Inf32, :Inf64 => Inf64,\n    :NaN16 => NaN16, :NaN32 => NaN32, :NaN64 => NaN64, :pi => π, :π => π, :ℯ => ℯ, :im => im,\n)\n\n# Pure functions that may be applied to numeric literals (e.g. \"2π\", \"1/3\", \"-Inf\", \"1:10\").\nconst _LITERAL_FUNCTIONS = Dict{Symbol, Function}(\n    :+ => +, :- => -, :* => *, :/ => /, :// => //, :^ => ^, :% => %, :(:) => (:),\n    :sqrt => sqrt, :exp => exp, :log => log, :log2 => log2, :log10 => log10,\n    :sin => sin, :cos => cos, :tan => tan, :abs => abs,\n)\n\nfunction _literal_type(sym::Symbol)\n    for mod in (Core, Base, PDEStudioCore)\n        if isdefined(mod, sym)\n            T = getglobal(mod, sym)\n            T isa Type && return T\n        end\n    end\n    throw(_NotALiteral())\nend\n\n_literal_type(ex::Expr) = (T = _literal(ex); T isa Type ? T : throw(_NotALiteral()))\n_literal_type(::Any) = throw(_NotALiteral())\n\n_literal(x::Union{Number, AbstractString, AbstractChar}) = x\n_literal(q::QuoteNode) = q.value isa Symbol ? q.value : throw(_NotALiteral())\n_literal(sym::Symbol) = haskey(_LITERAL_CONSTANTS, sym) ? _LITERAL_CONSTANTS[sym] : _literal_type(sym)\n_literal(::Any) = throw(_NotALiteral())\n\n# The parts of a composite literal. A range is only a literal on its own (e.g. a sweep typed as \"1:10\"):\n# `val2str` never writes ranges into containers, and inside one (`Vector{T}[1:n, …]`, `reshape(1:n, …)`,\n# `2 * (1:n)`) it would be expanded before any size check could see it.\nfunction _literal_parts(args)\n    parts = map(_literal, args)\n    any(p -> p isa AbstractRange, parts) && throw(_NotALiteral())\n    return parts\nend\n\nfunction _literal(ex::Expr)\n    head, args = ex.head, ex.args\n    if head === :vect\n        return Base.vect(_literal_parts(args)...)\n    elseif head === :tuple\n        any(a -> a isa Expr && a.head in (:(=), :kw, :parameters), args) && throw(_NotALiteral())\n        return tuple(_literal_parts(args)...)\n    elseif head === :ref\n        return getindex(_literal_type(args[1]), _literal_parts(args[2:end])...)\n    elseif head === :curly\n        T = _literal_type(args[1])\n        params = _literal_parts(args[2:end])\n        # Integer type parameters size types (`NTuple{N, T}`, `Array{T, N}`): huge ones crash the compiler.\n        T === Val || all(p -> !(p isa Integer) || abs(p) \u003c= _MAX_TYPE_PARAMETER, params) || throw(_NotALiteral())\n        return Core.apply_type(T, params...)\n    elseif head === :call\n        return _literal_call(args[1], _literal_parts(args[2:end]))\n    elseif head === :macrocall && length(args) == 3 && args[3] isa String\n        # Integer literals too large for Int64/UInt64 are parsed as `@int128_str \"...\"` etc.\n        T = get(_BIG_LITERAL_MACROS, args[1], nothing)\n        T === nothing || return parse(T, args[3])\n    end\n    throw(_NotALiteral())\nend\n\nconst _BIG_LITERAL_MACROS = Dict{Any, Type}(\n    GlobalRef(Core, Symbol(\"@int128_str\")) => Int128,\n    GlobalRef(Core, Symbol(\"@uint128_str\")) => UInt128,\n    GlobalRef(Core, Symbol(\"@big_str\")) => BigInt,\n)\n\n# Size limits of literals: bits of an exact power (see `_literal_call`), and the number of elements of the\n# whole value (ranges are lazy, but hashing writes out every element; see `str2val`).\nconst _MAX_LITERAL_BITS = 2^20\nconst _MAX_LITERAL_LENGTH = 10^6\nconst _MAX_TYPE_PARAMETER = 256  # integer type parameters (except in `Val`)\nconst _MAX_DIMS = 16             # dimensions of `reshape`\n_exact_bits(x::Integer) = ndigits(x; base = 2)\n_exact_bits(x::Rational) = max(_exact_bits(numerator(x)), _exact_bits(denominator(x)))\n_exact_bits(x::Complex) = max(_exact_bits(real(x)), _exact_bits(imag(x)))\n_exact_bits(::Number) = 0  # fixed-size (or fixed-precision) results\n\n# Number of elements of a parsed literal, counting the elements of (lazy) ranges.\n# Lazy arrays (ranges, reshaped ranges) are counted by `length` before anything is iterated, and the sum stops as\n# soon as it exceeds `limit`, so neither huge lazy values nor `Int` overflow get through. Returns at most `limit + 1`.\nfunction _literal_size(x, limit::Integer = _MAX_LITERAL_LENGTH)\n    x isa AbstractArray && length(x) > limit && return limit + 1\n    x isa Pair && return _sum_sizes((x.first, x.second), limit)\n    x isa Union{Tuple, AbstractArray, AbstractDict} || return 1\n    return max(1, _sum_sizes(x, limit))\nend\n\nfunction _sum_sizes(items, limit::Integer)\n    total = 0\n    for item in items\n        total += _literal_size(item, limit - total)\n        total > limit && return limit + 1\n    end\n    return total\nend\n\nfunction _literal_call(f, values::Vector)\n    if f === :(=>) && length(values) == 2\n        return values[1] => values[2]\n    elseif f === :reshape && length(values) == 2 && values[1] isa AbstractVector &&\n           values[2] isa Tuple{Vararg{Integer}}\n        # (overflow-checked: wrapped dimensions could otherwise pass for an empty array)\n        dims = values[2]\n        (length(dims) \u003c= _MAX_DIMS && all(d -> 0 \u003c= d \u003c= _MAX_LITERAL_LENGTH, dims) &&\n         foldl(Base.checked_mul, dims; init = 1) \u003c= _MAX_LITERAL_LENGTH) || throw(_NotALiteral())\n        return reshape(values[1], values[2])\n    elseif f isa Symbol && haskey(_LITERAL_FUNCTIONS, f) && all(v -> v isa Number, values)\n        # Exact powers and ranges grow with their arguments: a file must not be able to request huge ones.\n        # Ranges are capped here, where they are built (they are only literals on their own, see `_literal_parts`).\n        # (A division, not a product: the product of the exponent and the bits overflows for huge exponents.)\n        if f === :^ && length(values) == 2\n            bits = _exact_bits(values[1])\n            bits > 0 && abs(values[2]) > _MAX_LITERAL_BITS / bits && throw(_NotALiteral())\n        end\n        result = _LITERAL_FUNCTIONS[f](values...)\n        f === :(:) && Base.checked_length(result) > _MAX_LITERAL_LENGTH && throw(_NotALiteral())\n        return result\n    end\n    T = _literal_type(f)\n    # Only plain dictionary types: e.g. `EnvDict()` would return the live `ENV`.\n    if (T \u003c: Dict || T \u003c: IdDict) && all(v -> v isa Pair, values)\n        return T(values...)\n    elseif T \u003c: Val && isempty(values)\n        return T()\n    elseif T === Symbol && length(values) == 1 && values[1] isa AbstractString\n        return Symbol(values[1])\n    elseif T \u003c: Number && length(values) == 1 && values[1] isa Number\n        return T(values[1])\n    end\n    throw(_NotALiteral())\nend\n\n\"\"\"\n    str2val(val_str::AbstractString)\n\nInverse of [`val2str`](@ref): parses literals (numbers, strings, symbols, types, tuples, typed or\nuntyped vectors, `reshape(T[...], dims)`, `Dict{K, V}(...)`, `Val{...}()`, and arithmetic on numbers\nsuch as `2π` or `1/3`).\nAnything else is returned as a (cleaned) string. Arbitrary code is never evaluated, and values beyond the size\nlimits (exact powers above 2^20 bits, more than 10^6 elements in total, ranges included) are returned as strings.\n\"\"\"\nfunction str2val(val_str::AbstractString)\n    s = strip(String(val_str))  # a plain String: the parser cannot iterate every AbstractString (e.g. lazy CSV strings)\n    (s == \"\u003cempty>\" || isempty(s)) && return \"\"\n    try\n        value = _literal(Meta.parse(s))\n        _literal_size(value) > _MAX_LITERAL_LENGTH && throw(_NotALiteral())\n        return value\n    catch e\n        e isa InterruptException && rethrow()\n        return replace(s, r\"^\\\"|\\\"$\" => \"\")\n    end\nend\nend\n","changed":[],"added":0,"removed":0},{"name":"runtests.jl","path":"test/runtests.jl","type":"file","files":1,"lines":26,"levels":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [3]"},"errors":[],"counts":{"AI-Generation":{"files":{"G2":0.07692307692307693,"G3":0.9230769230769231},"lines":{"G2":2,"G3":24}},"Human-Review":{"files":{"H1":1.0},"lines":{"H1":26}},"AI-Review":{"files":{"A1":1.0},"lines":{"A1":26}}},"parts":[{"lines":24,"runs":[[1,18],[21,26]],"declaration":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [3]"},"levels":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":2,"runs":[[19,20]],"declaration":{"AI-Generation":"G2","Human-Review":"H1","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] 7018d35"},"levels":{"AI-Generation":"G2","Human-Review":"H1","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"using Test\nusing PDEStudioCore\nusing StaticArrays\nusing DataFrames\n\n# Register this module so the pipeline can resolve solvers/references/post-processing by name.\nPDEStudioCore.set_target_module!(@__MODULE__)\n\ninclude(\"solvers.jl\")\n\n@testset \"PDEStudioCore.jl\" begin\n    set_stat_preset!(\"hyperbolic\")\n    set_save_path!(mktempdir())\n    @test NoSimData() isa NoSimData\n\n    include(\"test_types.jl\")\n    include(\"test_constructors.jl\")\n    include(\"test_serialization.jl\")\n    include(\"test_roundtrip.jl\")\n    include(\"test_str2val_differential.jl\")\n    include(\"test_statistics.jl\")\n    include(\"test_pipeline.jl\")\n    include(\"test_data.jl\")\n\n    include(\"test_examples.jl\")\nend\n","changed":[],"added":0,"removed":0},{"name":"solvers.jl","path":"test/solvers.jl","type":"file","files":1,"lines":101,"levels":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [3]"},"errors":[],"parts":[{"lines":101,"runs":[[1,101]],"declaration":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [3]"},"levels":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"# ==============================================================================\n# Test solvers, reference solutions and custom statistics\n# (defined in the target module so the pipeline can resolve them by name)\n# ==============================================================================\n\n# --- 1D linear advection (upwind & Lax-Friedrichs), periodic ---\nfunction advection_solver_1d(params::ParamDict)\n    N = params[:N]\n    scheme = get(params, :scheme, \"upwind\")\n    cfl = get(params, :cfl, 0.5)\n    L, c, T_end = 2π, 1.0, 2.0\n\n    dx = L / N              # periodic grid without the redundant endpoint x = L\n    dt = cfl * dx / c\n    Nt = ceil(Int, T_end / dt) + 1\n    x = collect(range(0.0, step = dx, length = N))\n    t = collect(range(0.0, step = dt, length = Nt))\n\n    u = fill(SVector{1, Float64}(0.0), N, Nt)\n    for i in 1:N\n        u[i, 1] = SVector(sin(x[i]) + 2.0)\n    end\n    for n in 1:(Nt - 1), i in 1:N\n        im1 = i == 1 ? N : i - 1\n        ip1 = i == N ? 1 : i + 1\n        val = if scheme == \"upwind\"\n            u[i, n][1] - cfl * (u[i, n][1] - u[im1, n][1])\n        elseif scheme == \"lax_friedrichs\"\n            0.5 * (u[ip1, n][1] + u[im1, n][1]) - 0.5 * cfl * (u[ip1, n][1] - u[im1, n][1])\n        else\n            error(\"Unknown scheme: $scheme\")\n        end\n        u[i, n + 1] = SVector(val)\n    end\n    return create_sim_data(x, u, t, params; time_dim = :t, dims = :x)\nend\n\nexact_advection(st::SVector{2, Float64}) = SVector(sin(st[1] - st[2]) + 2.0)\nexact_advection_factory(params::ParamDict) = (x -> exact_advection(x))\n\n# --- 1D Lagrangian particles moving with constant velocity ---\nfunction particle_solver_1d(params::ParamDict)\n    N = params[:N]\n    v = get(params, :v, 1.0)\n    x0 = collect(range(0.0, 1.0, length = N))\n    t = [0.0, 0.5, 1.0]\n    x_traj = [[SVector(p + v * tn) for p in x0] for tn in t]\n    u_traj = [[SVector(1.0) for _ in x0] for _ in t]\n    return create_sim_data(x_traj, u_traj, t, params; time_dim = :t)\nend\n\nexact_particle(st::SVector{2, Float64}) = SVector(1.0)\n\n# --- Tuple-parameter dummy solver ---\nfunction dummy_tuple_solver(params::ParamDict)\n    Nx, Ny = params[:Ns]\n    x = collect(range(0.0, 1.0, length = Nx))\n    y = collect(range(0.0, 1.0, length = Ny))\n    t = [0.0, 0.1]\n    u = fill(SVector(1.0), Nx, Ny, length(t))\n    return create_sim_data((x, y), u, t, params)\nend\n\n# --- Pipeline robustness solvers ---\nfailing_solver(params::ParamDict) = error(\"intentional failure\")\nempty_solver(params::ParamDict) = NoSimData()\n\nfunction mutating_solver(params::ParamDict)\n    params[:injected] = \"by the solver\"     # must not change where the result is stored\n    x = collect(range(0.0, 1.0, length = 5))\n    return create_sim_data(x, fill(SVector(1.0), 5, 2), [0.0, 1.0], params)\nend\n\nfunction static_field_solver(params::ParamDict)\n    n = params[:n]\n    x = range(0.0, 1.0, length = n)\n    y = range(0.0, 2.0, length = n + 1)\n    return create_sim_data((x, y), [xi + yi for xi in x, yi in y], params)  # static scalar field\nend\n\n# Counts its calls, so tests can tell a cached run from a rerun.\nSOLVER_CALLS = Ref(0)\nfunction counting_solver(params::ParamDict)\n    SOLVER_CALLS[] += 1\n    return advection_solver_1d(params)\nend\n\n# --- Custom statistics used throughout the tests ---\nPDEStudioCore.register_stat!(:pointwise_diff, :all)\nfunction PDEStudioCore.calc_stat(::Val{:pointwise_diff}, fixed_coords, u, ana, domain::DomainInfo)\n    return u[1] - ana[1]   # one-element slices (Eulerian) or 1-tuples (Lagrangian)\nend\n\n# Registered/unregistered on demand inside the statistics tests.\nfunction PDEStudioCore.calc_stat(::Val{:total}, fixed_coords, u, ana, domain::DomainInfo)\n    return sum(u) * get_integration_measure(:total, domain)\nend\n\n# A statistic returning a plain number (instead of an SVector) for every time slice.\nPDEStudioCore.register_stat!(:slice_count, :time)\nPDEStudioCore.calc_stat(::Val{:slice_count}, fixed_coords, u, ana, domain::DomainInfo) = length(u)\n","changed":[],"added":0,"removed":0},{"name":"test_constructors.jl","path":"test/test_constructors.jl","type":"file","files":1,"lines":128,"levels":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [3]"},"errors":[],"parts":[{"lines":128,"runs":[[1,128]],"declaration":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [3]"},"levels":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"@testset \"create_sim_data: N-dimensional Eulerian\" begin\n    p = create_param_dict(:case => \"nd\")\n    x = collect(range(0.0, 1.0, length = 5))\n    y = collect(range(-1.0, 1.0, length = 4))\n    z = [0.0, 0.5, 1.0]\n    t = collect(range(0.0, 0.3, length = 3))\n\n    # 1D + time, SVector field\n    s1 = create_sim_data(x, [SVector(xi * ti, xi + ti) for xi in x, ti in t], t, p)\n    @test s1 isa ESimData{2, 1, 2, Float64}\n    @test s1.domain.dim_keys == (:x, :t) && s1.stats[:Solution] === s1.u\n\n    # 2D + time from axis vectors, scalar (numeric) field\n    u2 = [xi + yi + ti for xi in x, yi in y, ti in t]\n    s2 = create_sim_data((x, y), u2, t, p)\n    @test s2 isa ESimData{3, 2, 1, Float64}\n    @test s2.u[2, 3, 1] == SVector(x[2] + y[3] + t[1])\n    @test s2.domain.spacing ≈ SVector(0.25, 2 / 3, 0.15)\n\n    # 3D static field with custom dimension names\n    s3 = create_sim_data((x, y, z), [SVector(xi, yi, zi) for xi in x, yi in y, zi in z], p; dims = (:r, :θ, :φ))\n    @test s3 isa ESimData{3, 3, 3, Float64}\n    @test s3.domain.dim_keys == (:r, :θ, :φ) && !has_time(s3)\n    @test get_kept_dims(:Solution, s3.domain) == [:r, :θ, :φ]\n\n    # 4D static (generic default names) and 3D + time\n    @test create_sim_data((x, y, z, [0.0, 1.0]), zeros(5, 4, 3, 2), p).domain.dim_keys == (:x1, :x2, :x3, :x4)\n    s5 = create_sim_data((x, y, z), zeros(5, 4, 3, 3), t, p)\n    @test s5 isa ESimData{4, 3, 1, Float64} && s5.domain.dim_keys == (:x, :y, :z, :t)\n\n    # Components-last numeric arrays, vector elements, integer and Float32 data\n    @test create_sim_data(x, zeros(5, 3, 2), t, p) isa ESimData{2, 1, 2, Float64}\n    @test create_sim_data(x, [[1.0, 2.0, 3.0] for _ in x, _ in t], t, p) isa ESimData{2, 1, 3, Float64}\n    @test create_sim_data(x, ones(Int, 5, 3), t, p) isa ESimData{2, 1, 1, Float64}\n    @test create_sim_data(Float32.(x), ones(Float32, 5, 3), Float32.(t), p) isa ESimData{2, 1, 1, Float32}\n\n    # ndgrid coordinate arrays (tuple form)\n    xg = [xi for xi in x, _ in y]\n    yg = [yi for _ in x, yi in y]\n    s10 = create_sim_data((xg, yg), u2, t, p; dims = (:a, :b))\n    @test s10.domain.dim_keys == (:a, :b, :t) && s10.axes[1] ≈ x && s10.axes[2] ≈ y\n    # Dimension names must be unique (also against the time dimension)\n    @test_throws ArgumentError create_sim_data((xg, yg), u2, t, p; dims = (:a, :a))\n    @test_throws ArgumentError create_sim_data((xg, yg), u2, t, p; dims = (:a, :t))\n    @test create_sim_data((xg, yg), u2, t, p).axes[2] ≈ y\n    # MATLAB/meshgrid-ordered arrays are rejected instead of silently producing wrong axes\n    @test_throws ArgumentError create_sim_data((permutedims(xg), permutedims(yg)), u2, t, p)\n\n    # Overridden bounds do not change the integration measure (cell-centred grid) imension\n    s4 = create_sim_data(x, u, t, p; xmins = -1.0, xmaxs = 3.0)\n    @test s4.domain.mins[1:2] == [-1.0, -1.0] && s4.domain.maxs[1:2] == [3.0, 3.0]\n\n    # Per-particle statistics are checked against the particle layout\n    @test_throws DimensionMismatch add_stat!(s, :bad_field, [[1.0]], :all)\n    @test_throws DimensionMismatch add_stat!(s, :bad_series, [1.0, 2.0, 3.0], :time)\n    add_stat!(s, :tag, [[1.0, 2.0], [1.0, 2.0, 3.0]], :all)\n    @test s.stats[:tag][2][3] == SVector(3.0)\n\n    # Non-finite positions (e.g. particles that left the domain) do not poison the bounding box\n    x_nan = [[SVector(0.0), SVector(0.5), SVector(1.0)], [SVector(0.1), SVector(NaN), SVector(Inf)]]\n    s5 = create_sim_data(x_nan, [[1.0, 2.0, 3.0], [1.0, 2.0, 3.0]], t, p)\n    @test s5.domain.mins[1] == 0.0 && s5.domain.maxs[1] == 1.0 && isfinite(s5.domain.spacing[1])\n    @test size(convert_to_eulerian(s5, (5, 2)).u) == (5, 2)\nend\n\n@testset \"2+1D Eulerian SimData creation\" begin\n    Nx, Ny, Nt = 12, 8, 4\n    x_vec = collect(range(0.0, 2.0, length = Nx))\n    y_vec = collect(range(-1.0, 1.0, length = Ny))\n    t_vec = collect(range(0.0, 0.5, length = Nt))\n    x_grid = [x for x in x_vec, _ in y_vec]\n    y_grid = [y for _ in x_vec, y in y_vec]\n    u_tensor = [SVector{1, Float64}(x * y + t) for x in x_vec, y in y_vec, t in t_vec]\n    params_2d = create_param_dict(:Nx => Nx, :Ny => Ny, :Nt => Nt, :dim => \"2+1D\")\n\n    sim_2d = create_sim_data((x_grid, y_grid), u_tensor, t_vec, params_2d; time_dim = :t, dims = (:x, :y))\n    @test sim_2d isa ESimData{3, 2, 1, Float64}\n    @test sim_2d.domain.dim_keys == (:x, :y, :t)\n    @test sim_2d.domain.time_dim == :t\n    @test size(sim_2d.u) == (Nx, Ny, Nt)\n    @test length(sim_2d.axes) == 3\n    @test sim_2d.axes[1] ≈ x_vec && sim_2d.axes[2] ≈ y_vec && sim_2d.axes[3] ≈ t_vec\n    @test haskey(sim_2d.stats, :Solution)\n    @test sim_2d.stats[:Solution] === sim_2d.u\nend\n","changed":[],"added":0,"removed":0},{"name":"test erian), size(sim_base.u))  # native resolution\n    end\n\n    @testset \"Persistent conversion (cache enabled)\" begin\n        enable_cache!(true)\n        try\n            load_sim_data(PARAMS_CONV, Val(:lagrangian))\n            @test does_sim_data_exist(PARAMS_CONV, Val(:lagrangian))\n            @test \"conv_L\" in list_available_conversions(PARAMS_CONV)\n            load_sim_data(PARAMS_CONV, Val(:eulerian), (25, 30))\n            @test does_sim_data_exist(PARAMS_CONV, Val(:eulerian), (25, 30))\n            @test \"conv_E_25x30\" in list_available_conversions(PARAMS_CONV)\n            # Rewriting the raw data drops the now stale caches\n            save_sim_data(sim_base; overwrite = true)\n            @test isempty(list_available_conversions(PARAMS_CONV))\n        finally\n            enable_cache!(false)\n        end\n    end\n\n    @testset \"Scatter (Lagrangian -> Eulerian)\" begin\n        sim_L = load_sim_data(PARAMS_CONV, Val(:lagrangian))\n        sim_E = convert_to_eulerian(sim_L, (30, nt))\n        @test size(sim_E.u) == (30, nt) && sim_E.axes[2] == sim_L.t\n        @test size(sim_E.stats[:u_copy]) == (30, nt)\n        @test !any(v -> any(isnan, v), sim_E.u)  # every cell is reached\n        # Scattering grid nodes back onto the same grid reproduces the data\n        sim_same = convert_to_eulerian(sim_L, size(sim_base.u))\n        @test all(isapprox.(first.(sim_same.u), first.(sim_base.u); atol = 1e-8))\n        # Fewer time slices pick the nearest recorded snapshots\n        sim_few = convert_to_eulerian(sim_L, (30, 5))\n        @test size(sim_few.u) == (30, 5)\n        @test sim_few.axes[2][1] == sim_L.t[1] && sim_few.axes[2][end] ≈ sim_L.t[end]\n        @test_throws ArgumentError convert_to_eulerian(sim_L, (30,))\n    end\n\n    @testset \"Derived datasets never replace the native data\" begin\n        sim_L = load_sim_data(PARAMS_CONV, Val(:lagrangian))\n        @test_logs (:warn, r\"not saved\") match_mode = :any calculate_all_stats!(sim_L, nothing)\n        @test load_sim_data(PARAMS_CONV) isa ESimData\n\n        ref = generate_reference_simdata(exact_advection, PARAMS_CONV, sim_base.domain, (10, 5), :eulerian)\n        @test_logs (:warn, r\"not saved\") match_mode = :any calculate_all_stats!(ref, exact_advection)\n        @test size(load_sim_data(PARAMS_CONV).u) == size(sim_base.u)\n        @test haskey(ref.stats, :mass)  # the statistics are still computed in memory\n\n        # ... also at the native resolution, where representation, shape and parameters all match\n        ref_native = generate_reference_simdata(exact_advection, PARAMS_CONV, sim_base.domain, size(sim_base.u), :eulerian)\n        @test_logs (:warn, r\"not saved\") match_mode = :any calculate_all_stats!(ref_native, exact_advection)\n        @test load_sim_data(PARAMS_CONV).u == sim_base.u\n        # while the native dataset itself (with other statistics) is saved\n        native = load_sim_data(PARAMS_CONV)\n        calculate_all_stats!(native, exact_advection)\n        @test haskey(load_sim_data(PARAMS_CONV).stats, :l1error)\n    end\n\n    @testset \"Bookkeeping entries are written atomically\" begin\n        p = create_param_dict(:N => 20, :scheme => \"upwind\", :cfl => 0.5, :test_mode => \"atomic\")\n        sim = advection_solver_1d(p)\n        calculate_all_stats!(sim, exact_advection)\n        file = get_file_name(p)\n        flag() = load_sim_data(calculate_hash(get_clean_params(p))[1:12]; key = \"evaluated_with_reference\")\n        @test flag() == true\n        # Nothing to compute, only the flag changes: the file is replaced (new inode), not modified in place\n        inode, size0 = stat(file).inode, filesize(file)\n        calculate_all_stats!(sim)\n        @test flag() == false && stat(file).inode != inode\n        @test load_sim_data(p).u == sim.u && haskey(load_sim_data(p).stats, :l1error)\n        # Flag updates don't rewrite the data (the file grows by little), and leave no temporary files behind\n        for v in (true, false, true, false)\n            PDEStudioCore._set_key!(file, \"evaluated_with_reference\", v)\n        end\n        @test filesize(file) \u003c= size0 + 4096 && load_sim_data(p).u == sim.u\n        @test !any(f -> endswith(f, \".tmp\"), readdir(dirname(file)))\n        # Entries of types this session doesn't know survive a bookkeeping update unchanged (another process\n        # writes and reads them back)\n        jl = Base.julia_cmd()\n        proj = Base.active_project()\n        foo_file = joinpath(mktempdir(), \"foreign.jld2\")\n        def = \"using PDEStudioCore; using PDEStudioCore.JLD2; struct ForeignEntry; a::Int; end\"\n        run(`$jl --project=$proj -e \"$def; jldsave($(repr(foo_file)); foo = ForeignEntry(7))\"`)\n        PDEStudioCore._set_key!(foo_file, \"evaluated_with_reference\", true)\n        @test success(`$jl --project=$proj -e \"$def; x = load($(repr(foo_file)), \\\"foo\\\"); exit(x isa ForeignEntry && x.a == 7 ? 0 : 1)\"`)\n        # Here the type is unknown, so rewriting the data warns about the entry; also when the unknown type is\n        # only an element type (a type defined in an anonymous module can't be found again by JLD2)\n        @test PDEStudioCore._is_reconstructed(PDEStudioCore.JLD2.load(foo_file, \"foo\"))\n        anon = Module()\n        Core.eval(anon, :(struct Hidden; a::Int; end))\n        hidden_file = joinpath(mktempdir(), \"hidden.jld2\")\n        PDEStudioCore.JLD2.jldsave(hidden_file; v = [Base.invokelatest(anon.Hidden, 1)])\n        @test PDEStudioCore._is_reconstructed(PDEStudioCore.JLD2.load(hidden_file, \"v\"))\n        @test !PDEStudioCore._is_reconstructed([1.0, 2.0]) && !PDEStudioCore._is_reconstructed(Dict(:a => 1))\n        # ... also a type stored as a value (JLD2.UnknownType) and values inside untyped containers, named in the warning\n        PDEStudioCore.JLD2.jldsave(hidden_file; t = anon.Hidden, anyv = Any[1, Base.invokelatest(anon.Hidden, 2)],\n                                   d = Dict{Symbol, Any}(:h => anon.Hidden), nested = Any[Any[(1, anon.Hidden)]])\n        for k in (\"t\", \"anyv\", \"d\", \"nested\")\n            found = PDEStudioCore._reconstructed_type(PDEStudioCore.JLD2.load(hidden_file, k))\n            @test found !== nothing && occursin(\"Hidden\", found)\n        end\n        @test !PDEStudioCore._is_reconstructed(Any[1, \"a\", (2, :b), Float64]) &&\n              !PDEStudioCore._is_reconstructed(Dict{Symbol, Any}(:a => [1.0], :T => Float32))\n        # ... also untyped containers inside typed ones, NamedTuples, pairs, and the values of a large dictionary\n        H = Base.invokelatest(anon.Hidden, 3)\n        big = Dict{Symbol, Any}(Symbol(\"k\", i) => i for i in 1:10^4)\n        big[:z] = H\n        PDEStudioCore.JLD2.jldsave(hidden_file; vv = [Any[H]], dd = Dict(\"run\" => Dict{Symbol, Any}(:h => anon.Hidden)),\n                                   nt = (a = 1, b = Any[H]), pr = :p => Any[H], big = big, st = Set{Any}([H]),\n                                   sd = Dict{Symbol, Any}(:s => Set{Any}([H])))\n        for k in (\"vv\", \"dd\", \"nt\", \"pr\", \"big\", \"st\", \"sd\")\n            @test PDEStudioCore._is_reconstructed(PDEStudioCore.JLD2.load(hidden_file, k))\n        end\n        # the cost is bounded per entry (nested untyped data with 8·10^5 leaves took seconds and GiBs on every rewrite)\n        nested = Any[Any[Any[Any[0.0 for _ in 1:30] for _ in 1:30] for _ in 1:30] for _ in 1:30]\n        PDEStudioCore._reconstructed_type(nested)\n        @test @elapsed(PDEStudioCore._reconstructed_type(nested)) \u003c 2   # (milliseconds; it took seconds)\n        # ... also for many containers of a wide element type: whether a type can hide other types is checked once per\n        # type (it was checked again for every container), so the check records one entry per distinct type\n        wide = Any[Dict{Symbol, NTuple{8, NTuple{8, Float64}}}() for _ in 1:10^4]\n        state = (budget = Ref(PDEStudioCore._RECONSTRUCTED_VISITS), seen = Dict{Any, Union{Nothing, String}}(),\n                 hides = Dict{Any, Bool}())\n        @test isnothing(PDEStudioCore._reconstructed_type(wide, 4, state)) && length(state.hides) == 3\n        # the pattern is anchored: a type `Reconstructed` of a module whose name ends in JLD2 is no reconstruction\n        M = Module(:MyJLD2)\n        Core.eval(M, :(struct Reconstructed end))\n        @test !PDEStudioCore._is_reconstructed(Base.invokelatest(M.Reconstructed))\n        # the warning on a rewrite names the missing type\n        dest = joinpath(mktempdir(), \"dest.jld2\")\n        PDEStudioCore.JLD2.jldopen(dest, \"w\") do d\n            PDEStudioCore.JLD2.jldopen(hidden_file, \"r\") do src\n                @test_logs (:warn, r\"contains a type that isn't loaded.*Hidden\") match_mode = :any PDEStudioCore._copy_entry!(d, src, \"vv\")\n            end\n        end\n        # A symlinked data file stays a symlink, and its target is updated\n        link = foo_file * \".link.jld2\"\n        symlink(foo_file, link)\n        PDEStudioCore._set_key!(link, \"evaluated_with_reference\", false)\n        @test islink(link) && PDEStudioCore.JLD2.load(foo_file, \"evaluated_with_reference\") == false\n\n        # Unchanged entries don't touch the file at all\n        inode = stat(file).inode\n        calculate_all_stats!(sim)\n        @test stat(file).inode == inode\n    end\n\n    @testset \"Resampling keeps non-uniform axes it does not resample\" begin\n        x = collect(range(0.0, 1.0, length = 11))\n        t = [0.0, 0.1, 0.3, 0.7, 1.5]                      # adaptive time steps\n        s = create_sim_data(x, [SVector(xi + ti) for xi in x, ti in t], t, create_param_dict(:case => \"nonuniform\"))\n        add_stat!(s, :series, collect(1.0:5.0), :time)\n        r = resample_eulerian(s, (21, 5))\n        @test r.axes[2] == t && r.stats[:series] == s.stats[:series]\n        @test r.u[end, 3] ≈ s.u[end, 3]\n        r2 = resample_eulerian(s, (11, 3))                 # time is resampled: uniform, nearest snapshot\n        @test r2.axes[2] ≈ [0.0, 0.75, 1.5] && length(r2.stats[:series]) == 3\n    end\n\n    @testset \"Static data\" begin\n        x = collect(range(0.0, 1.0, length = 6))\n        y = collect(range(0.0, 2.0, length = 5))\n        s = create_sim_data((x, y), [SVector(xi + yi) for xi in x, yi in y], create_param_dict(:case => \"static-conv\"))\n        L = convert_to_lagrangian(s)\n        @test L isa LSimData{2, 2, 1, Float64} && length(L.t) == 1 && length(L.x[1]) == 30\n        E = convert_to_eulerian(L, (6, 5))\n        @test all(isapprox.(first.(E.u), first.(s.u); atol = 1e-8))\n        R = resample_eulerian(s, (11, 9))\n        @test size(R.u) == (11, 9) && R.u[1, 1] ≈ s.u[1, 1] && R.u[end, end] ≈ s.u[end, end]\n        @test resample_eulerian(s, (6, 5)) === s\n    end\nend\n\n@testset \"Data health checking\" begin\n    sim_E = load_sim_data(PARAMS_CONV)\n    df_E = check_data(sim_E)\n    @test df_E isa DataFrame && size(df_E, 1) == 1\n    @test names(df_E) == [\"Time\", \"C1_Min\", \"C1_Max\", \"C1_Mean\", \"C1_NaNs\"]\n    @test df_E.C1_NaNs[1] == 0.0\n    df_steps = check_data(sim_E; per_step = true)\n    @test size(df_steps, 1) == size(sim_E.u, 2) && df_steps.Time == sim_E.axes[2]\n\n    sim_L = load_sim_data(PARAMS_CONV, Val(:lagrangian))\n    df_L = check_data(sim_L)\n    @test df_L isa DataFrame && size(df_L, 1) == length(sim_L.t)\nend\n\n@testset \"Data management: deletion\" begin\n    delete_params = create_param_dict(:N => 9, :scheme => \"upwind\", :cfl => 0.5, :test_flag => \"delete_me\")\n    keep_params = create_param_dict(:N => 9, :scheme => \"upwind\", :cfl => 0.5, :test_flag => \"keep_me\")\n    save_sim_data(advection_solver_1d(delete_params); overwrite = true)\n    save_sim_data(advection_solver_1d(keep_params); overwrite = true)\n    @test does_sim_data_exist(delete_params) && does_sim_data_exist(keep_params)\n\n    # find_sim_data: any subset of the parameters, string or symbol keys, newest first\n    found = find_sim_data(Dict(\"test_flag\" => \"delete_me\"); verbose = false)\n    @test found == [get_file_name(delete_params)]\n    found_n = find_sim_data(Dict(:N => 9, :scheme => \"upwind\"); verbose = false)\n    @test Set(found_n) ⊇ Set([get_file_name(delete_params), get_file_name(keep_params)])\n    @test issorted(mtime.(found_n); rev = true)\n    @test isempty(find_sim_data(Dict(:N => 9, :test_flag => \"no such flag\"); verbose = false))\n    @test length(find_sim_data(Dict(); verbose = false)) == length(PDEStudioCore._data_files())\n    io = IOBuffer()\n    @test find_sim_data(Dict(:test_flag => \"delete_me\"); io = io) == found\n    listing = String(take!(io))\n    @test startswith(listing, \"1 data file with test_flag = delete_me:\")\n    @test occursin(basename(found[1]), listing) && occursin(\"N = 9\", listing) && !occursin(\"test_flag\", split(listing, '\\n')[2])\n    io = IOBuffer(); find_sim_data(Dict(:N => -1); io = io)\n    @test startswith(String(take!(io)), \"0 data files with N = -1.\")\n\n    @test_throws ArgumentError delete_sim_data(Dict())  # would match every file\n    @test length(delete_sim_data(Dict(:test_flag => \"delete_me\"); dry_run = true)) == 1\n    @test does_sim_data_exist(delete_params)\n\n    deleted = delete_sim_data(Dict(:N => 9, :test_flag => \"delete_me\"))\n    @test length(deleted) == 1\n    @test !does_sim_data_exist(delete_params) && does_sim_data_exist(keep_params)\nend\n\n@testset \"Data management: rehash\" begin\n    params_target = create_param_dict(:N => 10, :scheme => \"upwind\", :cfl => 0.5, :target => true, :obsolete => \"delete_me\")\n    params_ignore = create_param_dict(:N => 11, :scheme => \"upwind\", :cfl => 0.5, :target => false, :obsolete => \"keep_me\")\n    save_sim_data(advection_solver_1d(params_target); overwrite = true)\n    save_sim_data(advection_solver_1d(params_ignore); overwrite = true)\n    file_target_old = get_file_name(params_target)\n    file_ignore_old = get_file_name(params_ignore)\n\n    renamed = rehash_sim_data(joinpath(get_save_path(), \"data\"); delete_old = true,\n                              filter_pairs = Dict(:target => true), remove_keys = [:obsolete])\n    @test length(renamed) == 1 && first(renamed[1]) == file_target_old\n    @test isfile(file_ignore_old) && !isfile(file_target_old)\n\n    params_new = create_param_dict(:N => 10, :scheme => \"upwind\", :cfl => 0.5, :target => true)\n    @test does_sim_data_exist(params_new)\n    sim_rehashed = load_sim_data(params_new)\n    @test !haskey(sim_rehashed.params, :obsolete) && sim_rehashed.params[:target] == true\n\n    # A symlinked file whose hash changes: the rehashed data is a regular file, the link is removed with a warning,\n    # and its target (which may be shared) is kept\n    p_link = create_param_dict(:N => 12, :scheme => \"upwind\", :cfl => 0.5, :obsolete => \"x\", :test_mode => \"link\")\n    save_sim_data(advection_solver_1d(p_link); overwrite = true)\n    linked = get_file_name(p_link)\n    target = joinpath(mktempdir(), basename(linked))\n    mv(linked, target)\n    symlink(target, linked)\n    @test_logs (:warn, r\"is a symlink.*is not deleted\"s) match_mode = :any rehash_sim_data(linked; remove_keys = [:obsolete])\n    @test isfile(target) && !ispath(linked)\n    p_new = create_param_dict(:N => 12, :scheme => \"upwind\", :cfl => 0.5, :test_mode => \"link\")\n    @test does_sim_data_exist(p_new) && !islink(get_file_name(p_new))\nend\n\n@testset \"Stored data info without loading\" begin\n    sim = load_sim_data(PARAMS_CONV)\n    info = get_sim_data_info(PARAMS_CONV)\n    @test info.kind === :eulerian && info.shape == size(sim.u) && info.dim_keys == sim.domain.dim_keys\n    @test info.time_dim === :t && info.n_steps == length(sim.axes[end]) && info.path == get_file_name(PARAMS_CONV)\n    # particles: shape (time steps, particles)\n    pl = create_param_dict(:N => 5, :test_mode => \"info_lagrangian\")\n    t = [0.0, 0.5, 1.0]\n    save_sim_data(create_sim_data([[SVector(i + ti) for i in 1.0:5.0] for ti in t], [[SVector(1.0) for _ in 1:5] for _ in t],\n                                  t, pl); overwrite = true)\n    li = get_sim_data_info(pl)\n    @test li.kind === :lagrangian && li.shape == (3, 15) && li.time_dim === :t && li.n_steps == 3\n    # static grid data\n    ps = create_param_dict(:N => 4, :test_mode => \"info_static\")\n    save_sim_data(create_sim_data(collect(0.0:0.25:0.75), [SVector(1.0) for _ in 1:4], ps); overwrite = true)\n    si = get_sim_data_info(ps)\n    @test si.kind === :eulerian && si.time_dim === nothing && si.n_steps == 0 && si.dim_keys == (:x,)\n    # files written before the axes were part of the metadata: read from the data\n    JLD2 = PDEStudioCore.JLD2\n    for p in (PARAMS_CONV, pl)\n        path = get_file_name(p)\n        entries = JLD2.jldopen(f -> Dict(k => f[k] for k in keys(f) if !(k in (\"dim_keys\", \"time_dim\"))), path, \"r\")\n        rm(path)\n        JLD2.jldopen(path, \"w\") do f\n            for (k, v) in entries\n                f[k] = v\n            end\n        end\n        @test !JLD2.jldopen(f -> haskey(f, \"dim_keys\"), path, \"r\")\n    end\n    @test get_sim_data_info(PARAMS_CONV) == info && get_sim_data_info(pl) == li\n    # ... also when an older file holds user metadata under these names: the axes come from the data\n    path = get_file_name(PARAMS_CONV)\n    JLD2.jldopen(path, \"a+\") do f\n        f[\"dim_keys\"] = [\"user\"]\n        f[\"time_dim\"] = \"user value\"\n    end\n    @test get_sim_data_info(PARAMS_CONV) == info\n    # ... or that look like axes but not like what this version writes (time axis not last, repeated names, no\n    # \"time_dim\" entry)\n    for (keys_, tdim) in (([:t, :x], :t), ([:x, :x], nothing), ([:missing], nothing))\n        JLD2.jldopen(path, \"a+\") do f\n            delete!(f, \"dim_keys\"); delete!(f, \"time_dim\")\n            f[\"dim_keys\"] = keys_\n            isnothing(tdim) || (f[\"time_dim\"] = tdim)\n        end\n        @test get_sim_data_info(PARAMS_CONV) == info\n    end\n    # the axes this version writes are read without loading the data: also found in a copy without \"raw\"\n    save_sim_data(load_sim_data(PARAMS_CONV); overwrite = true, verbose = false)\n    path = get_file_name(PARAMS_CONV)\n    JLD2.jldopen(f -> delete!(f, \"raw\"), path, \"a+\")\n    @test get_sim_data_info(PARAMS_CONV) == info\n    @test_throws SimFileNotFoundError get_sim_data_info(create_param_dict(:N => 1, :test_mode => \"info_missing\"))\nend\n\n@testset \"Output formatting & manual loading\" begin\n    params_E = create_param_dict(:N => 25, :scheme => \"upwind\", :cfl => 0.5, :test_id => \"format_E\")\n    sim_E = advection_solver_1d(params_E)\n    save_sim_data(sim_E; overwrite = true)\n    sim_L = particle_solver_1d(create_param_dict(:N => 10, :v => 1.5, :test_id => \"format_L\"))\n\n    @testset \"Clean parameter processing & printing\" begin\n        clean_from_dict = get_clean_params(params_E)\n        @test clean_from_dict isa Dict{Symbol, Any} && clean_from_dict == get_clean_params(sim_E)\n        @test clean_from_dict[:test_id] == \"format_E\"\n        pipe = Pipe()\n        printed = redirect_stdout(pipe) do\n            print_clean_params(sim_E)\n        end\n        close(pipe.in)\n        out = read(pipe, String)\n        @test printed == clean_from_dict\n        @test occursin(\"Cleaned Parameters\", out) && occursin(\"test_id => format_E\", out) && occursin(\"scheme => upwind\", out)\n    end\n\n    @testset \"REPL display\" begin\n        out_E = repr(\"text/plain\", sim_E)\n        for label in (\"ESimData\", \"Time (T)\", \"Space\", \"Grid Size\", \"Parameters\", \"Statistics\", \"Solution\")\n            @test occursin(label, out_E)\n        end\n        out_L = repr(\"text/plain\", sim_L)\n        for label in (\"LSimData\", \"Time (T)\", \"Space\", \"Particles\", \"Parameters\", \"Statistics\")\n            @test occursin(label, out_L)\n        end\n        @test startswith(repr(sim_E), \"ESimData{2, 1, 1, Float64}(25×\")\n        @test startswith(repr(sim_L), \"LSimData{2, 1, 1, Float64}(3 steps\")\n    end\n\n    @testset \"Manual loading by hash prefix\" begin\n        prefix = calculate_hash(params_E)[1:8]\n        entries = load_sim_data(prefix)\n        @test entries[\"raw\"] isa ESimData && entries[\"raw\"].params[:test_id] == \"format_E\"\n        @test load_sim_data(prefix; key = \"raw\") isa ESimData\n        # metadata is the dataset's own: any name, it can't clobber the file layout\n        save_sim_data(sim_E; overwrite = true, metadata = Dict(\"raw\" => 1, :conv_L => 2, :note => \"kept\"))\n        @test load_sim_data(prefix; key = \"raw\").metadata[:note] == \"kept\" && load_sim_data(prefix)[\"raw\"].metadata[:raw] == 1\n        @test load_sim_data(prefix)[\"metadata\"][:conv_L] == 2\n        PDEStudioCore.JLD2.jldopen(f -> (f[\"grp/a\"] = 1), get_file_name(params_E), \"a+\")   # (a group of the user's)\n        @test load_sim_data(prefix)[\"grp/a\"] == 1\n        @test_throws SimFileNotFoundError load_sim_data(\"00000000000000000\")\n        @test_throws SimFileNotFoundError load_sim_data(\"2026-10\")  # timestamps are not matched\n    end\nend\n\n# A type with its own serialization whose reading can fail (a package type whose stored form changed)\nstruct FragileEntry\n    s::String\nend\nPDEStudioCore.JLD2.writeas(::Type{FragileEntry}) = String\nPDEStudioCore.JLD2.wconvert(::Type{String}, x::FragileEntry) = x.s\nFRAGILE_FAILS = Ref(false)\nPDEStudioCore.JLD2.rconvert(::Type{FragileEntry}, s::String) = FRAGILE_FAILS[] ? error(\"changed format\") : FragileEntry(s)\n\n# Runs `f` with a fresh, empty save path (so tests can look at the whole data directory)\nfunction with_fresh_save_path(f)\n    old = get_save_path()\n    set_save_path!(mktempdir())\n    try\n        f()\n    finally\n        set_save_path!(old)\n    end\nend\n\n@testset \"Data management: directory index\" begin\n    with_fresh_save_path() do\n        p = create_param_dict(:N => 8, :test_mode => \"index\")\n        save_sim_data(advection_solver_1d(p); verbose = false)\n        file = get_file_name(p)\n        h = PDEStudioCore._filename_hash(basename(file))\n        @test PDEStudioCore._files_with_hash(h) == [file] && does_sim_data_exist(p)\n        # files added and removed by others (another process, the shell) are seen, also right after a listing\n        older = joinpath(dirname(file), \"2020-01-01_00-00-00_000_\" * h * \".jld2\")\n        cp(file, older); touch(file)\n        @test PDEStudioCore._files_with_hash(h) == [file, older]   # newest first\n        rm(file)\n        @test PDEStudioCore._files_with_hash(h) == [older] && get_file_name(p) == older\n        # ... and if the directory's time didn't change long after a listing (a file system caching it): a missing\n        # hash is looked up again, and a listed file is checked to exist\n        idx = PDEStudioCore._data_index()\n        fake = \"f\" ^ 64\n        added = joinpath(dirname(older), \"2020-01-01_00-00-00_000_\" * fake * \".jld2\")\n        cp(older, added)\n        idx.stamp = mtime(dirname(older))\n        idx.listed = idx.stamp + 2 * PDEStudioCore._INDEX_RACY   # (as if listed long after)\n        @test PDEStudioCore._files_with_hash(fake) == [added]\n        idx = PDEStudioCore._data_index()\n        rm(older)\n        idx.stamp = mtime(dirname(added))\n        idx.listed = idx.stamp + 2 * PDEStudioCore._INDEX_RACY   # (as if listed long after)\n        @test isempty(PDEStudioCore._files_with_hash(h)) && !does_sim_data_exist(p)\n        # writers update it\n        save_sim_data(advection_solver_1d(p); verbose = false)\n        @test does_sim_data_exist(p) && length(PDEStudioCore._data_files()) == 2\n        delete_sim_data(Dict(:test_mode => \"index\"))\n        @test !does_sim_data_exist(p) && isempty(PDEStudioCore._data_files())   # (the copy has the same parameters)\n        # another save path has another index\n        set_save_path!(mktempdir())\n        @test isempty(PDEStudioCore._data_files())\n    end\nend\n\n@testset \"Data management: file format version\" begin\n    JLD2 = PDEStudioCore.JLD2\n    with_fresh_save_path() do\n        p = create_param_dict(:N => 8, :scheme => \"upwind\", :cfl => 0.5, :sim_func_name => :counting_solver,\n                              :test_mode => \"format\")\n        save_sim_data(advection_solver_1d(p); verbose = false)\n        path = get_file_name(p)\n        @test JLD2.jldopen(f -> f[\"format_version\"], path, \"r\") == PDEStudioCore._FORMAT_VERSION\n        @test upgrade_sim_data(path) == Dict(:upgraded => String[], :current => [path], :unreadable => String[])\n        # a file of 0.4 (no version, no axes): still read; upgrade_sim_data adds what it lacks\n        JLD2.jldopen(path, \"a+\") do f\n            delete!(f, \"format_version\"); delete!(f, \"dim_keys\"); delete!(f, \"time_dim\")\n        end\n        @test does_sim_data_exist(p) && JLD2.jldopen(PDEStudioCore._format_version, path, \"r\") == 1\n        @test upgrade_sim_data(path; dry_run = true)[:upgraded] == [path]\n        @test !JLD2.jldopen(f -> haskey(f, \"format_version\"), path, \"r\")\n        @test upgrade_sim_data()[:upgraded] == [path]\n        @test JLD2.jldopen(f -> (f[\"format_version\"], f[\"dim_keys\"], f[\"time_dim\"]), path, \"r\") ==\n              (PDEStudioCore._FORMAT_VERSION, [:x, :t], :t)\n        @test upgrade_sim_data()[:current] == [path]\n        # (an entry \"format_version\" a user stored in a file of 0.4, where the name wasn't reserved, doesn't count)\n        JLD2.jldopen(f -> (delete!(f, \"format_version\"); f[\"format_version\"] = \"mine\"), path, \"a+\")\n        @test JLD2.jldopen(PDEStudioCore._format_version, path, \"r\") == 1 && sim_data_table().format_version == [1]\n        upgrade_sim_data(path)\n        # a file of an earlier version (only the data): upgraded by the pipeline instead of recomputed\n        sim = load_sim_data(p)\n        rm(path)\n        JLD2.jldopen(f -> (f[\"raw\"] = sim), path, \"w\")\n        SOLVER_CALLS[] = 0\n        s = run_all_simulations(SimulationConfig(p); dry_run = true)   # (says what the run does, writes nothing)\n        @test length(s.cached) == 1 && isempty(s.ran) && !JLD2.jldopen(f -> haskey(f, \"native\"), path, \"r\")\n        @test upgrade_sim_data(path; dry_run = true)[:upgraded] == [path]\n        s = @test_logs (:info, r\"Upgraded\") match_mode = :any run_all_simulations(SimulationConfig(p))\n        @test length(s.cached) == 1 && SOLVER_CALLS[] == 0\n        @test JLD2.jldopen(PDEStudioCore._format_version, path, \"r\") == PDEStudioCore._FORMAT_VERSION\n        @test load_sim_data(p).u == sim.u\n        # ... unless its data doesn't load as a dataset: recomputed\n        rm(path)\n        JLD2.jldopen(f -> (f[\"raw\"] = \"not a dataset\"), path, \"w\")\n        @test upgrade_sim_data(path; dry_run = true)[:unreadable] == [path]\n        @test length(run_all_simulations(SimulationConfig(p); dry_run = true).ran) == 1\n        @test upgrade_sim_data(path)[:unreadable] == [path]\n        @test length(run_all_simulations(SimulationConfig(p)).ran) == 1 && SOLVER_CALLS[] == 1\n        @test_throws ArgumentError upgrade_sim_data(joinpath(get_save_path(), \"no such file.jld2\"))\n    end\nend\n\n@testset \"Data management: files of 0.4 (before the metadata field)\" begin\n    JLD2 = PDEStudioCore.JLD2\n    with_fresh_save_path() do\n        dir = joinpath(get_save_path(), \"data\")\n        mkpath(dir)\n        fixtures = joinpath(@__DIR__, \"fixtures\", \"v0.4\", \"data\")   # (written by write_fixtures.jl with 0.4.4)\n        foreach(f -> cp(joinpath(fixtures, f), joinpath(dir, f)), readdir(fixtures))\n        p, q = create_param_dict(:n => 5, :kind => \"eul\"), create_param_dict(:n => 4, :kind => \"lag\")\n        @test does_sim_data_exist(p) && does_sim_data_exist(q)\n        d, l = load_sim_data(p), load_sim_data(q)\n        @test d isa ESimData{2, 1, 2, Float64} && size(d.u) == (5, 3) && d.u[1] == SVector(1.0, 2.0)\n        @test d.metadata == Dict(:note => \"hello\", :iterations => 3)   # (its entries of `save_sim_data(...; metadata)`)\n        @test l isa LSimData{2, 1, 1, Float64} && isempty(l.metadata) && length(l.t) == 2\n        @test load_sim_data(p, :lagrangian).metadata[:note] == \"hello\"   # (a conversion 0.4 cached in the file)\n        @test sort(sim_data_table().format_version) == [1, 1]\n        # the pipeline uses them as they are (no recomputation, nothing written)\n        stamps = mtime.(joinpath.(dir, readdir(dir)))\n        @test length(run_all_simulations(SimulationConfig(p)).cached) == 1 && mtime.(joinpath.(dir, readdir(dir))) == stamps\n        # upgrade_sim_data writes them in the current layout, with the same data\n        @test length(upgrade_sim_data()[:upgraded]) == 2\n        d3 = load_sim_data(p)\n        @test d3.u == d.u && d3.metadata == d.metadata && load_sim_data(q).t == l.t\n        # an entry \"metadata\" of 0.4 (which didn't reserve the name) is one of the user's entries\n        foreach(f -> cp(joinpath(fixtures, f), joinpath(dir, f); force = true), readdir(fixtures))\n        JLD2.jldopen(f -> (f[\"metadata\"] = \"mine\"; f[\"postprocessed\"] = Dict(\"smoothing\" => \"done\")), get_file_name(q), \"a+\")\n        @test load_sim_data(q).metadata == Dict(:metadata => \"mine\", :postprocessed => Dict(\"smoothing\" => \"done\"))\n        @test size(sim_data_table(), 1) == 2\n        @test length(run_all_simulations(SimulationConfig(q)).cached) == 1\n        # recording a post-processing writes such a file in the current layout first (no copies of its entries)\n        POST_CALLS[] = 0\n        size_p = filesize(get_file_name(p))\n        @test run_all_simulations(SimulationConfig(p; postprocess = :count_post)).postprocessing == Dict(:ran => 1)\n        @test JLD2.jldopen(PDEStudioCore._format_version, get_file_name(p), \"r\") == PDEStudioCore._FORMAT_VERSION\n        md_p = load_sim_data(p).metadata\n        @test md_p[:note] == \"hello\" && haskey(md_p[:postprocessed], :count_post) && POST_CALLS[] == 1\n        @test filesize(get_file_name(p)) \u003c 2 * size_p\n        # an entry that can't be read is left behind (with a warning), the rest of the file is written\n        foreach(f -> cp(joinpath(fixtures, f), joinpath(dir, f); force = true), readdir(fixtures))\n        JLD2.jldopen(f -> (f[\"fragile\"] = FragileEntry(\"x\")), get_file_name(p), \"a+\")\n        FRAGILE_FAILS[] = true\n        s_fr = @test_logs (:warn, r\"Entry 'fragile' .* can't be read\") match_mode = :any run_all_simulations(SimulationConfig(p; postprocess = :count_post))\n        FRAGILE_FAILS[] = false\n        @test s_fr.postprocessing == Dict(:ran => 1) && load_sim_data(p).metadata[:note] == \"hello\"\n        # large metadata: a changed record doesn't leave copies of it in the file\n        foreach(f -> cp(joinpath(fixtures, f), joinpath(dir, f); force = true), readdir(fixtures))\n        JLD2.jldopen(f -> (f[\"big\"] = rand(200_000)), get_file_name(p), \"a+\")   # (1.6 MB)\n        run_all_simulations(SimulationConfig(p; postprocess = :count_post))\n        size1 = filesize(get_file_name(p))\n        run_all_simulations(SimulationConfig(p; postprocess = :count_post); force_postprocess = true)\n        @test size1 \u003c 1.5 * 1.6e6 && filesize(get_file_name(p)) \u003c 1.2 * size1 && length(load_sim_data(p).metadata[:big]) == 200_000\n        @test JLD2.jldopen(f -> (PDEStudioCore._format_version(f), haskey(f, \"note\"), isempty(f[\"raw\"].metadata)),\n                           get_file_name(p), \"r\") == (PDEStudioCore._FORMAT_VERSION, false, true)\n    end\nend\n\n@testset \"Data management: provenance\" begin\n    JLD2 = PDEStudioCore.JLD2\n    meta_of(path) = JLD2.jldopen(PDEStudioCore._file_metadata, path, \"r\")   # (read without loading the data)\n    with_fresh_save_path() do\n        p = create_param_dict(:N => 8, :test_mode => \"provenance\")\n        save_sim_data(advection_solver_1d(p); verbose = false)\n        prov = meta_of(get_file_name(p))[:provenance]\n        @test prov[:pdestudiocore] == string(pkgversion(PDEStudioCore)) && prov[:julia] == string(VERSION)\n        @test prov[:host] == gethostname() && prov[:threads] == Threads.nthreads() && !haskey(prov, :solver)\n        # data a solver made: the solver and its wall time\n        q = create_param_dict(:N => 8, :scheme => \"upwind\", :cfl => 0.5, :sim_func_name => :advection_solver_1d,\n                              :test_mode => \"provenance\")\n        cfg = SimulationConfig(q; postprocess = :keep_post)\n        run_all_simulations(cfg)\n        path = get_file_name(q)\n        prov = meta_of(path)[:provenance]\n        @test prov[:solver] == \"advection_solver_1d\" && prov[:solver_module] == \"Main\" && !haskey(prov, :solver_version)\n        @test prov[:wall_time] isa Float64 && prov[:wall_time] >= 0\n        @test load_sim_data(q).metadata[:provenance] == prov   # (the metadata comes with the data)\n        # kept by rewrites of the same data (post-processing, statistics), replaced with new data\n        run_all_simulations(cfg; calculate_stats = true, force_postprocess = true)\n        @test meta_of(get_file_name(q))[:provenance] == prov\n        # ... also when the same data is saved again by hand (e.g. after add_stat!)\n        sim = load_sim_data(q)\n        add_stat!(sim, :extra, 1.0, Symbol[])\n        save_sim_data(sim; overwrite = true, verbose = false)\n        @test (m = meta_of(get_file_name(q)); (m[:provenance], collect(keys(m[:postprocessed])))) == (prov, [:keep_post])\n        @test run_all_simulations(cfg).postprocessing == Dict(:skipped => 1)\n        # ... but the same solution recomputed without the statistics of the file keeps only the provenance (what a\n        # post-processor added is gone)\n        save_sim_data(advection_solver_1d(q); overwrite = true, verbose = false)\n        @test (m = meta_of(get_file_name(q)); (m[:provenance], haskey(m, :postprocessed))) == (prov, false)\n        @test run_all_simulations(cfg).postprocessing == Dict(:ran => 1)\n        # (functions, callable objects and types are named in the provenance)\n        @test PDEStudioCore._func_name.((advection_solver_1d, scaled_solver, ScaledSolver)) ==\n              (\"advection_solver_1d\", \"ScaledSolver\", \"ScaledSolver\")\n        run_all_simulations(cfg; force_overwrite = true)\n        @test meta_of(get_file_name(q))[:provenance][:created] != prov[:created]\n        # new data saved by hand: a new provenance, no record\n        sim = advection_solver_1d(q)\n        sim.u[1] = SVector(5.0)\n        save_sim_data(sim; overwrite = true, verbose = false)\n        @test (m = meta_of(get_file_name(q)); (haskey(m[:provenance], :solver), haskey(m, :postprocessed))) == (false, false)\n        # a file calculate_all_stats! writes has a provenance, too\n        r = create_param_dict(:N => 8, :test_mode => \"provenance-stats\")\n        calculate_all_stats!(advection_solver_1d(r))\n        @test haskey(meta_of(get_file_name(r))[:provenance], :pdestudiocore)\n        # entries of the layout and the record are reserved\n        # metadata of your own (a solver's, or given when saving) is saved with the data, and it is no statistic\n        m = create_param_dict(:N => 8, :test_mode => \"own-metadata\")\n        @test create_sim_data(collect(0.0:0.5:1.0), [1.0, 2.0, 3.0], m; metadata = Dict(\"a\" => 1)).metadata == Dict(:a => 1)\n        d = advection_solver_1d(m)\n        d.metadata = Dict(\"iterations\" => 12)   # (Symbol keys, a copy)\n        @test d.metadata == Dict(:iterations => 12)\n        save_sim_data(d; verbose = false, metadata = Dict(:converged => true))\n        back = load_sim_data(m)\n        @test back.metadata[:iterations] == 12 && back.metadata[:converged] && haskey(back.metadata, :provenance)\n        @test !haskey(back.stats, :iterations) && !(:iterations in PDEStudioCore._stored_stat_keys(get_file_name(m)))\n        @test isempty(JLD2.jldopen(f -> f[\"raw\"].metadata, get_file_name(m), \"r\"))   # (stored once, as \"metadata\")\n        @test convert_to_lagrangian(back).metadata[:iterations] == 12   # (conversions carry it)\n        @test isempty(PDEStudioCore._without_metadata(back).metadata) && back.metadata[:iterations] == 12   # (what is stored)\n        # an entry removed from the metadata stays removed; a recomputed dataset keeps the pipeline's entries\n        prov_m = back.metadata[:provenance]\n        delete!(back.metadata, :converged)\n        save_sim_data(back; overwrite = true, verbose = false)\n        @test !haskey(load_sim_data(m).metadata, :converged)\n        save_sim_data(advection_solver_1d(m); overwrite = true, verbose = false)\n        @test load_sim_data(m).metadata == Dict(:provenance => prov_m)\n        # an entry written next to the data with JLD2 is kept, also with a metadata entry of the same name\n        JLD2.jldopen(f -> (f[\"provenance\"] = \"an entry\"), get_file_name(m), \"a+\")\n        d_m = load_sim_data(m)\n        add_stat!(d_m, :extra, 1.0, Symbol[])\n        save_sim_data(d_m; overwrite = true, verbose = false)\n        @test JLD2.jldopen(f -> f[\"provenance\"], get_file_name(m), \"r\") == \"an entry\" && load_sim_data(m).metadata[:provenance] == prov_m\n        # metadata that can't be read: the data loads without it (with a warning), nothing replaces it\n        d_m = load_sim_data(m)\n        d_m.metadata[:fragile] = FragileEntry(\"x\")\n        save_sim_data(d_m; overwrite = true, verbose = false)\n        FRAGILE_FAILS[] = true\n        @test isempty((@test_logs (:warn, r\"metadata of .* can't be read\") load_sim_data(m)).metadata)\n        @test_throws ErrorException PDEStudioCore._update_metadata!(get_file_name(m), :note => 1)\n        FRAGILE_FAILS[] = false\n        @test load_sim_data(m).metadata[:fragile] == FragileEntry(\"x\")\n        # the pipeline's entries of the unreleased format 2 (String keys, records with their name)\n        v2 = PDEStudioCore._legacy_records!(Dict{Symbol, Any}(:provenance => Dict(\"solver\" => \"s\"),\n                                                              :postprocessed => Dict(\"name\" => \"post\", \"sources\" => String[])))\n        @test v2[:provenance] == Dict(:solver => \"s\") && v2[:postprocessed] == Dict(:post => Dict(:sources => String[]))\n        # new data from a solver: its own metadata, the pipeline's entries replace those of the same name\n        run_smart_simulation(advection_solver_1d, m; force_overwrite = true, metadata = Dict(:provenance => 1, :tag => \"x\"))\n        md = load_sim_data(m).metadata\n        @test md[:provenance] isa AbstractDict && md[:tag] == \"x\" && !haskey(md, :iterations)\n        # the git commit, read from the repository's files\n        repo = mktempdir()\n        sha = \"0123456789abcdef0123456789abcdef01234567\"\n        mkpath(joinpath(repo, \".git\", \"refs\", \"heads\")); mkpath(joinpath(repo, \"sub\", \"dir\"))\n        write(joinpath(repo, \".git\", \"HEAD\"), \"ref: refs/heads/main\\n\")\n        write(joinpath(repo, \".git\", \"refs\", \"heads\", \"main\"), sha * \"\\n\")\n        @test PDEStudioCore._git_commit(joinpath(repo, \"sub\", \"dir\")) == sha\n        rm(joinpath(repo, \".git\", \"refs\", \"heads\", \"main\"))\n        write(joinpath(repo, \".git\", \"packed-refs\"), \"# pack-refs with: peeled\\n$sha refs/heads/main\\n\")\n        @test PDEStudioCore._git_commit(repo) == sha\n        write(joinpath(repo, \".git\", \"HEAD\"), reverse(sha) * \"\\n\")   # detached\n        @test PDEStudioCore._git_commit(repo) == reverse(sha)\n        # a worktree: \".git\" is a file pointing to its git dir, which shares the refs of the main repository\n        wt = mktempdir()\n        wtgit = joinpath(repo, \".git\", \"worktrees\", \"wt\")\n        mkpath(wtgit)\n        write(joinpath(wtgit, \"HEAD\"), \"ref: refs/heads/main\\n\"); write(joinpath(wtgit, \"commondir\"), \"../..\\n\")\n        write(joinpath(wt, \".git\"), \"gitdir: $wtgit\\n\")\n        @test PDEStudioCore._git_commit(wt) == sha\n    end\nend\n\n@testset \"Data management: tidy and table\" begin\n    with_fresh_save_path() do\n        @test tidy_sim_data() == (duplicates = String[], temp_files = String[])\n        t = sim_data_table()\n        @test size(t, 1) == 0 && names(t)[1:3] == [\"file\", \"created\", \"size_mb\"]\n        p = create_param_dict(:N => 8, :scheme => \"upwind\", :cfl => 0.5, :sim_func_name => :advection_solver_1d,\n                              :test_mode => \"tidy\")\n        run_all_simulations(SimulationConfig(p; varied = Dict(:N => [8, 9]), postprocess = :count_post); calculate_stats = true)\n        file = get_file_name(p)\n        dir = dirname(file)\n        h = PDEStudioCore._filename_hash(basename(file))\n        older = joinpath(dir, \"2020-01-01_00-00-00_000_\" * h * \".jld2\")\n        cp(file, older); touch(file)\n        tmp = PDEStudioCore._tmp_path(file)\n        write(tmp, \"an unfinished write\")\n        write(joinpath(dir, \"notes.tmp\"), \"not ours\")\n        # unfinished writes are removed once they are old enough\n        @test tidy_sim_data(dry_run = true) == (duplicates = [older], temp_files = String[])\n        @test tidy_sim_data(dry_run = true, min_tmp_age = 0) == (duplicates = [older], temp_files = [tmp])\n        @test isfile(older) && isfile(tmp)\n\n        # the table: one row per file, newest first\n        t = sim_data_table()\n        row(name) = only(findall(==(name), t.file))\n        @test size(t, 1) == 3 && issorted(mtime.(joinpath.(dir, t.file)); rev = true)\n        @test t.created[row(basename(older))] == PDEStudioCore.DateTime(2020) && all(==(:eulerian), t.kind)\n        @test t.shape[row(basename(file))] == size(load_sim_data(p).u) && all(==(PDEStudioCore._FORMAT_VERSION), t.format_version)\n        @test all(s -> :mass in s, t.stats) && all(==(\"count_post\"), t.postprocessed) && all(==(\"advection_solver_1d\"), t.solver)\n        @test all(x -> x isa Float64, t.wall_time) && sort(unique(t.N)) == [8, 9] && all(==(\"tidy\"), t.test_mode)\n        @test size(sim_data_table(Dict(:N => 9)), 1) == 1\n        save_sim_data(advection_solver_1d(create_param_dict(:N => 5, :M => 3, :test_mode => \"table\", :file => \"mesh.msh\",\n                                                       :param_file => \"other.cfg\"));\n                      verbose = false)\n        t = sim_data_table()\n        @test t.param_param_file[1] == \"mesh.msh\" && t.param_file[1] == \"other.cfg\" && endswith(t.file[1], \".jld2\")\n        @test all(ismissing, t.param_file[2:end])\n        @test size(t, 1) == 4 && ismissing(t.wall_time[1]) && ismissing(t.postprocessed[1]) && ismissing(t.solver[1])\n        @test t.M[1] == 3 && all(ismissing, t.M[2:end]) && ismissing(t.scheme[1])\n\n        removed = tidy_sim_data(min_tmp_age = 0)\n        @test removed == (duplicates = [older], temp_files = [tmp])\n        @test !isfile(older) && !isfile(tmp) && isfile(joinpath(dir, \"notes.tmp\")) && does_sim_data_exist(p)\n        @test size(sim_data_table(), 1) == 3\n    end\nend\n","changed":[],"added":0,"removed":0},{"name":"test_examples.jl","path":"test/test_examples.jl","type":"file","files":1,"lines":79,"levels":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [3]"},"errors":[],"counts":{"AI-Generation":{"files":{"G3":0.9999999999999999},"lines":{"G3":79}},"Human-Review":{"files":{"H0":0.012658227848101266,"H1":0.9873417721518987},"lines":{"H0":1,"H1":78}},"AI-Review":{"files":{"A1":0.9999999999999999},"lines":{"A1":79}}},"parts":[{"lines":75,"runs":[[1,22],[26,36],[38,79]],"declaration":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [3]"},"levels":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":3,"runs":[[23,25]],"declaration":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] 5dd99bd"},"levels":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":1,"runs":[[37,37]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] 6e36904"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"# The built-in examples (src/Examples): every test_* config runs, and every solver shows what its docstring says.\nusing PDEStudioCore.Examples: solve_advection_1d, exact_advection_1d, solve_burgers_1d, solve_heat_1d, exact_heat_1d,\n    solve_heat_2d, exact_heat_2d, solve_poisson_2d, exact_poisson_2d, solve_particles_2d\n\n# Run the solver of `config` for one method and one value of the swept parameter\nfunction run_example(config, method; kw...)\n    params = merge(copy(config.shared), config.methods[method], Dict{Symbol, Any}(kw))\n    return PDEStudioCore.resolve_dynamic_function(params[:sim_func_name])(params)\nend\n# Maximum error of the last snapshot of an Eulerian run against an exact solution\nfunction final_error(sim, exact)\n    pts = Iterators.product(sim.axes[1:end-1]...)\n    t = sim.axes[end][end]\n    return maximum(abs(sim.u[Tuple(I)..., end][1] - exact(SVector(p..., t))[1])\n                   for (I, p) in zip(CartesianIndices(size(sim.u)[1:end-1]), pts))\nend\n\n@testset \"Examples\" begin\n    @testset \"Every example config runs\" begin\n        for example in (test_advection_1d, test_burgers_1d, test_heat_1d, test_heat_2d, test_poisson_2d, test_particles_2d)\n            config = example()\n            @test config isa SimulationConfig\n            summary = run_all_simulations(config; parallel = true, calculate_stats = true)\n            @test summary isa RunSummary && isempty(summary.failed) && length(summary.ran) == length(summary.tasks)\n            @test isempty(summary.stats_failed)\n            # the solver and the reference are found by name, without set_target_module!\n            @test PDEStudioCore.resolve_dynamic_function(config.shared[:sim_func_name]) isa Function\n            isnothing(config.reference) || @test PDEStudioCore.resolve_dynamic_function(config.reference) isa Function\n        end\n    end\n\n    @testset \"Advection: order and the exact CFL number\" begin\n        cfg = test_advection_1d()\n        ex = exact_advection_1d(cfg.shared)\n        err(m, cfl) = final_error(run_example(cfg, m; cfl), ex)\n        @test err(:upwind, 1.0) \u003c 1e-12 && err(:lax_wendroff, 1.0) \u003c 1e-12      # exact shifts at ν = 1\n        @test err(:lax_friedrichs, 1.0) \u003c 1e-12                                 # (l + r)/2 - (r - l)/2 = l\n        @test err(:lax_wendroff, 0.5) \u003c err(:upwind, 0.5) \u003c err(:lax_friedrichs, 0.5)\n    end\n\n    @testset \"Burgers: conservative schemes keep the mass\" begin\n        cfg = test_burgers_1d()\n        mass(m) = (sim = run_example(cfg, m); sum(u[1] for u in sim.u[:, end]) - sum(u[1] for u in sim.u[:, 1]))\n        @test abs(mass(:godunov)) \u003c 1e-10 && abs(mass(:lax_friedrichs)) \u003c 1e-10\n        @test abs(mass(:nonconservative_upwind)) > 1e-3\n    end\n\n    @testset \"Heat 1D: explicit stability limit, Crank–Nicolson most accurate\" begin\n        cfg = test_heat_1d()\n        ex = exact_heat_1d(cfg.shared)\n        err(m, r) = final_error(run_example(cfg, m; r), ex)\n        @test err(:explicit, 0.6) > 1                                            # unstable above r = 1/2\n        @test err(:implicit, 0.6) \u003c 1e-2 && err(:crank_nicolson, 0.6) \u003c 1e-3\n        @test err(:crank_nicolson, 0.4) \u003c err(:implicit, 0.4)\n    end\n\n    @testset \"Heat 2D: explicit stability limit, ADI stable\" begin\n        cfg = test_heat_2d()\n        ex = exact_heat_2d(cfg.shared)\n        err(m, r) = final_error(run_example(cfg, m; r), ex)\n        @test err(:explicit, 0.3) > 1\n        @test err(:explicit, 0.25) \u003c 1e-3 && err(:adi, 0.3) \u003c 1e-3\n    end\n\n    @testset \"Poisson: SOR reaches the discretisation error, Jacobi doesn't\" begin\n        cfg = test_poisson_2d()\n        ex = exact_poisson_2d(cfg.shared)\n        err(m) = final_error(run_example(cfg, m), ex)\n        @test err(:sor) \u003c 2e-3                                                   # O(h²) at N = 32\n        @test err(:jacobi) > err(:gauss_seidel) > 10 * err(:sor)\n        @test run_example(cfg, :sor).axes[end] == 0:cfg.shared[:iterations]          # t counts the iterations\n    end\n\n    @testset \"Particles: Euler spirals out, RK4 keeps the radius\" begin\n        cfg = test_particles_2d()\n        drift(m) = (sim = run_example(cfg, m); maximum(abs(hypot(p...) - u[1]) for (p, u) in zip(sim.x[end], sim.u[end])))\n        @test drift(:euler) > 1 > 0.1 > drift(:rk2) > 0.01 > 1e-3 > drift(:rk4)               # at dt = 0.05\n    end\nend\n","changed":[],"added":0,"removed":0},{"name":"test_pipeline.jl","path":"test/test_pipeline.jl","type":"file","files":1,"lines":389,"levels":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1","
