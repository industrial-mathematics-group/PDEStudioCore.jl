, methods, [:euler, :rk2, :rk4]; varied = varied, reference = :exact_particles_2d)\nend\n","changed":[],"added":0,"removed":0},{"name":"poisson_2d.jl","path":"src/Examples/poisson_2d.jl","type":"file","files":1,"lines":65,"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"errors":[],"parts":[{"lines":65,"runs":[[1,65]],"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"\"\"\"\n    solve_poisson_2d(params) -> ESimData\n\nThe Poisson equation ``-\\\\Delta u = 2\\\\pi^2 \\\\sin(\\\\pi x)\\\\sin(\\\\pi y)`` on the unit square with ``u = 0`` on the\nboundary (solution ``\\\\sin(\\\\pi x)\\\\sin(\\\\pi y)``), five-point Laplacian on `N` intervals per direction, solved\niteratively from ``u = 0`` with `iterations` sweeps of the method `:solver`:\n- `\"jacobi\"`: every point from the old values of its neighbours; slow (``\\\\approx N^2`` sweeps per digit);\n- `\"gauss_seidel\"`: uses the new values as soon as they exist; about twice as fast;\n- `\"sor\"`: Gauss–Seidel over-relaxed with the optimal ``\\\\omega = 2 / (1 + \\\\sin(\\\\pi / N))``; ``\\\\approx N`` sweeps.\n\nA stationary problem: the time axis `t` counts the iterations (``t = k`` after ``k`` sweeps), so the plots show the\nconvergence. The error statistics level off at the discretisation error ``O(1/N^2)``. (It is called `t` rather than\ne.g. `:iteration` so that frontends that know the axes `x, y, z, t`, such as PDEStudio, show it as it is.)\n\"\"\"\nfunction solve_poisson_2d(params::ParamDict)\n    N, iterations, solver = params[:N], params[:iterations], params[:solver]\n    solver in (\"jacobi\", \"gauss_seidel\", \"sor\") || throw(ArgumentError(\"unknown solver $(repr(solver))\"))\n    h = 1.0 / N\n    x = collect(range(0.0, 1.0, length = N + 1))\n    f = [2π^2 * sin(π * xi) * sin(π * yj) for xi in x, yj in x]\n    ω = solver == \"sor\" ? 2 / (1 + sin(π * h)) : 1.0\n\n    v = zeros(N + 1, N + 1)\n    w = copy(v)\n    u = zeros(SVector{1, Float64}, N + 1, N + 1, iterations + 1)\n    for k in 1:iterations\n        if solver == \"jacobi\"\n            for j in 2:N, i in 2:N\n                w[i, j] = (v[i - 1, j] + v[i + 1, j] + v[i, j - 1] + v[i, j + 1] + h^2 * f[i, j]) / 4\n            end\n            v, w = w, v\n        else\n            for j in 2:N, i in 2:N                     # in place: new neighbour values are used at once\n                gs = (v[i - 1, j] + v[i + 1, j] + v[i, j - 1] + v[i, j + 1] + h^2 * f[i, j]) / 4\n                v[i, j] += ω * (gs - v[i, j])\n            end\n        end\n        u[:, :, k + 1] .= SVector.(v)\n    end\n    return create_sim_data((x, x), u, collect(0.0:iterations), params)   # dims (:x, :y, :t), t = iterations\nend\n\n\"\"\"\n    exact_poisson_2d(params)\n\nThe exact solution of [`solve_poisson_2d`](@ref) (the same for every iteration).\n\"\"\"\nexact_poisson_2d(params::ParamDict) = xyt -> SVector(sin(π * xyt[1]) * sin(π * xyt[2]))\n\n\"\"\"\n    test_poisson_2d() -> SimulationConfig\n\nThe convergence of three iterative solvers for the Poisson equation ([`solve_poisson_2d`](@ref)), with the exact\nsolution, swept over the grid size: Jacobi and Gauss–Seidel slow down with ``N^2``, SOR only with ``N``.\n\"\"\"\nfunction test_poisson_2d()\n    shared = create_param_dict(:N => 32, :iterations => 200, :sim_func_name => :solve_poisson_2d)\n    methods = create_method_dict(:exact => create_param_dict(),\n                                 :jacobi => create_param_dict(:solver => \"jacobi\"),\n                                 :gauss_seidel => create_param_dict(:solver => \"gauss_seidel\"),\n                                 :sor => create_param_dict(:solver => \"sor\"))\n    varied = create_varied_dict(:N => [16, 32])\n    return SimulationConfig(shared, methods, [:exact, :jacobi, :gauss_seidel, :sor];\n                            varied = varied, reference = :exact_poisson_2d)\nend\n","changed":[],"added":0,"removed":0}],"added":0,"removed":0,"changed_files":0},{"name":"Config.jl","path":"src/Config.jl","type":"file","files":1,"lines":134,"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"errors":[],"counts":{"AI-Generation":{"files":{"G2":0.753731343283582,"G3":0.2462686567164179},"lines":{"G2":101,"G3":33}},"Human-Review":{"files":{"H0":0.2462686567164179,"H2":0.753731343283582},"lines":{"H0":33,"H2":101}},"AI-Review":{"files":{"A0":0.23134328358208955,"A1":0.7686567164179104},"lines":{"A0":31,"A1":103}}},"parts":[{"lines":101,"runs":[[1,15],[18,88],[93,104],[107,109]],"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":2,"runs":[[16,17]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] 6e36904"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":31,"runs":[[89,92],[105,106],[110,134]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A0","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":[],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"commit d60e6c7 (restricted name lookup, derived datasets, hash …), pull request checkboxes"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A0"},"errors":[],"advisory":false}],"source":"# ==============================================================================\n# --- Pipeline configuration ---\n# ==============================================================================\n\n\"\"\"\n    SimulationConfig\n\nBlueprint of a batch of simulation runs.\n\n# Fields\n- `shared::ParamDict`: baseline parameters of every run (usually contains `:sim_func_name`).\n- `methods::MethodDict`: per-method parameter overrides (`:ignore => [...]` drops shared keys).\n- `defaults::Vector{Symbol}`: the methods [`run_all_simulations`](@ref) executes.\n- `varied::VariedDict`: the parameter sweep (Cartesian product).\n- `reference::Union{Symbol, Nothing}`: name of a reference *factory* `params -> (x -> u_exact)`.\n- `postprocess::Union{Symbol, Nothing}`: name of a function `data -> Bool` run on every dataset after the\n  statistics (return `true` to save the modified data; the data itself is saved either way).\n- `sources::Vector{String}`: files included into the target module before running.\n\"\"\"\nmutable struct SimulationConfig\n    shared::ParamDict\n    methods::MethodDict\n    defaults::Vector{Symbol}\n    varied::VariedDict\n    reference::Union{Symbol, Nothing}\n    postprocess::Union{Symbol, Nothing}\n    sources::Vector{String}\nend\n\n_optional_name(::Nothing) = nothing\n_optional_name(name::Union{Symbol, AbstractString}) = Symbol(name)\n_optional_name(f::Function) = nameof(f)\n\n# Normalises a loosely typed value for a SimulationConfig field (used by the constructor and setproperty!).\nfunction _config_field(field::Symbol, value)\n    if field === :shared\n        return _to_paramdict(value)\n    elseif field === :methods\n        return MethodDict(Symbol(k) => _to_paramdict(v) for (k, v) in value)\n    elseif field === :defaults\n        return value isa Union{Symbol, AbstractString} ? [Symbol(value)] : Symbol[Symbol(m) for m in value]\n    elseif field === :varied\n        return _to_varieddict(value)\n    elseif field === :reference || field === :postprocess\n        return _optional_name(value)\n    elseif field === :sources\n        return value isa AbstractString ? [String(value)] : String[String(s) for s in value]\n    end\n    throw(ArgumentError(\"SimulationConfig has no field `$field`\"))\nend\n\n\"\"\"\n    SimulationConfig(shared, methods = Dict(), defaults = all methods;\n                     varied = Dict(), reference = nothing, postprocess = nothing, sources = String[])\n\nBuilds a [`SimulationConfig`](@ref), converting loosely typed dictionaries (string or symbol keys)\ninto [`ParamDict`](@ref)/[`MethodDict`](@ref)/[`VariedDict`](@ref). Without `methods`, every run uses\nthe shared parameters only. Functions are referenced by name (resolved in [`get_target_module`](@ref)).\n\"\"\"\nfunction SimulationConfig(shared::AbstractDict = ParamDict(), methods::AbstractDict = MethodDict(),\n                          defaults = sort!(Symbol[Symbol(k) for k in keys(methods)]);\n                          varied::AbstractDict = VariedDict(),\n                          reference = nothing,\n                          postprocess = nothing,\n                          sources::Union{AbstractString, AbstractVector} = String[])\n    methods_p = _config_field(:methods, methods)\n    defaults_v = _config_field(:defaults, defaults)\n    for m in defaults_v\n        if !haskey(methods_p, m) && !isempty(methods_p) && !is_reference_method(m)\n            @warn \"SimulationConfig: method :$m is not defined in `methods`; it will run with the shared parameters only.\"\n        end\n    end\n\n    return SimulationConfig(_config_field(:shared, shared), methods_p, defaults_v, _config_field(:varied, varied),\n                            _config_field(:reference, reference), _config_field(:postprocess, postprocess),\n                            _config_field(:sources, sources))\nend\n\n# Assigning a field accepts the same loose input as the constructor (e.g. `config.defaults = :upwind`).\nBase.setproperty!(config::SimulationConfig, name::Symbol, value) = setfield!(config, name, _config_field(name, value))\n\n\"\"\"\n    resolve_dynamic_function(name, provided = nothing)\n\nLooks up the function called `name` (a `Symbol` or `String`) in the target module\n(see [`set_target_module!`](@ref)), then among the solvers and references of the built-in examples\n([`PDEStudioCore.Examples`](@ref)). A function passed as `provided` (or as `name`) is returned directly.\nReturns `nothing` (with a warning) if the name cannot be resolved.\n\nOnly names the target module (or one of its submodules) defines itself are accepted: names it merely imports\n(exports of `Base`, of PDEStudioCore or of other packages) are not, so a configuration file cannot run e.g.\n`delete_sim_data` or `rm` as its reference or solver. Define a wrapper in the target module to use such a function.\n\"\"\"\nfunction resolve_dynamic_function(name, provided::Union{Function, Nothing} = nothing)\n    provided === nothing || return provided\n    name === nothing && return nothing\n    name isa Function && return name\n    sym = Symbol(name)\n    sym === :none && return nothing\n    mod = get_target_module()\n    # Look the binding up in the latest world, so functions defined after the caller started\n    # (e.g. by including source files) are found.\n    f = Base.invokelatest(_lookup_global, mod, sym)\n    f === nothing && (f = _lookup_global(Examples, sym))\n    f === nothing && @warn \"Could not resolve function `$sym` in module $mod: it must be defined in that module \" *\n                           \"(or a submodule), imported names are not accepted (did you call `set_target_module!`?).\"\n    return f\nend\n\n# The binding `sym` of `mod` if `mod` (or one of its submodules) created it. `isdefined` alone would also find every\n# imported binding, such as the exports of Base and of PDEStudioCore: a values-only configuration file (loaded\n# without a confirmation) could then name `delete_sim_data` as its reference and run it.\nfunction _lookup_global(mod::Module, sym::Symbol)\n    isdefined(mod, sym) || return nothing\n    owner = try\n        which(mod, sym)   # the module that created the binding\n    catch\n        return nothing\n    end\n    _is_submodule(owner, mod) || return nothing\n    return getglobal(mod, sym)\nend\n\n# `m` is `root` or (transitively) one of its submodules. Another top-level module (Base, Core, a loaded package) is\n# not part of `root`, although its parent is `Main` like that of a module defined in `Main`.\nfunction _is_submodule(m::Module, root::Module)\n    while true\n        m === root && return true\n        Base.is_root_module(m) && return false\n        parent = parentmodule(m)\n        parent === m && return false\n        m = parent\n    end\nend\n","changed":[],"added":0,"removed":0},{"name":"Constructors.jl","path":"src/Constructors.jl","type":"file","files":1,"lines":250,"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"errors":[],"counts":{"AI-Generation":{"files":{"G2":0.916,"G3":0.084},"lines":{"G2":229,"G3":21}},"Human-Review":{"files":{"H1":0.084,"H2":0.916},"lines":{"H1":21,"H2":229}},"AI-Review":{"files":{"A1":1.0},"lines":{"A1":250}}},"parts":[{"lines":229,"runs":[[1,74],[77,101],[106,127],[130,143],[146,151],[154,156],[158,160],[163,236],[239,241],[243,245],[247,247],[250,250]],"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":21,"runs":[[75,76],[102,105],[128,129],[144,145],[152,153],[157,157],[161,162],[237,238],[242,242],[246,246],[248,249]],"declaration":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] 5dd99bd"},"levels":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"# ==============================================================================\n# --- create_sim_data: one N-dimensional front end ---\n# ==============================================================================\n\n_default_space_keys(DS::Int) = DS \u003c= 3 ? (:x, :y, :z)[1:DS] : ntuple(i -> Symbol(:x, i), DS)\n\nfunction _space_keys(DS::Int, dims)\n    names = dims === nothing ? Symbol[_default_space_keys(DS)...] :\n            dims isa Union{Symbol, AbstractString} ? [Symbol(dims)] : Symbol[Symbol(d) for d in dims]\n    length(names) == DS || throw(ArgumentError(\"`dims` must name $DS spatial dimension(s), got $(length(names))\"))\n    allunique(names) || throw(ArgumentError(\"`dims` must not repeat a name, got $(Tuple(names))\"))\n    return Tuple(names)\nend\n\n# --- Spatial coordinates: a vector, a tuple of axis vectors, or a tuple of ndgrid arrays ---\n_space_axes(x::AbstractVector{\u003c:Real}) = (x,)\n_space_axes(::Tuple{}) = ()\nfunction _space_axes(space::Tuple)\n    all(a -> a isa AbstractVector{\u003c:Real}, space) && return space\n    if all(a -> a isa AbstractArray{\u003c:Real} && ndims(a) == length(space), space)\n        sz = size(first(space))\n        all(a -> size(a) == sz, space) || throw(DimensionMismatch(\"all coordinate grids must have the same size\"))\n        return ntuple(d -> _axis_from_grid(space[d], d), length(space))\n    end\n    throw(ArgumentError(\"spatial coordinates must be a vector, a tuple of axis vectors or a tuple of ndgrid-style coordinate arrays\"))\nend\n\nfunction _axis_from_grid(grid::AbstractArray{\u003c:Real}, d::Int)\n    index = ntuple(i -> i == d ? Colon() : firstindex(grid, i), ndims(grid))\n    axis = vec(collect(grid[index...]))\n    if length(axis) > 1 && allequal(axis) && !allequal(grid)\n        throw(ArgumentError(\"coordinate grid $d does not vary along dimension $d. Grids must be in ndgrid order \" *\n                            \"(grid[i, j] == x[i]); transpose MATLAB/meshgrid-style arrays.\"))\n    end\n    return axis\nend\n\n# --- Solution packing: SVector arrays, scalar arrays, components-last arrays, arrays of vectors ---\nfunction _pack_solution(u::AbstractArray, D::Int, lens::Tuple)\n    E = eltype(u)\n    if E \u003c: SVector && ndims(u) == D\n        return convert(Array{SVector{length(E), float(eltype(E))}, D}, u)\n    elseif E \u003c: Real && ndims(u) == D\n        return _map_svec(u, Val(1), float(E))\n    elseif E \u003c: Real && ndims(u) == D + 1 && size(u)[1:D] == lens\n        return _pack_components(u, Val(size(u, D + 1)), float(E), Val(D))\n    elseif E \u003c: AbstractVector && ndims(u) == D && !isempty(u)\n        return _map_svec(u, Val(length(first(u))), float(eltype(E)))\n    end\n    throw(DimensionMismatch(\"cannot interpret a solution of type $(typeof(u)) and size $(size(u)) on axes of lengths $lens. \" *\n        \"Expected an array of SVectors (or of numbers) with one dimension per axis, or numbers with an extra trailing component dimension.\"))\nend\n\n_map_svec(u::AbstractArray, ::Val{M}, ::Type{T}) where {M, T} = map(v -> SVector{M, T}(v), u)\n\nfunction _pack_components(u::AbstractArray{\u003c:Real}, ::Val{M}, ::Type{T}, ::Val{D}) where {M, T, D}\n    out = Array{SVector{M, T}, D}(undef, ntuple(d -> size(u, d), Val(D)))\n    for I in CartesianIndices(out)\n        out[I] = SVector{M, T}(ntuple(c -> u[Tuple(I)..., c], Val(M)))\n    end\n    return out\nend\n\n# A bound is `nothing` (use the data extent), a number (all spatial dimensions) or one entry per dimension.\n_bound(b, d::Int) = b isa Number ? b : b[d]\n\nfunction _bounds_tuple(DS::Int, transient::Bool, xbounds, tbound)\n    if xbounds !== nothing && !(xbounds isa Number) && length(xbounds) != DS\n        throw(ArgumentError(\"spatial bounds must have $DS entries, got $(length(xbounds))\"))\n    end\n    s = ntuple(d -> xbounds === nothing ? nothing : _bound(xbounds, d), DS)\n    return transient ? (s..., tbound) : s\nend\n\n_with_metadata!(data::AbstractSimData, metadata::AbstractDict) = (isempty(metadata) || (data.metadata = metadata); data)\n\nfunction _create_eulerian(axes_in::Tuple, u::AbstractArray, params::AbstractDict, dim_keys::NTuple{D, Symbol},\n                          time_dim::Union{Nothing, Symbol}, mins_in::Tuple, maxs_in::Tuple) where {D}\n    length(axes_in) == D || throw(DimensionMismatch(\"expected $D coordinate axes, got $(length(axes_in))\"))\n    lens = ntuple(d -> length(axes_in[d]), D)\n    all(>(0), lens) || throw(ArgumentError(\"all axes need at least one point, got lengths $lens\"))\n    return _finish_eulerian(axes_in, _pack_solution(u, D, lens), params, dim_keys, time_dim, mins_in, maxs_in)\nend\n\nfunction _finish_eulerian(axes_in::Tuple, sol::Array{SVector{M, T}, D}, params::AbstractDict, dim_keys::NTuple{D, Symbol},\n                          time_dim::Union{Nothing, Symbol}, mins_in::Tuple, maxs_in::Tuple) where {M, T, D}\n    axes = ntuple(d -> collect(T, axes_in[d]), Val(D))\n    for d in 1:D\n        issorted(axes[d]) || throw(ArgumentError(\"axis :$(dim_keys[d]) must be sorted in increasing order\"))\n    end\n    mins = SVector{D, T}(ntuple(d -> mins_in[d] === nothing ? first(axes[d]) : T(mins_in[d]), Val(D)))\n    maxs = SVector{D, T}(ntuple(d -> maxs_in[d] === nothing ? last(axes[d]) : T(maxs_in[d]), Val(D)))\n    # The spacing is the mean node distance of each axis (independent of overridden bounds).\n    spacing = SVector{D, T}(ntuple(d -> length(axes[d]) > 1 ?\n        (last(axes[d]) - first(axes[d])) / T(length(axes[d]) - 1) : one(T), Val(D)))\n    domain = DomainInfo{D, T}(dim_keys, mins, maxs, spacing, time_dim, get_stat_registry())\n    DS = time_dim === nothing ? D : D - 1\n    return ESimData{D, DS, M, T}(params, domain, axes, sol)\nend\n\n\"\"\"\n    create_sim_data(space, u, t, params; dims, time_dim = :t, xmins, xmaxs, tmin, tmax, metadata)   # transient Eulerian\n    create_sim_data(space, u, params; dims, xmins, xmaxs, metadata)                                 # static Eulerian\n    create_sim_data(x, u, t, params; dims, time_dim = :t, xmins, xmaxs, tmin, tmax, metadata)       # transient Lagrangian\n    create_sim_data(x, u, params; dims, xmins, xmaxs, metadata)                                     # static Lagrangian\n\nBuilds an [`ESimData`](@ref) or [`LSimData`](@ref) of any spatial dimension. The global statistic\nregistry is copied into the dataset and `:Solution` is coupled to `u` automatically.\n\n# Eulerian input\n- `space`: a coordinate vector (1D), a tuple of axis vectors `(x, y, z, ...)`, or a tuple of\n  ndgrid-style coordinate arrays (`x_grid[i, j] == x[i]`).\n- `u`: an array with one dimension per spatial axis (plus a trailing time dimension when `t` is\n  given) whose elements are `SVector`s, numbers (a scalar field) or vectors. A numeric array with one\n  *extra* trailing dimension is read as components-last (`u[i, j, n, c]`).\n- `t`: the time vector (time is always the last axis).\n\n# Lagrangian input\n- `x`: particle positions, `Vector{Vector{SVector{DS}}}` (one vector per time step) or a single\n  `Vector{SVector{DS}}` for static data.\n- `u`: particle states with the same layout (`SVector`s or numbers).\n\n# Keywords\n- `dims`: names of the spatial axes (default `(:x, :y, :z)`, or `(:x1, :x2, ...)` beyond 3D).\n- `time_dim`: name of the time axis (default `:t`).\n- `xmins`, `xmaxs`, `tmin`, `tmax`: override the bounding box (defaults: extent of the data).\n  The integration measure (`domain.spacing`) is always derived from the axes themselves.\n- `metadata`: information about the run that isn't data (e.g. `Dict(:iterations => 412, :converged => true)`),\n  stored in the dataset's `metadata` field (copied) and saved with it; it is not plotted.\n\nThe parameters are copied, so later changes to `params` do not affect the dataset.\n\n# Examples\n```julia\ncreate_sim_data(x, u, t, params)                       # 1D + time, u[i, n]::SVector{M}\ncreate_sim_data((x, y), u, t, params)                  # 2D + time, u[i, j, n]\ncreate_sim_data((x, y, z), ρ, params; dims = (:r, :θ, :φ))   # static 3D scalar field\ncreate_sim_data((x_grid, y_grid), u, t, params)        # ndgrid coordinate arrays\ncreate_sim_data(x_traj, u_traj, t, params)             # particles over time\n```\n\"\"\"\nfunction create_sim_data(space::Union{AbstractVector{\u003c:Real}, Tuple}, u::AbstractArray, t::AbstractVector{\u003c:Real},\n                         params::AbstractDict; dims = nothing, time_dim::Union{Nothing, Symbol} = :t,\n                         xmins = nothing, xmaxs = nothing, tmin = nothing, tmax = nothing,\n                         metadata::AbstractDict = Dict{Symbol, Any}())\n    time_dim === nothing && throw(ArgumentError(\n        \"a time vector was given, so `time_dim` must be a Symbol; use `create_sim_data(space, u, params)` for static data\"))\n    s_axes = _space_axes(space)\n    DS = length(s_axes)\n    dim_keys = (_space_keys(DS, dims)..., time_dim)\n    time_dim in dim_keys[1:DS] && throw(ArgumentError(\"the time dimension :$time_dim is also used as a spatial dimension name\"))\n    return _with_metadata!(_create_eulerian((s_axes..., t), u, params, dim_keys, time_dim,\n                            _bounds_tuple(DS, true, xmins, tmin), _bounds_tuple(DS, true, xmaxs, tmax)), metadata)\nend\n\nfunction create_sim_data(space::Union{AbstractVector{\u003c:Real}, Tuple}, u::AbstractArray, params::AbstractDict;\n                         dims = nothing, xmins = nothing, xmaxs = nothing, metadata::AbstractDict = Dict{Symbol, Any}())\n    s_axes = _space_axes(space)\n    DS = length(s_axes)\n    DS >= 1 || throw(ArgumentError(\"static data needs at least one spatial axis\"))\n    return _with_metadata!(_create_eulerian(s_axes, u, params, _space_keys(DS, dims), nothing,\n                            _bounds_tuple(DS, false, xmins, nothing), _bounds_tuple(DS, false, xmaxs, nothing)), metadata)\nend\n\n# ------------------------------------------------------------------------------\n# --- Lagrangian ---\n# ------------------------------------------------------------------------------\n\nfunction _particle_bounds(x::Vector{Vector{SVector{DS, T}}}) where {DS, T}\n    lo = SVector{DS, T}(ntuple(_ -> typemax(T), Val(DS)))\n    hi = SVector{DS, T}(ntuple(_ -> typemin(T), Val(DS)))\n    found = false\n    for step in x, p in step\n        all(isfinite, p) || continue  # e.g. NaN for particles that left the domain\n        lo = min.(lo, p)\n        hi = max.(hi, p)\n        found = true\n    end\n    return found ? (lo, hi) : (zero(SVector{DS, T}), zero(SVector{DS, T}))\nend\n\n_particle_scalar(::Type{E}) where {E \u003c: SVector} = eltype(E)\n_particle_scalar(::Type{E}) where {E \u003c: Real} = E\n_particle_scalar(::Type{E}) where {E} = throw(ArgumentError(\n    \"particle states must be SVectors or numbers, got elements of type $E\"))\n\n_pack_particles(u::AbstractVector, ::Type{E}, ::Type{T}) where {E \u003c: SVector, T} =\n    Vector{SVector{length(E), T}}[convert(Vector{SVector{length(E), T}}, step) for step in u]\n_pack_particles(u::AbstractVector, ::Type{E}, ::Type{T}) where {E \u003c: Real, T} =\n    Vector{SVector{1, T}}[SVector{1, T}.(step) for step in u]\n\nfunction _create_lagrangian(x::AbstractVector, u::AbstractVector, t::AbstractVector{\u003c:Real}, params::AbstractDict,\n                            space_keys::Tuple, time_dim::Union{Nothing, Symbol}, xmins, xmaxs, tmin, tmax)\n    length(x) == length(u) || throw(DimensionMismatch(\"x and u must have the same number of time steps\"))\n    Ex = eltype(eltype(x))\n    Eu = eltype(eltype(u))\n    T = float(promote_type(eltype(Ex), _particle_scalar(Eu), eltype(t)))\n    DS = length(Ex)\n    xx = Vector{SVector{DS, T}}[convert(Vector{SVector{DS, T}}, step) for step in x]\n    uu = _pack_particles(u, Eu, T)\n    tt = collect(T, t)\n    issorted(tt) || throw(ArgumentError(\"the time vector must be sorted in increasing order\"))\n    dim_keys = time_dim === nothing ? space_keys : (space_keys..., time_dim)\n    return _build_lsimdata(xx, uu, tt, params, dim_keys, time_dim, xmins, xmaxs, tmin, tmax)\nend\n\nfunction _build_lsimdata(x::Vector{Vector{SVector{DS, T}}}, u::Vector{Vector{SVector{M, T}}}, t::Vector{T},\n                         params::AbstractDict, dim_keys::NTuple{D, Symbol}, time_dim::Union{Nothing, Symbol},\n                         xmins, xmaxs, tmin, tmax) where {DS, M, T, D}\n    _bounds_tuple(DS, false, xmins, nothing)  # validates the number of bounds\n    _bounds_tuple(DS, false, xmaxs, nothing)\n    lo, hi = _particle_bounds(x)\n    smins = ntuple(d -> xmins === nothing ? lo[d] : T(_bound(xmins, d)), Val(DS))\n    smaxs = ntuple(d -> xmaxs === nothing ? hi[d] : T(_bound(xmaxs, d)), Val(DS))\n    # Equivalent particle spacing: (volume / particles)^(1/DS).\n    np = max(1, maximum(length, x; init = 0))\n    vol = prod(smaxs .- smins)\n    dx = vol > 0 ? T((vol / np)^(1 / DS)) : one(T)\n    s_spacing = ntuple(_ -> dx, Val(DS))\n    registry = get_stat_registry()\n    if time_dim === nothing\n        domain = DomainInfo{D, T}(dim_keys, SVector{D, T}(smins), SVector{D, T}(smaxs), SVector{D, T}(s_spacing),\n                                  nothing, registry)\n    else\n        t0 = tmin === nothing ? first(t) : T(tmin)\n        t1 = tmax === nothing ? last(t) : T(tmax)\n        dt = length(t) > 1 ? (last(t) - first(t)) / T(length(t) - 1) : one(T)\n        domain = DomainInfo{D, T}(dim_keys, SVector{D, T}((smins..., t0)), SVector{D, T}((smaxs..., t1)),\n                                  SVector{D, T}((s_spacing..., dt)), time_dim, registry)\n    end\n    return LSimData{D, DS, M, T}(params, domain, t, x, u)\nend\n\nfunction create_sim_data(x::AbstractVector{\u003c:AbstractVector{\u003c:SVector{DS}}}, u::AbstractVector{\u003c:AbstractVector},\n                         t::AbstractVector{\u003c:Real}, params::AbstractDict;\n                         dims = nothing, time_dim::Union{Nothing, Symbol} = :t,\n                         xmins = nothing, xmaxs = nothing, tmin = nothing, tmax = nothing,\n                         metadata::AbstractDict = Dict{Symbol, Any}()) where {DS}\n    time_dim === nothing && throw(ArgumentError(\n        \"a time vector was given, so `time_dim` must be a Symbol; use `create_sim_data(x, u, params)` for static particles\"))\n    isempty(t) && throw(ArgumentError(\"the time vector must not be empty\"))\n    return _with_metadata!(_create_lagrangian(x, u, t, params, _space_keys(DS, dims), time_dim, xmins, xmaxs, tmin, tmax), metadata)\nend\n\nfunction create_sim_data(x::AbstractVector{\u003c:SVector{DS}}, u::AbstractVector, params::AbstractDict;\n                         dims = nothing, xmins = nothing, xmaxs = nothing, metadata::AbstractDict = Dict{Symbol, Any}()) where {DS}\n    T0 = float(promote_type(eltype(eltype(x)), _particle_scalar(eltype(u))))  # keeps e.g. Float32 data\n    return _with_metadata!(_create_lagrangian([x], [u], T0[0], params, _space_keys(DS, dims), nothing, xmins, xmaxs, nothing,\n                                              nothing), metadata)\nend\n","changed":[],"added":0,"removed":0},{"name":"ConversionUtils.jl","path":"src/ConversionUtils.jl","type":"file","files":1,"lines":290,"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"errors":[],"counts":{"AI-Generation":{"files":{"G2":0.9827586206896551,"G3":0.017241379310344827},"lines":{"G2":285,"G3":5}},"Human-Review":{"files":{"H0":0.010344827586206896,"H1":0.006896551724137931,"H2":0.9827586206896551},"lines":{"H0":3,"H1":2,"H2":285}},"AI-Review":{"files":{"A0":0.010344827586206896,"A1":0.9896551724137931},"lines":{"A0":3,"A1":287}}},"parts":[{"lines":285,"runs":[[1,167],[170,246],[249,288],[290,290]],"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":2,"runs":[[168,168],[247,247]],"declaration":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] 5dd99bd"},"levels":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":3,"runs":[[169,169],[248,248],[289,289]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A0","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":[],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"commit d60e6c7 (restricted name lookup, derived datasets, hash …), pull request checkboxes"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A0"},"errors":[],"advisory":false}],"source":"# ==============================================================================\n# --- Conversions between Eulerian and Lagrangian representations ---\n# ==============================================================================\n\nfunction _check_res(res::Tuple, D::Int)\n    length(res) == D || throw(ArgumentError(\"expected a spacetime resolution with $D entries, got $res\"))\n    all(r -> r isa Integer && r >= 1, res) || throw(ArgumentError(\"resolutions must be positive integers, got $res\"))\n    return ntuple(d -> Int(res[d]), D)\nend\n\n_linspace(a::T, b::T, n::Int) where {T} = n == 1 ? T[a] : collect(range(a, b, length = n))\n\nfunction _copy_domain(domain::DomainInfo{D, T}; spacing = domain.spacing) where {D, T}\n    return DomainInfo{D, T}(domain.dim_keys, domain.mins, domain.maxs, spacing, domain.time_dim, domain.stat_registry)\nend\n\nfunction _nearest_index(t::AbstractVector, tv)\n    i = searchsortedfirst(t, tv)\n    i \u003c= 1 && return 1\n    i > length(t) && return length(t)\n    return (tv - t[i - 1]) \u003c= (t[i] - tv) ? i - 1 : i\nend\n\n# ------------------------------------------------------------------------------\n# Scatter algorithm (Lagrangian -> Eulerian)\n# ------------------------------------------------------------------------------\n\n\"\"\"\n    interpolate_to_grid!(::Val{:scatter}, u_out, w_out, field_outs, ldata, field_vals, steps, s_mins, s_maxs, s_dx, grid_shape)\n\nInternal, multithreaded inverse-distance scatter of the particles (and particle field statistics)\nof the native time steps `steps` onto a structured grid. Output slice `k` receives step `steps[k]`.\nCells that receive no particle within the smoothing radius are set to `NaN`.\n\"\"\"\nfunction interpolate_to_grid!(::Val{:scatter}, u_out::AbstractArray, w_out::AbstractArray, field_outs::Tuple,\n                              ldata::LSimData{D, DS, M, T}, field_vals::Tuple, steps::AbstractVector{Int},\n                              s_mins::SVector{DS, T}, s_maxs::SVector{DS, T}, s_dx::SVector{DS, T},\n                              grid_shape::NTuple{DS, Int}) where {D, DS, M, T}\n    nan_vec = SVector{M, T}(ntuple(_ -> T(NaN), Val(M)))\n    s_inv_dx = one(T) ./ s_dx\n\n    # Smoothing radius: 1.5x the larger of the grid spacing and the mean particle spacing.\n    np0 = max(1, length(ldata.x[first(steps)]))\n    pts_per_dim = max(1.0, np0^(1 / DS) - 1.0)\n    particle_spacing = (s_maxs .- s_mins) ./ T(pts_per_dim)\n    effective = max.(s_dx, particle_spacing)\n    radius2 = (norm(effective) * T(1.5))^2\n    rad_idx = sqrt(radius2) .* s_inv_dx\n\n    Threads.@threads for k in eachindex(steps)\n        n = steps[k]\n        x_step = ldata.x[n]\n        u_step = ldata.u[n]\n        @inbounds for p in eachindex(x_step)\n            pos = x_step[p]\n            all(isfinite, pos) || continue\n            idx_float = (pos .- s_mins) .* s_inv_dx .+ one(T)\n            # Clamp in floating point first, so particles far outside the grid cannot overflow `Int`.\n            lo = ntuple(d -> floor(Int, clamp(idx_float[d] - rad_idx[d], one(T), T(grid_shape[d] + 1))), Val(DS))\n            hi = ntuple(d -> ceil(Int, clamp(idx_float[d] + rad_idx[d], zero(T), T(grid_shape[d]))), Val(DS))\n            for cell in CartesianIndices(ntuple(d -> lo[d]:hi[d], Val(DS)))\n                cell_pos = s_mins .+ s_dx .* (SVector{DS, T}(Tuple(cell)) .- one(T))\n                dist2 = sum(abs2, cell_pos .- pos)\n                dist2 \u003c= radius2 || continue\n                w = one(T) / max(dist2, T(1e-12))\n                I = D > DS ? CartesianIndex(Tuple(cell)..., k) : cell\n                w_out[I] += w\n                u_out[I] += u_step[p] * w\n                for i in eachindex(field_outs)\n                    field_outs[i][I] += field_vals[i][n][p] * w\n                end\n            end\n        end\n        # Normalise this time slice (empty cells become NaN).\n        @inbounds for cell in CartesianIndices(grid_shape)\n            I = D > DS ? CartesianIndex(Tuple(cell)..., k) : cell\n            wsum = w_out[I]\n            if wsum > 0\n                u_out[I] /= wsum\n                for i in eachindex(field_outs)\n                    field_outs[i][I] /= wsum\n                end\n            else\n                u_out[I] = nan_vec\n                for i in eachindex(field_outs)\n                    field_outs[i][I] = nan_vec\n                end\n            end\n        end\n    end\n    return u_out\nend\n\ninterpolate_to_grid!(::Val{S}, args...) where {S} = throw(ArgumentError(\"unknown spatial interpolation algorithm :$S\"))\n\n\"\"\"\n    convert_to_eulerian(ldata::LSimData, res::Tuple; spatial_interp = :scatter)\n\nScatters Lagrangian particles onto a grid with the spacetime resolution `res` (spatial entries,\nthen the number of time slices). Particle field statistics are scattered as well, time series are\nresampled to the output times and other statistics are copied. Output times are evenly spaced\nbetween the first and last recording time; each takes the nearest recorded particle snapshot (the\nnative times are kept when the number of slices matches).\n\"\"\"\nfunction convert_to_eulerian(ldata::LSimData{D, DS, M, T}, res::Tuple; spatial_interp::Symbol = :scatter) where {D, DS, M, T}\n    res_ = _check_res(res, D)\n    domain = ldata.domain\n    s_res = ntuple(d -> res_[d], Val(DS))\n    s_mins = SVector{DS, T}(ntuple(d -> domain.mins[d], Val(DS)))\n    s_maxs = SVector{DS, T}(ntuple(d -> domain.maxs[d], Val(DS)))\n    for d in 1:DS\n        if s_res[d] > 1 && !(s_maxs[d] > s_mins[d])\n            throw(ArgumentError(\"the particles have no extent along :$(domain.dim_keys[d]); use a resolution of 1 for that dimension\"))\n        end\n    end\n    s_dx = SVector{DS, T}(ntuple(d -> s_res[d] > 1 ? (s_maxs[d] - s_mins[d]) / T(s_res[d] - 1) : one(T), Val(DS)))\n    grid_axes = ntuple(d -> _linspace(s_mins[d], s_maxs[d], s_res[d]), Val(DS))\n\n    if D > DS\n        nt = res_[D]\n        if nt == length(ldata.t)\n            steps, t_new = collect(1:nt), copy(ldata.t)\n        else\n            t_new = _linspace(first(ldata.t), last(ldata.t), nt)\n            steps = [_nearest_index(ldata.t, tv) for tv in t_new]\n        end\n    else\n        steps, t_new = [1], T[]\n    end\n    e_shape = D > DS ? (s_res..., length(steps)) : s_res\n\n    zero_vec = zero(SVector{M, T})\n    u_out = fill(zero_vec, e_shape)\n    w_out = zeros(T, e_shape)\n\n    e_stats = StatDict{M, T}()\n    field_keys = Symbol[]\n    field_outs = Array{SVector{M, T}, D}[]\n    field_vals = Vector{Vector{SVector{M, T}}}[]\n    for (key, value) in _raw_stats(ldata)\n        key === :Solution && continue\n        kept = get_kept_dims(key, domain)\n        if length(kept) == D && value isa Vector{Vector{SVector{M, T}}} && _is_particle_field(value, ldata)\n            push!(field_keys, key)\n            push!(field_outs, fill(zero_vec, e_shape))\n            push!(field_vals, value)\n        elseif D > DS && kept == [domain.time_dim] && value isa AbstractVector && length(value) == length(ldata.t)\n            e_stats[key] = value[steps]\n        else\n            e_stats[key] = deepcopy(value)\n        end\n    end\n\n    interpolate_to_grid!(Val(spatial_interp), u_out, w_out, Tuple(field_outs), ldata, Tuple(field_vals), steps,\n                         s_mins, s_maxs, s_dx, s_res)\n    for (i, key) in enumerate(field_keys)\n        e_stats[key] = field_outs[i]\n    end\n\n    if D > DS\n        dt = length(t_new) > 1 ? (last(t_new) - first(t_new)) / T(length(t_new) - 1) : domain.spacing[D]\n        e_axes = (grid_axes..., t_new)\n        e_spacing = SVector{D, T}((s_dx..., dt))\n    else\n        e_axes = grid_axes\n        e_spacing = SVector{D, T}(Tuple(s_dx))\n    end\n    return ESimData{D, DS, M, T}(ldata.params, _copy_domain(domain; spacing = e_spacing), e_axes, u_out, e_stats,\n                                 _derived_metadata(ldata.metadata, :conversion))\nend\n\n# ------------------------------------------------------------------------------\n# Eulerian resampling\n# ------------------------------------------------------------------------------\n\n_interp_kind(domain::DomainInfo, d::Int) = domain.dim_keys[d] === domain.time_dim ? Gridded(Constant()) : Gridded(Linear())\n\nfunction _fill_resampled!(out::AbstractArray{E, L}, itp, new_axes::Tuple) where {E, L}\n    cart = CartesianIndices(out)\n    Threads.@threads for i in eachindex(out)\n        I = cart[i]\n        out[i] = itp(ntuple(k -> new_axes[k][I[k]], Val(L))...)\n    end\n    return out\nend\n\n# Interpolates `values` (whose dimensions are the domain dimensions `dims`) from `old_axes` to `new_axes`:\n# linear in space, nearest-neighbour (constant) in time, flat extrapolation.\nfunction _resample_array(values::AbstractArray, old_axes::Tuple, new_axes::Tuple, domain::DomainInfo, dims::Tuple)\n    vals, axs = values, old_axes\n    for i in 1:length(axs)\n        if length(axs[i]) == 1  # Gridded interpolation needs two knots: duplicate singleton axes\n            vals = cat(vals, vals; dims = i)\n            axs = Base.setindex(axs, [axs[i][1], axs[i][1] + one(eltype(axs[i]))], i)\n        end\n    end\n    kinds = ntuple(i -> _interp_kind(domain, dims[i]), length(dims))\n    itp = extrapolate(interpolate(axs, vals, kinds), Flat())\n    out = similar(values, map(length, new_axes))\n    return _fill_resampled!(out, itp, new_axes)\nend\n\nfunction _resample_stat(key::Symbol, value, data::ESimData, new_axes::Tuple)\n    (value isa AbstractArray && !(value isa SVector)) || return deepcopy(value)\n    kept = get_kept_indices(key, data.domain)\n    (isempty(kept) || ndims(value) != length(kept)) && return deepcopy(value)\n    old_axes = ntuple(i -> data.axes[kept[i]], length(kept))\n    target = ntuple(i -> new_axes[kept[i]], length(kept))\n    if size(value) != map(length, old_axes)\n        @warn \"Statistic :$key does not match the axes it keeps; copying it unchanged.\"\n        return deepcopy(value)\n    end\n    all(i -> old_axes[i] == target[i], eachindex(old_axes)) && return deepcopy(value)\n    try\n        return _resample_array(value, old_axes, target, data.domain, Tuple(kept))\n    catch e\n        @warn \"Could not resample statistic :$key; copying it unchanged.\" exception = e\n        return deepcopy(value)\n    end\nend\n\n\"\"\"\n    resample_eulerian(data::ESimData, res::Tuple)\n\nResamples the solution and all statistics that keep spatial/temporal dimensions to the spacetime\nresolution `res`. Space is interpolated linearly, time with nearest-neighbour (constant)\ninterpolation to avoid cross-fading between snapshots. Resampled axes are uniform and span the old\naxes' node range; axes whose resolution does not change are kept as they are.\nReturns `data` itself if it already has the requested resolution.\n\"\"\"\nfunction resample_eulerian(data::ESimData{D, DS, M, T}, res::Tuple) where {D, DS, M, T}\n    res_ = _check_res(res, D)\n    size(data.u) == res_ && return data\n    @info \"Resampling Eulerian data from $(size(data.u)) to $res_ (linear in space, nearest in time)...\"\n\n    # Axes whose resolution does not change are kept as they are (e.g. adaptive time steps).\n    new_axes = ntuple(d -> res_[d] == length(data.axes[d]) ? copy(data.axes[d]) :\n                           _linspace(first(data.axes[d]), last(data.axes[d]), res_[d]), Val(D))\n    new_u = _resample_array(data.u, data.axes, new_axes, data.domain, ntuple(identity, Val(D)))\n    new_stats = StatDict{M, T}()\n    for (key, value) in _raw_stats(data)\n        key === :Solution && continue\n        new_stats[key] = _resample_stat(key, value, data, new_axes)\n    end\n    new_spacing = SVector{D, T}(ntuple(d -> res_[d] > 1 ?\n        (last(new_axes[d]) - first(new_axes[d])) / T(res_[d] - 1) : one(T), Val(D)))\n    return ESimData{D, DS, M, T}(data.params, _copy_domain(data.domain; spacing = new_spacing), new_axes, new_u, new_stats,\n                                 _derived_metadata(data.metadata, :conversion))\nend\n\n# ------------------------------------------------------------------------------\n# Eulerian -> Lagrangian\n# ------------------------------------------------------------------------------\n\n\"\"\"\n    convert_to_lagrangian(data::ESimData)\n\nTurns grid nodes into stationary particles (all time steps share one position vector). Full\nfields become per-particle statistics, purely spatial fields are repeated for every time step and\nall other statistics are copied.\n\"\"\"\nfunction convert_to_lagrangian(data::ESimData{D, DS, M, T}) where {D, DS, M, T}\n    timed = has_time(data)\n    nt = timed ? size(data.u, D) : 1\n    t_vec = timed ? copy(data.axes[D]) : T[0]\n    s_shape = ntuple(d -> length(data.axes[d]), Val(DS))\n    points = vec([SVector{DS, T}(ntuple(d -> data.axes[d][I[d]], Val(DS))) for I in CartesianIndices(s_shape)])\n    slice(a, n) = timed ? vec(collect(selectdim(a, D, n))) : vec(collect(a))\n\n    new_x = fill(points, nt)\n    new_u = Vector{SVector{M, T}}[slice(data.u, n) for n in 1:nt]\n\n    space_keys = Set(data.domain.dim_keys[1:DS])\n    l_domain = _copy_domain(data.domain)\n    new_stats = StatDict{M, T}()\n    for (key, value) in _raw_stats(data)\n        key === :Solution && continue\n        kept = get_kept_dims(key, data.domain)\n        if value isa AbstractArray{SVector{M, T}} && length(kept) == D && size(value) == size(data.u)\n            new_stats[key] = Vector{SVector{M, T}}[slice(value, n) for n in 1:nt]\n        elseif timed && value isa AbstractArray{SVector{M, T}} && Set(kept) == space_keys && size(value) == s_shape\n            # A purely spatial field becomes a per-particle field at every time step.\n            new_stats[key] = fill(vec(collect(value)), nt)\n            l_domain.stat_registry[key] = :all\n        else\n            new_stats[key] = deepcopy(value)\n        end\n    end\n    return LSimData{D, DS, M, T}(data.params, l_domain, t_vec, new_x, new_u, new_stats, _derived_metadata(data.metadata, :conversion))\nend\n","changed":[],"added":0,"removed":0},{"name":"DataManagement.jl","path":"src/DataManagement.jl","type":"file","files":1,"lines":385,"levels":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"errors":[],"counts":{"AI-Generation":{"files":{"G2":0.01818181818181818,"G3":0.9818181818181818},"lines":{"G2":7,"G3":378}},"Human-Review":{"files":{"H1":1.0},"lines":{"H1":385}},"AI-Review":{"files":{"A1":1.0},"lines":{"A1":385}}},"parts":[{"lines":248,"runs":[[1,134],[136,148],[151,201],[203,245],[251,251],[253,258]],"declaration":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"levels":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":130,"runs":[[135,135],[202,202],[252,252],[259,385]],"declaration":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] 5dd99bd"},"levels":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":7,"runs":[[149,150],[246,250]],"declaration":{"AI-Generation":"G2","Human-Review":"H1","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] 7018d35"},"levels":{"AI-Generation":"G2","Human-Review":"H1","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"# ==============================================================================\n# --- Data health checks, deletion & rehashing ---\n# ==============================================================================\n\nfunction _aggregate_component(iterator)\n    min_v, max_v = Inf, -Inf\n    sum_v = 0.0\n    valid_count, nan_count = 0, 0\n    for val in iterator\n        if isnan(val)\n            nan_count += 1\n        else\n            min_v = min(min_v, val)\n            max_v = max(max_v, val)\n            sum_v += val\n            valid_count += 1\n        end\n    end\n    valid_count == 0 && return (NaN, NaN, NaN, Float64(nan_count))\n    return (Float64(min_v), Float64(max_v), sum_v / valid_count, Float64(nan_count))\nend\n\n_component_summary(values, M::Int) =\n    reduce(vcat, [collect(_aggregate_component(v[c] for v in values)) for c in 1:M])\n\nfunction _health_frame(times::AbstractVector, rows::Vector{Vector{Float64}}, M::Int)\n    columns = Pair{Symbol, Vector{Float64}}[:Time => Float64.(collect(times))]\n    names = [Symbol(\"C$(c)_$(s)\") for c in 1:M for s in (\"Min\", \"Max\", \"Mean\", \"NaNs\")]\n    for (j, name) in enumerate(names)\n        push!(columns, name => Float64[row[j] for row in rows])\n    end\n    return DataFrame(columns...)\nend\n\n\"\"\"\n    check_data(data::ESimData; per_step = false)\n    check_data(data::LSimData)\n\nSummarises the numerical health of a dataset as a `DataFrame` with the columns `Time`, then\n`C\u003cc>_Min`, `C\u003cc>_Max`, `C\u003cc>_Mean`, `C\u003cc>_NaNs` for every component `c`. Eulerian data is\naggregated into a single row (`Time = NaN`) unless `per_step = true`; Lagrangian data gets one row\nper time step.\n\"\"\"\nfunction check_data(data::ESimData{D, DS, M, T}; per_step::Bool = false) where {D, DS, M, T}\n    if per_step && has_time(data)\n        rows = [_component_summary(selectdim(data.u, D, n), M) for n in 1:size(data.u, D)]\n        return _health_frame(data.axes[D], rows, M)\n    end\n    return _health_frame([NaN], [_component_summary(data.u, M)], M)\nend\n\nfunction check_data(data::LSimData{D, DS, M, T}) where {D, DS, M, T}\n    rows = Vector{Float64}[_component_summary(step, M) for step in data.u]\n    return _health_frame(data.t, rows, M)\nend\n\n# Parameters stored in a data file (the lightweight \"params\" entry), or `nothing` if they cannot be read.\nfunction _file_params(path::AbstractString)\n    try\n        return jldopen(f -> haskey(f, \"params\") ? f[\"params\"] : nothing, path, \"r\")\n    catch e\n        @warn \"Could not read the parameters of $(basename(path))\" exception = e\n        return nothing\n    end\nend\n\n# `path => params` of every data file (newest first) whose stored parameters contain all pairs of\n# `match_params` (keys may be strings or symbols; values are normalised like stored parameters).\nfunction _files_with_params(match_params::AbstractDict)\n    wanted = Dict(Symbol(k) => _normalize_param(v) for (k, v) in match_params)\n    matched = Pair{String, Any}[]\n    for path in _sort_newest!(_data_files())\n        file_params = _file_params(path)\n        file_params === nothing && continue\n        all(((k, v),) -> haskey(file_params, k) && isequal(file_params[k], v), wanted) || continue\n        push!(matched, path => file_params)\n    end\n    return matched\nend\n\n_param_summary(params, skip) = join((\"$k = $(val2str(v))\" for (k, v) in sort(collect(params), by = p -> string(first(p)))\n                                     if !(Symbol(k) in skip)), \", \")\n\n\"\"\"\n    find_sim_data(match_params = Dict(); io = stdout, verbose = true)\n\nLists the data files whose stored parameters contain all the given key-value pairs, i.e. any subset of a\nrun's parameters (keys may be strings or symbols; an empty filter lists every file). Only the lightweight\n`params` metadata is read. Prints one line per file (newest first) with the parameters that were not part\nof the filter, and returns the file paths.\n\n```julia-repl\njulia> find_sim_data(Dict(\"N\" => 100));\n2 data files with N = 100:\n  2026-10-21_17-45-00_123_3f9a….jld2   cfl = 0.5, scheme = upwind, sim_func_name = :advection_solver_1d\n  2026-10-21_17-44-58_907_b02c….jld2   cfl = 0.5, scheme = lax_friedrichs, sim_func_name = :advection_solver_1d\n```\n\"\"\"\nfunction find_sim_data(match_params::AbstractDict = Dict{Symbol, Any}(); io::IO = stdout, verbose::Bool = true)\n    matched = _files_with_params(match_params)\n    paths = String[first(m) for m in matched]\n    verbose || return paths\n    n = length(paths)\n    filter_str = isempty(match_params) ? \"\" : \" with \" * _param_summary(match_params, Set{Symbol}())\n    println(io, n, \" data file\", n == 1 ? \"\" : \"s\", filter_str, n == 0 ? \".\" : \":\")\n    skip = Set(Symbol(k) for k in keys(match_params))\n    for (path, params) in matched\n        extra = _param_summary(params, skip)\n        println(io, \"  \", basename(path), isempty(extra) ? \"\" : \"   \" * extra)\n    end\n    return paths\nend\n\n\"\"\"\n    delete_sim_data(match_params::AbstractDict; dry_run = false)\n\nDeletes every data file whose stored parameters contain all the given key-value pairs (the files\n[`find_sim_data`](@ref) lists). Returns the paths of the (would-be) deleted files.\nAn empty filter is rejected because it would match every file.\n\n```julia-repl\njulia> delete_sim_data(Dict(:N => 100, :scheme => \"upwind\"))\n```\n\"\"\"\nfunction delete_sim_data(match_params::AbstractDict; dry_run::Bool = false)\n    isempty(match_params) && throw(ArgumentError(\"refusing to delete with an empty filter (it would match every file)\"))\n    matched = String[]\n    for (path, _) in _files_with_params(match_params)\n        push!(matched, path)\n        if dry_run\n            @info \"Would delete $(basename(path))\"\n        else\n            @warn \"Deleting file matching criteria: $(basename(path))\"\n            rm(path)\n            _invalidate_index!()\n        end\n    end\n    return matched\nend\n\n\"\"\"\n    rehash_sim_data(target_path; delete_old = true, filter_pairs = nothing, remove_keys = Symbol[], prompt_keys = Symbol[])\n\nRe-normalises the parameters of a `.jld2` file (or of every `.jld2` file below a directory),\nrecomputes the hash and stores the data under its new name. Use it after renaming or removing\nparameters, or after changes to the hashing.\n\n# Keywords\n- `delete_old`: remove the old file once the new one has been written. For a symlink only the link is removed\n  (with a warning naming its target, which may be shared).\n- `filter_pairs`: only process files whose parameters contain these exact pairs.\n- `remove_keys`: parameter keys to drop before rehashing.\n- `prompt_keys`: interactively ask (in the REPL) for new values of these keys for every file.\n\nReturns a vector of `old_path => new_path` pairs.\n\"\"\"\nfunction rehash_sim_data(target_path::AbstractString; delete_old::Bool = true, filter_pairs = nothing,\n                         remove_keys::AbstractVector = Symbol[], prompt_keys::AbstractVector = Symbol[])\n    paths = if isfile(target_path) && endswith(target_path, \".jld2\")\n        [String(target_path)]\n    elseif isdir(target_path)\n        [joinpath(root, f) for (root, _, files) in walkdir(target_path) for f in files if endswith(f, \".jld2\")]\n    else\n        @warn \"Path is neither a .jld2 file nor a directory: $target_path\"\n        String[]\n    end\n    renamed = Pair{String, String}[]\n    for path in paths\n        result = _rehash_single_file(path, delete_old, filter_pairs, Symbol.(remove_keys), Symbol.(prompt_keys))\n        result === nothing || push!(renamed, result)\n    end\n    return renamed\nend\n\nfunction _prompt_param_values!(params::ParamDict, prompt_keys::Vector{Symbol}, name::AbstractString)\n    println(\"\\n--- Current parameters of $name ---\")\n    for (k, v) in sort(collect(params), by = x -> string(x[1]))\n        println(\"  $k => $(val2str(v))\")\n    end\n    println(\"-\" ^ 40)\n    for key in prompt_keys\n        print(\"Enter value for '$key' (Julia expression, leave blank to skip): \")\n        input = strip(readline())\n        if isempty(input)\n            @info \"  Skipped '$key'.\"\n            continue\n        end\n        try\n            # Interactive input is trusted: evaluate it in the user's target module.\n            params[key] = Core.eval(get_target_module(), Meta.parse(input))\n            @info \"  Set $key = $(params[key])\"\n        catch e\n            @warn \"  Failed to evaluate '$input'; '$key' is unchanged.\" exception = e\n        end\n    end\n    return params\nend\n\nfunction _rehash_single_file(path::String, delete_old::Bool, filter_pairs, remove_keys::Vector{Symbol},\n                             prompt_keys::Vector{Symbol})\n    raw = try\n        _open_data(f -> haskey(f, \"raw\") ? (r = f[\"raw\"]; r isa AbstractSimData && (r.metadata = _file_metadata(f)); r) : nothing, path)\n    catch e\n        @warn \"Failed to open $(basename(path))\" exception = e\n        nothing\n    end\n    raw isa Union{ESimData, LSimData} || return nothing\n    params = raw.params\n\n    if filter_pairs !== nothing\n        all(((k, v),) -> haskey(params, Symbol(k)) && isequal(params[Symbol(k)], _normalize_param(v)), filter_pairs) ||\n            return nothing\n    end\n    bname = basename(path)\n    @info \"Processing matched file: $bname\"\n\n    for key in remove_keys\n        haskey(params, key) || continue\n        delete!(params, key)\n        @info \"  Removed key :$key\"\n    end\n    isempty(prompt_keys) || _prompt_param_values!(params, prompt_keys, bname)\n\n    normalized = _normalize_params(params)\n    empty!(params)\n    merge!(params, normalized)\n\n    m = match(r\"^(.+)_[0-9a-fA-F]{64}\\.jld2$\", bname)\n    stamp = m === nothing ? _timestamp() : m.captures[1]\n    new_path = joinpath(dirname(path), \"$(stamp)_$(calculate_hash(params)).jld2\")\n    same_file = abspath(new_path) == abspath(path)\n    if !same_file && isfile(new_path)\n        @warn \"$(basename(new_path)) already exists and is replaced by the rehashed $bname.\"\n    end\n\n    try\n        _write_sim_file(new_path, raw, Dict{String, Any}(), path)\n    catch e\n        @error \"Failed to write $(basename(new_path))\" exception = e\n        return nothing\n    end\n\n    if same_file\n        @info \"Rehashed in place (hash unchanged): $bname\"\n    elseif delete_old\n        # A symlinked file: the rehashed data is a regular file now and only the link is removed. Its target may be\n        # shared (e.g. a fetched result linked into several save paths), so it is never deleted here.\n        islink(path) && @warn \"$bname is a symlink: the rehashed data is written to $(basename(new_path)) and the link \" *\n            \"is removed; its target $(realpath(path)) is not deleted by this rehash of the link. Delete it yourself if \" *\n            \"nothing else uses it.\"\n        rm(path; force = true)\n        _invalidate_index!()\n        @info \"Rehashed and renamed: $bname -> $(basename(new_path))\"\n    else\n        @info \"Rehashed copy (old file kept): $bname -> $(basename(new_path))\"\n    end\n    return path => new_path\nend\n\n\"\"\"\n    upgrade_sim_data(target = joinpath(get_save_path(), \"data\"); dry_run = false) -> Dict{Symbol, Vector{String}}\n\nBrings data files written by earlier PDEStudioCore versions to the current file format (a `.jld2` file or every\n`.jld2` file in a directory, not recursively): the file is written again (atomically) in the current layout, with\nthe same data, its statistics and the entries the current version keeps next to it (format version, kind, shape,\naxes, metadata; entries stored next to the data by 0.4 become metadata; cached conversions are dropped). Files of\n0.4 work as they are (their datasets are read as the current types); `upgrade_sim_data` adds what they lack (e.g.\nthe axes [`get_sim_data_info`](@ref) reads without loading the data). The pipeline upgrades files without any such\nentries (data only) by itself when it finds them.\nReturns the paths by outcome: `:upgraded`, `:current`, `:unreadable` (their data doesn't load as a dataset of this\nversion: the pipeline recomputes them). With `dry_run = true` nothing is written, and the files that would be\nupgraded are listed under `:upgraded`.\n\"\"\"\nfunction upgrade_sim_data(target::AbstractString = _data_dir(); dry_run::Bool = false)\n    paths = isdir(target) ? [joinpath(target, f) for f in readdir(target) if endswith(f, \".jld2\")] :\n            isfile(target) && endswith(target, \".jld2\") ? [String(target)] :\n            throw(ArgumentError(\"$target is neither a .jld2 file nor a directory\"))\n    out = Dict{Symbol, Vector{String}}(:upgraded => String[], :current => String[], :unreadable => String[])\n    for path in paths\n        outcome = try\n            if dry_run\n                v = jldopen(_format_version, path, \"r\")\n                v >= _FORMAT_VERSION ? :current : _raw_loads(path) ? :upgraded : :unreadable\n            else\n                _upgrade_file!(path)\n            end\n        catch e\n            @warn \"Could not upgrade $(basename(path))\" exception = e\n            :unreadable\n        end\n        push!(out[outcome], path)\n    end\n    return out\nend\n\n\"\"\"\n    tidy_sim_data(; dry_run = false, min_tmp_age = 3600) -> (duplicates, temp_files)\n\nRemoves files in the data directory that nothing uses:\n- older files of a run stored more than once (e.g. by parallel jobs computing the same parameters): lookups always\n  use the newest file of a hash, the older ones only take space;\n- temporary files of writes that never finished (a process killed while writing), older than `min_tmp_age`\n  seconds (a running write keeps its temporary file younger).\nReturns the paths it removed (with `dry_run = true`: would remove).\n\"\"\"\nfunction tidy_sim_data(; dry_run::Bool = false, min_tmp_age::Real = 3600)\n    dir = _data_dir()\n    duplicates, temp_files = String[], String[]\n    isdir(dir) || return (duplicates = duplicates, temp_files = temp_files)\n    for (_, files) in _data_index(fresh = true).by_hash\n        length(files) > 1 || continue\n        append!(duplicates, _sort_newest!(copy(files))[2:end])\n    end\n    now_s = time()\n    for f in readdir(dir)\n        occursin(r\"\\.jld2\\.\\d+_[0-9a-f]+_\\d+\\.tmp$\", f) || continue\n        path = joinpath(dir, f)\n        now_s - mtime(path) >= min_tmp_age && push!(temp_files, path)\n    end\n    if !dry_run\n        for path in (duplicates..., temp_files...)\n            rm(path; force = true)\n        end\n        _invalidate_index!()\n        isempty(duplicates) && isempty(temp_files) ||\n            @info \"Removed $(length(duplicates)) duplicate data file(s) and $(length(temp_files)) temporary file(s).\"\n    end\n    return (duplicates = duplicates, temp_files = temp_files)\nend\n\n\"\"\"\n    sim_data_table(match_params = Dict()) -> DataFrame\n\nOne row per stored run whose parameters contain all pairs of `match_params` (as [`find_sim_data`](@ref)), newest\nfirst: `file`, `created` (from the file name), `size_mb`, `kind` (`:eulerian` / `:lagrangian`), `shape`,\n`format_version`, `stats` (the available statistics), `postprocessed` (the names of the post-processors that ran, or `missing`),\n`wall_time` (seconds the solver took, if recorded), `solver`, then one column per parameter (`missing` where a\nrun doesn't have it; a parameter named like one of the columns before gets the column `param_\u003cname>`, with more\n`param_` prefixes if that is a parameter, too). Only the\nlightweight entries of each file are read (for files of 0.4, the entries stored next to the data, their metadata). Files of format version 0 (without metadata) are not listed:\n[`upgrade_sim_data`](@ref) brings them up to date.\n\"\"\"\nfunction sim_data_table(match_params::AbstractDict = Dict{Symbol, Any}())\n    rows = Dict{Symbol, Any}[]\n    fixed = [:file, :created, :size_mb, :kind, :shape, :format_version, :stats, :postprocessed, :wall_time, :solver]\n    for (path, params) in _files_with_params(match_params)\n        row = Dict{Symbol, Any}(:file => basename(path), :size_mb => round(filesize(path) / 2^20, digits = 3))\n        stamp = match(r\"^(\\d{4}-\\d{2}-\\d{2}_\\d{2}-\\d{2}-\\d{2}_\\d{3})_\", basename(path))\n        row[:created] = stamp === nothing ? missing : DateTime(stamp.captures[1], dateformat\"yyyy-mm-dd_HH-MM-SS_sss\")\n        try\n            jldopen(path, \"r\") do f\n                row[:kind] = haskey(f, \"native\") ? f[\"native\"] : missing\n                row[:shape] = haskey(f, \"shape\") ? Tuple(f[\"shape\"]) : missing\n                row[:format_version] = _format_version(f)\n                row[:stats] = haskey(f, \"stat_keys\") ? sort!(collect(Symbol, f[\"stat_keys\"])) : missing\n                md = _file_metadata(f)\n                post = get(md, :postprocessed, nothing)\n                row[:postprocessed] = post isa AbstractDict && !isempty(post) ?\n                                      join(sort!(string.(collect(keys(post)))), \", \") : missing\n                prov = get(md, :provenance, nothing)\n                row[:wall_time] = prov isa AbstractDict ? get(prov, :wall_time, missing) : missing\n                row[:solver] = prov isa AbstractDict ? get(prov, :solver, missing) : missing\n            end\n        catch e   # (a file that can't be read leaves its columns `missing`, the table goes on)\n            e isa InterruptException && rethrow()\n            @warn \"Could not read the metadata of $(basename(path))\" exception = e\n        end\n        names = Set(Symbol(k) for k in keys(params))\n        for (k, v) in params\n            key = Symbol(k)\n            # (a parameter `solver`: column `param_solver`, or `param_param_solver` if there is a parameter `param_solver`)\n            if key in fixed\n                key = Symbol(\"param_\", key)\n                while key in names || key in fixed\n                    key = Symbol(\"param_\", key)\n                end\n            end\n            row[key] = v\n        end\n        push!(rows, row)\n    end\n    pkeys = sort!(collect(setdiff(union(Set{Symbol}(), (keys(r) for r in rows)...), fixed)), by = string)\n    cols = [fixed; pkeys]\n    return DataFrame([c => Any[get(r, c, missing) for r in rows] for c in cols])\nend\n","changed":[],"added":0,"removed":0},{"name":"Display.jl","path":"src/Display.jl","type":"file","files":1,"lines":94,"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"errors":[],"parts":[{"lines":94,"runs":[[1,94]],"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"# ==============================================================================\n# --- REPL display ---\n# ==============================================================================\n\n_fmt(x) = round(x, digits = 3)\n\nfunction _space_summary(domain::DomainInfo, DS::Int)\n    DS == 0 && return \"(none)\"\n    parts = [\"$(domain.dim_keys[d]): $(_fmt(domain.mins[d])) ➔ $(_fmt(domain.maxs[d]))\" for d in 1:DS]\n    return \"[\" * join(parts, \"] × [\") * \"]\"\nend\n\n_stat_names(data::AbstractSimData) = join(sort!([string(k) for k in keys(data.stats)]), \", \")\n\n\"\"\"\n    Base.show(io::IO, ::MIME\"text/plain\", data::LSimData)\n\nSummary of a Lagrangian dataset: time range, spatial bounding box, particle counts, parameters and statistics.\n\"\"\"\nfunction Base.show(io::IO, ::MIME\"text/plain\", data::LSimData{D, DS, M, T}) where {D, DS, M, T}\n    println(io, \"🟢 LSimData{$D, $DS, $M, $T} (Lagrangian Simulation Data)\")\n    println(io, \"==================================================\")\n    if D > DS && !isempty(data.t)\n        println(io, \"  Time (T)   : $(length(data.t)) steps [$(_fmt(first(data.t))) ➔ $(_fmt(last(data.t)))]\")\n    else\n        println(io, \"  Time (T)   : Static (1 step)\")\n    end\n    println(io, \"  Space      : \", _space_summary(data.domain, DS))\n    counts = length.(data.x)\n    lo, hi = isempty(counts) ? (0, 0) : extrema(counts)\n    println(io, \"  Particles  : \", lo == hi ? \"$lo\" : \"$lo to $hi (variable)\")\n    println(io, \"  Parameters : $(length(data.params)) keys\")\n    print(io, \"  Statistics : \", _stat_names(data))\nend\n\n\"\"\"\n    Base.show(io::IO, ::MIME\"text/plain\", data::ESimData)\n\nSummary of an Eulerian dataset: time range, spatial bounding box, grid size, parameters and statistics.\n\"\"\"\nfunction Base.show(io::IO, ::MIME\"text/plain\", data::ESimData{D, DS, M, T}) where {D, DS, M, T}\n    println(io, \"🟦 ESimData{$D, $DS, $M, $T} (Eulerian Grid Data)\")\n    println(io, \"==================================================\")\n    if D > DS\n        t = data.axes[D]\n        println(io, \"  Time (T)   : $(length(t)) steps [$(_fmt(first(t))) ➔ $(_fmt(last(t)))]\")\n    else\n        println(io, \"  Time (T)   : Static (1 step)\")\n    end\n    println(io, \"  Space      : \", _space_summary(data.domain, DS))\n    grid = ntuple(d -> length(data.axes[d]), DS)\n    println(io, \"  Grid Size  : $(join(grid, \" × \")) ($(prod(grid)) spatial points)\")\n    println(io, \"  Parameters : $(length(data.params)) keys\")\n    print(io, \"  Statistics : \", _stat_names(data))\nend\n\n# Compact one-line forms (used inside containers, e.g. a Vector of datasets).\nfunction Base.show(io::IO, data::ESimData{D, DS, M, T}) where {D, DS, M, T}\n    print(io, \"ESimData{$D, $DS, $M, $T}(\", join(size(data.u), \"×\"), \" on \", join(data.domain.dim_keys, \"×\"),\n          \", \", length(data.stats), \" stats)\")\nend\n\nfunction Base.show(io::IO, data::LSimData{D, DS, M, T}) where {D, DS, M, T}\n    print(io, \"LSimData{$D, $DS, $M, $T}(\", length(data.t), \" steps, \", maximum(length, data.x; init = 0),\n          \" particles, \", length(data.stats), \" stats)\")\nend\n\n_value_summary(x::SVector) = string(x)\n_value_summary(x::AbstractArray) = summary(x)\n_value_summary(x) = string(typeof(x))\n\nfunction Base.show(io::IO, ::MIME\"text/plain\", view::StatsView)\n    n = length(view)\n    print(io, \"StatsView with $n entr\", n == 1 ? \"y\" : \"ies\", \":\")\n    for k in sort!(collect(keys(view)), by = k -> (k !== :Solution, string(k)))\n        dims = get_kept_dims(k, view.data.domain)\n        print(io, \"\\n  :\", k, \" => \", _value_summary(view[k]), \"  [\", join(dims, \", \"), \"]\")\n    end\nend\n\nBase.show(io::IO, view::StatsView) = print(io, \"StatsView(\", join((\":\" * string(k) for k in keys(view)), \", \"), \")\")\n\nfunction Base.show(io::IO, ::MIME\"text/plain\", c::SimulationConfig)\n    solver = get(c.shared, :sim_func_name, nothing)\n    println(io, \"SimulationConfig\")\n    println(io, \"  shared      : \", length(c.shared), \" parameter(s)\", solver === nothing ? \"\" : \" (solver: $solver)\")\n    println(io, \"  methods     : \", isempty(c.methods) ? \"(none)\" : join(sort!(collect(keys(c.methods))), \", \"))\n    println(io, \"  defaults    : \", isempty(c.defaults) ? \"(none)\" : join(c.defaults, \", \"))\n    println(io, \"  varied      : \", isempty(c.varied) ? \"(none)\" :\n            join([\"$k ($(length(v)) values)\" for (k, v) in sort!(collect(c.varied), by = first)], \", \"))\n    println(io, \"  reference   : \", something(c.reference, \"(none)\"))\n    println(io, \"  postprocess : \", something(c.postprocess, \"(none)\"))\n    print(io, \"  sources     : \", isempty(c.sources) ? \"(none)\" : join(c.sources, \", \"))\nend\n","changed":[],"added":0,"removed":0},{"name":"IOUtils.jl","path":"src/IOUtils.jl","type":"file","files":1,"lines":845,"levels":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] 5dd99bd"},"errors":[],"counts":{"AI-Generation":{"files":{"G2":0.1076923076923077,"G3":0.8923076923076922},"lines":{"G2":91,"G3":754}},"Human-Review":{"files":{"H0":0.06035502958579882,"H1":0.9396449704142011},"li
