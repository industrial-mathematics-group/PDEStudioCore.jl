,649]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A0","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":[],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"commit d60e6c7 (restricted name lookup, derived datasets, hash …), pull request checkboxes"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A0"},"errors":[],"advisory":false}],"source":"# ==============================================================================\n# --- Task generation & the batch pipeline ---\n# ==============================================================================\n\nconst _REFERENCE_KEYWORDS = (\"analytic\", \"reference\", \"exact\", \"baseline\", \"true\")\n\n\"\"\"\n    is_reference_method(m_name::Symbol)\n\n`true` if a word of the method name (split at `_`, `-` and non-alphanumerics) starts with\n\"analytic\", \"reference\", \"exact\", \"baseline\" or \"true\" (e.g. `:analytic`, `:exact_solution`, but also\n`:godunov_exact_riemann`). Reference methods are skipped by [`run_all_simulations`](@ref) (with a\nwarning if such a method has its own `:sim_func_name`).\n\"\"\"\nfunction is_reference_method(m_name::Union{Symbol, AbstractString})\n    words = split(lowercase(String(m_name)), r\"[^a-z0-9]+\"; keepempty = false)\n    return any(w -> any(k -> startswith(w, k), _REFERENCE_KEYWORDS), words)\nend\n\n# Methods named like a reference but with a solver of their own (e.g. `:godunov_exact_riemann`) are most likely\n# real methods. They are skipped all the same (frontends rely on the naming rule); warn once per name.\nconst _WARNED_REFERENCE_NAMES = Set{Symbol}()\nfunction _warn_skipped_solvers(config)\n    for m in config.defaults\n        (is_reference_method(m) && haskey(get(config.methods, m, ParamDict()), :sim_func_name)) || continue\n        m in _WARNED_REFERENCE_NAMES && continue\n        push!(_WARNED_REFERENCE_NAMES, m)\n        @warn \"Method :$m has its own :sim_func_name, but its name marks it as a reference method \" *\n              \"(see `is_reference_method`), so it is not run. Rename it to run it.\"\n    end\n    return nothing\nend\n\n\"\"\"\n    get_ignore_keys(methods::AbstractDict, method_name::Symbol)\n\nThe shared keys that `method_name` excludes via its `:ignore` entry.\n\"\"\"\nfunction get_ignore_keys(method_collection::AbstractDict, method_name::Symbol)\n    raw_ignore = get(get(method_collection, method_name, ParamDict()), :ignore, Symbol[])\n    if raw_ignore isa AbstractVector || raw_ignore isa Tuple\n        return Symbol[Symbol(k) for k in raw_ignore]\n    elseif raw_ignore isa Union{AbstractString, Symbol}\n        return [Symbol(raw_ignore)]\n    end\n    return Symbol[]\nend\n\n\"\"\"\n    assemble_params(shared::AbstractDict, methods::AbstractDict, method_name::Symbol)\n\nShared parameters (minus the method's ignored keys) overridden by the method's own parameters.\nThe `:ignore` entry itself only controls the assembly and is not part of the result (or the hash).\n\"\"\"\nfunction assemble_params(shared_params::AbstractDict, method_collection::AbstractDict, method_name::Symbol)\n    ignore_keys = get_ignore_keys(method_collection, method_name)\n    params = ParamDict()\n    for (key, val) in shared_params\n        Symbol(key) in ignore_keys || (params[Symbol(key)] = val)\n    end\n    for (key, val) in get(method_collection, method_name, ParamDict())\n        Symbol(key) === :ignore && continue\n        params[Symbol(key)] = val\n    end\n    return params\nend\n\nconst _TUPLE_LETTERS = Dict('x' => 1, 'y' => 2, 'z' => 3)\n\n# Tuple entries addressed by the suffix of a varied key: one entry (`x`/`1`, `y`/`2`, `z`/`3`, `\u003cn>`), several\n# entries at once (`xy`, `yz`, `xyz`, …; a sorted `Vector{Int}`) or `:all` (every entry of the tuple).\n# Returns `nothing` if the text is not a tuple suffix.\nfunction _tuple_indices(s::AbstractString)\n    s == \"all\" && return :all\n    idx = tryparse(Int, s)\n    idx !== nothing && return idx >= 1 ? [idx] : nothing\n    (isempty(s) || !all(c -> haskey(_TUPLE_LETTERS, c), s)) && return nothing\n    return sort!(unique!([_TUPLE_LETTERS[c] for c in s]))\nend\n\n# Splits a varied key into (base key, tuple entries); the entries are `nothing` for ordinary keys,\n# a `Vector{Int}` or `:all` otherwise (see `_tuple_indices`).\nfunction _split_varied_key(k::Symbol)\n    m = match(r\"^(.+)__([a-zA-Z0-9]+)$\", String(k))\n    m === nothing && return (k, nothing)\n    idxs = _tuple_indices(m.captures[2])\n    return idxs === nothing ? (k, nothing) : (Symbol(m.captures[1]), idxs)\nend\n\n\"\"\"\n    generate_method_tasks(base_params, active_keys, active_values; ignore_keys = Symbol[])\n\nExpands one method's parameters over the Cartesian product of `active_values`. Keys of the form\n`:Ns__x`/`:Ns__1` (`__y`/`__2`, `__z`/`__3`, `__\u003cn>`) set one entry of the tuple parameter `:Ns`;\n`:Ns__xy` (`__xz`, `__yz`, `__xyz`) sets several entries and `:Ns__all` every entry of the tuple to\nthe same swept value (the result is a `Tuple`; entries past its end are added, gaps filled with `0.0`).\nA key that is itself a parameter of `base_params` (e.g. `:dt__1`) is an ordinary key. Varied keys that are\nabsent from `base_params` (or ignored) are not applied to this method. Throws an `ArgumentError` if a\nsuffix key addresses a parameter that is not a tuple or vector.\nReturns `(tasks, grid_indices)`.\n\"\"\"\nfunction generate_method_tasks(base_params::AbstractDict, active_keys::AbstractVector, active_values::AbstractVector;\n                               ignore_keys::AbstractVector = Symbol[])\n    length(active_keys) == length(active_values) || throw(ArgumentError(\"active_keys and active_values must have the same length\"))\n    base = _to_paramdict(base_params)\n    ignore = Symbol[Symbol(k) for k in ignore_keys]\n\n    varied_std = Tuple{Int, Symbol}[]       # (index into the value tuple, key)\n    varied_tup = Tuple{Int, Symbol, Union{Symbol, Vector{Int}}}[]  # (index into the value tuple, base key, tuple entries)\n    for (i, k) in enumerate(Symbol.(active_keys))\n        k in ignore && continue\n        base_key, idxs = haskey(base, k) ? (k, nothing) : _split_varied_key(k)\n        if idxs === nothing\n            push!(varied_std, (i, k))\n        elseif !(base_key in ignore)\n            push!(varied_tup, (i, base_key, idxs))\n        end\n    end\n\n    grid = isempty(active_values) ? [()] : collect(Iterators.product(active_values...))\n    tasks, grid_indices = ParamDict[], Tuple[]\n    for (linear_idx, p_vals) in enumerate(grid)\n        task = copy(base)\n        for (i, k) in varied_std\n            haskey(task, k) && (task[k] = p_vals[i])\n        end\n        if !isempty(varied_tup)\n            updates = Dict{Symbol, Vector{Any}}()\n            for (i, base_key, idxs) in varied_tup\n                haskey(task, base_key) || continue\n                value = task[base_key]\n                value isa Union{Tuple, AbstractVector} || throw(ArgumentError(\n                    \"the varied key :$(active_keys[i]) sets entries of :$base_key, but :$base_key = $(repr(value)) \" *\n                    \"is not a tuple or vector; vary :$base_key itself instead\"))\n                arr = get!(() -> collect(Any, value), updates, base_key)\n                for idx in (idxs === :all ? (1:length(arr)) : idxs)\n                    while length(arr) \u003c idx\n                        push!(arr, 0.0)\n                    end\n                    arr[idx] = p_vals[i]\n                end\n            end\n            for (base_key, arr) in updates\n                task[base_key] = all(x -> x isa Integer && !(x isa Bool), arr) ? Tuple(Int.(arr)) : Tuple(arr)\n            end\n        end\n        push!(tasks, task)\n        push!(grid_indices, isempty(active_values) ? () : Tuple(CartesianIndices(grid)[linear_idx]))\n    end\n    return tasks, grid_indices\nend\n\n\"\"\"\n    generate_tasks(config::SimulationConfig)\n\nAll parameter sets [`run_all_simulations`](@ref) would execute (reference methods skipped,\nduplicates removed). Handy to load the results of a sweep:\n`[load_sim_data(p) for p in generate_tasks(config)]`.\n\"\"\"\nfunction generate_tasks(config::SimulationConfig)\n    vkeys = sort!(collect(keys(config.varied)))\n    vvals = Vector[config.varied[k] for k in vkeys]\n    for (k, v) in zip(vkeys, vvals)\n        isempty(v) && @warn \"Varied parameter :$k has no values: the Cartesian product is empty, so no task is generated.\"\n    end\n    methods = isempty(config.methods) && isempty(config.defaults) ? Union{Nothing, Symbol}[nothing] :\n              Union{Nothing, Symbol}[m for m in config.defaults if !is_reference_method(m)]\n    _warn_skipped_solvers(config)\n\n    tasks = ParamDict[]\n    seen = Set{String}()\n    used = Set{Symbol}()\n    for method in methods\n        base = method === nothing ? copy(config.shared) : assemble_params(config.shared, config.methods, method)\n        ignore = method === nothing ? Symbol[] : get_ignore_keys(config.methods, method)\n        for k in vkeys\n            base_key, _ = haskey(base, k) ? (k, nothing) : _split_varied_key(k)\n            (haskey(base, base_key) && !(k in ignore) && !(base_key in ignore)) && push!(used, k)\n        end\n        method_tasks, _ = generate_method_tasks(base, vkeys, vvals; ignore_keys = ignore)\n        for task in method_tasks\n            h = _param_hash(task)\n            h in seen && continue\n            push!(seen, h)\n            push!(tasks, task)\n        end\n    end\n    for k in vkeys\n        k in used || @warn \"Varied parameter :$k does not appear in the parameters of any active method and is ignored.\"\n    end\n    return tasks\nend\n\nfunction _resolve_solver(params::AbstractDict)\n    haskey(params, :sim_func_name) || throw(ArgumentError(\n        \"the parameters contain no :sim_func_name (the name of the solver function)\"))\n    name = params[:sim_func_name]\n    name isa Function && throw(ArgumentError(\n        \":sim_func_name must be the *name* of the solver (a Symbol); functions cannot be hashed\"))\n    f = resolve_dynamic_function(name)\n    f === nothing && throw(ArgumentError(\"could not resolve the solver function `$name`\"))\n    return f\nend\n\n\"\"\"\n    run_smart_simulation(sim_func, params; force_overwrite = false, metadata = Dict())\n\nRuns `sim_func(params)` unless a dataset for `params` already exists (then returns `NoSimData()`).\nThe solver receives a copy of the parameters; the result is always stored under the task\nparameters so it can be found again. Its `metadata` (which the solver may fill) is saved with it, plus `metadata`\ngiven here and `:provenance` (versions, host, git commit, the solver and the seconds it took; see\n[`sim_data_table`](@ref)); a post-processing record of earlier data is dropped. Returns the produced data (or\n`NoSimData()`).\n\"\"\"\nfunction run_smart_simulation(sim_func, params::AbstractDict; force_overwrite::Bool = false,\n                              metadata::AbstractDict = Dict{Symbol, Any}())\n    !force_overwrite && does_sim_data_exist(params) && return NoSimData()\n    task_params = _to_paramdict(params)\n    # invokelatest: the solver may have been defined after the caller started (e.g. via `sources`).\n    t0 = time()\n    sim_data = Base.invokelatest(sim_func, copy(task_params))\n    wall_time = time() - t0\n    (sim_data === nothing || sim_data isa NoSimData) && return NoSimData()\n    sim_data isa AbstractSimData || throw(ArgumentError(\n        \"the solver must return an AbstractSimData (see `create_sim_data`), got $(typeof(sim_data))\"))\n    if _param_hash(sim_data.params) != _param_hash(task_params)\n        @warn \"The solver returned data whose parameters differ from the task parameters; \" *\n              \"storing it under the task parameters so that it can be found again.\"\n        empty!(sim_data.params)\n        merge!(sim_data.params, task_params)\n    end\n    md = sim_data.metadata\n    isempty(metadata) || merge!(md, _metadata_dict(metadata))\n    md[:provenance] = _provenance(solver = sim_func, wall_time = wall_time)\n    delete!(md, :postprocessed)\n    _save_sim_data(sim_data, true, false, Dict{String, Any}())\n    return sim_data\nend\n\n# Pass 1 for one task: (:cached | :changed | :ran | :empty | :failed, error message or nothing). `:changed`: a\n# result is stored, but was made with other source code (kept with `on_changed = :warn`; with `:recompute` the task\n# runs again and reports `:ran`, `changed` tells the caller).\nfunction _run_task(params::ParamDict, force_overwrite::Bool, metadata::AbstractDict, on_changed::Symbol, dry_run::Bool)\n    changed = false\n    try\n        path = force_overwrite ? nothing : _find_file(params)\n        if path !== nothing && _is_current_file(path; upgrade = !dry_run)   # (a dry run writes nothing)\n            changed = on_changed !== :ignore && _code_changed(path, params, metadata)\n            (!changed || on_changed === :warn) && return (changed ? :changed : :cached, nothing, changed)\n        end\n        dry_run && return (:ran, nothing, changed)\n        result = run_smart_simulation(_resolve_solver(params), params; force_overwrite = true, metadata = metadata)\n        return (result isa NoSimData ? :empty : :ran, nothing, changed)\n    catch e\n        e isa InterruptException && rethrow()\n        @error \"Simulation failed for parameters $params\" exception = (e, catch_backtrace())\n        return (:failed, _error_text(e), changed)\n    end\nend\n\n_error_text(e) = (msg = e isa LoadError ? sprint(showerror, e.error) : sprint(showerror, e); String(first(split(msg, '\\n'))))\n\n# Whether the stored result of `params` was made with other source code than the current run: other contents of\n# the source files (compared as a set of digests, so moved files don't count; only if both runs list sources), or\n# another version of the solver's package (only if both are known).\nfunction _code_changed(path::AbstractString, params::AbstractDict, metadata::AbstractDict)\n    stored = jldopen(_file_metadata, path, \"r\")\n    stored_sources = get(stored, :sources, nothing)\n    prov = get(stored, :provenance, nothing)\n    stored_version = prov isa AbstractDict ? get(prov, :solver_version, nothing) : nothing\n    current = get(metadata, \"sources\", nothing)\n    if stored_sources isa AbstractDict && current isa AbstractDict && !isempty(stored_sources) && !isempty(current)\n        Set(values(stored_sources)) == Set(values(current)) || return true\n    end\n    if stored_version !== nothing\n        solver = try _resolve_solver(params) catch; nothing end\n        v = solver === nothing ? nothing : _func_version(solver)\n        v !== nothing && v != stored_version && return true\n    end\n    return false\nend\n\nfunction _load_sources(sources::AbstractVector{\u003c:AbstractString})\n    for file in sources\n        path = abspath(file)\n        isfile(path) || throw(ArgumentError(\"source file not found: $path\"))\n        Base.include(get_target_module(), path)\n    end\n    return nothing\nend\n\n# Always written (possibly empty), so a rerun without sources replaces digests from an earlier run.\nfunction _source_metadata(sources::AbstractVector{\u003c:AbstractString})\n    digests = Dict{String, String}(abspath(f) => bytes2hex(open(sha256, abspath(f))) for f in sources)\n    return Dict{String, Any}(\"sources\" => digests)\nend\n\nfunction _stats_task(params::ParamDict, ref_factory, required::Vector{Symbol}, force_overwrite::Bool, dry_run::Bool)\n    try\n        path = _find_file(params)\n        path === nothing && return (:missing, nothing)\n        has_reference = ref_factory !== nothing\n        (force_overwrite || _needs_stats(path, required, has_reference)) || return (:cached, nothing)\n        dry_run && return (:ran, nothing)\n        sim_data = _load_key(path, \"raw\")\n        ref_func = has_reference ? ref_factory(params) : nothing\n        _calculate_all_stats!(sim_data, ref_func, force_overwrite, true, true)\n        return (:ran, nothing)\n    catch e\n        e isa InterruptException && rethrow()\n        @error \"Statistics failed for parameters $params\" exception = (e, catch_backtrace())\n        return (:failed, _error_text(e))\n    end\nend\n\n# What identifies a post-processor in the records of a dataset (`metadata[:postprocessed]`: name => record): its\n# name, the source files of the run (their digests) and its package's version. A file with a record of the same name is not\n# post-processed again: with the same record it is `:skipped`, with another one (the post-processor changed)\n# `:outdated` (applying it again to post-processed data is only right for an idempotent post-processor:\n# `force_postprocess`). With `on_changed_sources = :ignore` the sources don't count.\nfunction _postprocess_record(name, post_func, metadata::AbstractDict)\n    sources = get(metadata, \"sources\", Dict{String, String}())\n    record = Dict{Symbol, Any}(:sources => sort!(collect(String, values(sources))))\n    v = _func_version(post_func)\n    isnothing(v) || (record[:version] = v)\n    return Symbol(name) => record\nend\n\n_without_sources(record::AbstractDict) = filter(p -> Symbol(first(p)) !== :sources, record)\n\nfunction _post_task(params::ParamDict, post_func, (name, record)::Pair, force::Bool, dry_run::Bool, ignore_sources::Bool)\n    try\n        path = _find_file(params)\n        path === nothing && return (:missing, nothing)\n        done = get(jldopen(f -> _file_metadata(f; strict = true), path, \"r\"), :postprocessed, nothing)\n        records = done isa AbstractDict ? Dict{Symbol, Any}(Symbol(k) => v for (k, v) in done) : Dict{Symbol, Any}()\n        own = get(records, name, nothing)\n        if !force && own isa AbstractDict\n            same = ignore_sources ? isequal(_without_sources(own), _without_sources(record)) : isequal(own, record)\n            return (same ? :skipped : :outdated, nothing)\n        end\n        dry_run && return (:ran, nothing)\n        records[name] = record\n        sim_data = _load_key(path, \"raw\")   # (with its metadata)\n        if post_func(sim_data) === true\n            # The rewrite keeps the record of evaluated statistics, so the next run doesn't redo them; the metadata\n            # the post-processor changed is saved with the data.\n            sim_data.metadata[:postprocessed] = records\n            entries = jldopen(f -> haskey(f, \"evaluated_stats\") ? Dict{String, Any}(\"evaluated_stats\" => f[\"evaluated_stats\"]) :\n                                   Dict{String, Any}(), path, \"r\")\n            _save_sim_data(sim_data, true, false, entries)\n        else\n            _update_metadata!(path, :postprocessed => records)   # (nothing changed: only the record)\n        end\n        return (:ran, nothing)\n    catch e\n        e isa InterruptException && rethrow()\n        @error \"Post-processing failed for parameters $params\" exception = (e, catch_backtrace())\n        return (:failed, _error_text(e))\n    end\nend\n\n# Whether a file is missing (or has stale) entries for any of the required statistics. A statistic that\n# was evaluated without a reference and dropped (all NaN) is due again once a reference is available.\nfunction _needs_stats(path::AbstractString, required::Vector{Symbol}, has_reference::Bool = false)\n    return jldopen(path, \"r\") do file\n        saved = haskey(file, \"stat_keys\") ? file[\"stat_keys\"] : Symbol[]\n        evaluated = haskey(file, \"evaluated_stats\") ? file[\"evaluated_stats\"] : Symbol[]\n        evaluated_with_reference = haskey(file, \"evaluated_with_reference\") ? file[\"evaluated_with_reference\"] : false\n        file_registry = haskey(file, \"registry\") ? file[\"registry\"] : nothing\n        registry = get_stat_registry()\n        for k in required\n            if k in saved\n                # present: stale only if the kept dimensions changed\n            elseif k in evaluated\n                has_reference && !evaluated_with_reference && return true\n            else\n                return true\n            end\n            file_registry === nothing || get(file_registry, k, nothing) == registry[k] || return true\n        end\n        return false\n    end\nend\n\n\"\"\"\n    RunSummary\n\nWhat [`run_all_simulations`](@ref) did (or, with `dry_run = true`, would do), shown as a short report:\n- `tasks`: the parameter sets of the configuration;\n- `ran`, `cached`, `empty` (the solver returned nothing), `failed` (`params => error message`): pass 1;\n- `changed`: stored results made with other source code (other contents of the source files, or another version of\n  the solver's package), kept (`on_changed_sources = :warn`) or recomputed (`:recompute`); empty with `:ignore`;\n- `stats`, `postprocessing`: counts per outcome (`:ran`, `:cached` / `:skipped`, `:outdated` (post-processed by\n  another version of the post-processor, see [`run_all_simulations`](@ref)), `:failed`, `:missing`), and\n  `stats_failed`, `postprocessing_failed` (`params => error message`);\n- `files`: the data file of each task (in the order of `tasks`), `nothing` where nothing usable is stored. After a\n  run, the files holding the results; after a dry run, the files stored now, i.e. the data the configuration needs\n  that is there already (e.g. to copy it with its configuration: `filter(!isnothing, s.files)`);\n- `elapsed`: seconds; `dry_run`: whether nothing was run.\n\"\"\"\nBase.@kwdef struct RunSummary\n    dry_run::Bool = false\n    tasks::Vector{ParamDict} = ParamDict[]\n    ran::Vector{ParamDict} = ParamDict[]\n    cached::Vector{ParamDict} = ParamDict[]\n    empty::Vector{ParamDict} = ParamDict[]\n    failed::Vector{Pair{ParamDict, String}} = Pair{ParamDict, String}[]\n    changed::Vector{ParamDict} = ParamDict[]\n    stats::Dict{Symbol, Int} = Dict{Symbol, Int}()\n    stats_failed::Vector{Pair{ParamDict, String}} = Pair{ParamDict, String}[]\n    postprocessing::Dict{Symbol, Int} = Dict{Symbol, Int}()\n    postprocessing_failed::Vector{Pair{ParamDict, String}} = Pair{ParamDict, String}[]\n    elapsed::Float64 = 0.0\n    files::Vector{Union{Nothing, String}} = Union{Nothing, String}[]\nend\n\nfunction Base.show(io::IO, ::MIME\"text/plain\", s::RunSummary)\n    verb = s.dry_run ? \"would run\" : \"ran\"\n    println(io, \"RunSummary\", s.dry_run ? \" (dry run)\" : \"\", \": \", length(s.tasks), \" task(s) in \",\n            round(s.elapsed, digits = 2), \" s: \", length(s.ran), \" \", verb, \", \", length(s.cached), \" cached\",\n            isempty(s.empty) ? \"\" : \", $(length(s.empty)) without output\", isempty(s.failed) ? \"\" : \", $(length(s.failed)) failed\")\n    isempty(s.tasks) || length(s.files) != length(s.tasks) ||\n        println(io, \"  stored: \", count(!isnothing, s.files), \" of \", length(s.tasks), \" result(s) (files)\")\n    isempty(s.changed) || println(io, \"  changed code: \", length(s.changed), \" stored result(s) made with other source \",\n                                  \"code (see on_changed_sources)\")\n    isempty(s.stats) || println(io, \"  statistics: \", _counts_text(s.stats, s.dry_run))\n    isempty(s.postprocessing) || println(io, \"  post-processing: \", _counts_text(s.postprocessing, s.dry_run))\n    for (label, list) in ((\"failed\", s.failed), (\"statistics failed\", s.stats_failed),\n                          (\"post-processing failed\", s.postprocessing_failed))\n        for (p, msg) in first(list, 5)\n            println(io, \"  $label: \", _param_text(p), \": \", first(msg, 120))\n        end\n        length(list) > 5 && println(io, \"  … $(length(list) - 5) more\")\n    end\nend\nBase.show(io::IO, s::RunSummary) =\n    print(io, \"RunSummary(\", length(s.tasks), \" tasks: \", length(s.ran), \" ran, \", length(s.cached), \" cached, \",\n          length(s.failed), \" failed)\")\n\n_counts_text(c, dry) = join((\"$(v) $(k === :ran && dry ? \"would run\" : string(k))\" for (k, v) in sort!(collect(c)) if v > 0), \", \")\n_param_text(p) = join((\"$k = $(val2str(v))\" for (k, v) in sort!(collect(p), by = x -> string(first(x)))\n                       if k !== :sim_func_name), \", \")\n\nconst _CHANGED_WARNED = Set{UInt}()   # (stored results of other source code warned about in this session)\n\n\"\"\"\n    run_all_simulations(config::SimulationConfig; force_overwrite = false, calculate_stats = false,\n                        force_stats = false, post_process = true, force_postprocess = false, parallel = false,\n                        load_sources = true, on_changed_sources = :warn, dry_run = false) -> RunSummary\n\nRuns the complete pipeline for a [`SimulationConfig`](@ref) and returns a [`RunSummary`](@ref):\n0. includes `config.sources` into the target module (with `load_sources = false` the caller has done that\n   itself, e.g. PDEStudio, which runs the source copies bundled with an export in place of their originals; their\n   digests are stored either way),\n1. runs every task of [`generate_tasks`](@ref) whose data is not on disk yet (all of them with\n   `force_overwrite`), in parallel over Julia threads with `parallel = true`. Stored results made with other source\n   code (other contents of the source files, or another version of the solver's package) are handled by\n   `on_changed_sources`: `:warn` keeps them and warns (once per session for the same results and code; the summary\n   lists them on every run), `:recompute` runs them again, `:ignore` keeps them silently,\n2. with `calculate_stats = true`, evaluates missing statistics using the reference factory\n   `config.reference` (`params -> (x -> u_exact)`); statistics that were dropped earlier for lack of\n   a reference are evaluated again once a reference is configured. `force_stats = true` recomputes\n   every registered statistic without rerunning the simulations,\n3. with `post_process = true`, calls `config.postprocess(data)` for every dataset it hasn't post-processed yet and\n   saves the (modified) data again when it returns `true`. Each file records the post-processor that ran (its name,\n   the source files of the run and its package's version), so it runs once per dataset and post-processor: on new\n   data, and for a post-processor of another name. Data post-processed by another version of it (other source files\n   or package version; with `on_changed_sources = :ignore` only another package version) is kept and reported as\n   `:outdated` with a warning; `force_postprocess = true` runs it on every dataset, also on data it has processed\n   already, so a post-processor should be idempotent (files of earlier versions have no record: the first run\n   post-processes them).\nWith `dry_run = true` no solver, statistic or post-processor runs and nothing is written (the `sources` are still\nincluded): the summary lists what would run, and its `files` the data files the configuration needs that are stored\nalready (`nothing` for those that would be computed), e.g. to copy them together with the configuration.\nFailures of individual tasks are logged, listed in the summary and do not abort the batch.\n\"\"\"\nfunction run_all_simulations(config::SimulationConfig; force_overwrite::Bool = false, calculate_stats::Bool = false,\n                             force_stats::Bool = false, post_process::Bool = true, force_postprocess::Bool = false,\n                             parallel::Bool = false, load_sources::Bool = true, on_changed_sources::Symbol = :warn,\n                             dry_run::Bool = false)\n    on_changed_sources in (:warn, :recompute, :ignore) ||\n        throw(ArgumentError(\"on_changed_sources = :$on_changed_sources: :warn, :recompute or :ignore\"))\n    t_start = time()\n    @info dry_run ? \"Planning the simulation pipeline (dry run).\" : \"Started simulation pipeline.\"\n    load_sources && _load_sources(config.sources)\n    tasks = generate_tasks(config)\n    n = length(tasks)\n    if n == 0\n        @info \"No numerical simulations to run.\"\n        return RunSummary(dry_run = dry_run, elapsed = time() - t_start)\n    end\n\n    # Every per-task call goes through `invokelatest`, so functions defined after this call started\n    # (e.g. in `config.sources`, or a stat preset loaded inside a function) are visible.\n\n    # --- Pass 1: simulations ---\n    @info \"Pass 1: $(dry_run ? \"checking\" : \"executing\") $n simulation task(s) (parallel: $parallel)...\"\n    metadata = _source_metadata(config.sources)\n    results = Vector{Any}(undef, n)\n    progress = Progress(n; desc = dry_run ? \"Checking simulations...\" : \"Running simulations...\", enabled = !dry_run)\n    if parallel && !dry_run\n        Threads.@threads for i in 1:n\n            results[i] = Base.invokelatest(_run_task, tasks[i], force_overwrite, metadata, on_changed_sources, dry_run)\n            next!(progress)\n        end\n    else\n        for i in 1:n\n            results[i] = Base.invokelatest(_run_task, tasks[i], force_overwrite, metadata, on_changed_sources, dry_run)\n            next!(progress)\n        end\n    end\n    pick(st) = ParamDict[tasks[i] for i in 1:n if results[i][1] in st]\n    failed = Pair{ParamDict, String}[tasks[i] => results[i][2] for i in 1:n if results[i][1] === :failed]\n    changed = ParamDict[tasks[i] for i in 1:n if results[i][3]]\n    ran, cached, empty_ = pick((:ran,)), pick((:cached, :changed)), pick((:empty,))\n    would_run = [r[1] === :ran for r in results]\n    @info \"Pass 1 finished: $(length(ran)) $(dry_run ? \"would run\" : \"run\"), $(length(cached)) cached, \" *\n          \"$(length(empty_)) without output, $(length(failed)) failed.\"\n    if !isempty(changed) && on_changed_sources === :warn\n        # (once per session for the same results and code: the summary lists them on every run)\n        key = hash((sort!([_param_hash(p) for p in changed]), get(metadata, \"sources\", nothing)))\n        if key in _CHANGED_WARNED\n            @debug \"$(length(changed)) stored result(s) of other source code kept (warned before).\"\n        else\n            push!(_CHANGED_WARNED, key)\n            @warn \"$(length(changed)) stored result(s) were made with other source code (other contents of the source \" *\n                  \"files, or another version of the solver's package) and are kept. run_all_simulations(…; \" *\n                  \"on_changed_sources = :recompute) recomputes them, :ignore silences this (said once per session).\"\n        end\n    end\n\n    # --- Pass 2: statistics ---\n    stats, stats_failed = Dict{Symbol, Int}(), Pair{ParamDict, String}[]\n    if calculate_stats\n        @info \"Pass 2: $(dry_run ? \"checking\" : \"calculating\") statistics...\"\n        ref_factory = resolve_dynamic_function(config.reference)\n        required = sort!(Symbol[k for k in keys(get_stat_registry()) if k !== :Solution])\n        progress = Progress(n; desc = \"Calculating stats...\", enabled = !dry_run)\n        for (i, params) in enumerate(tasks)\n            # (in a dry run, the tasks that would run would get their statistics and post-processing, too)\n            st, err = dry_run && would_run[i] ? (isempty(required) ? :cached : :ran, nothing) :\n                      Base.invokelatest(_stats_task, params, ref_factory, required, force_overwrite || force_stats, dry_run)\n            stats[st] = get(stats, st, 0) + 1\n            st === :failed && push!(stats_failed, params => err)\n            next!(progress)\n        end\n    end\n\n    # --- Pass 3: post-processing ---\n    post, post_failed = Dict{Symbol, Int}(), Pair{ParamDict, String}[]\n    post_func = resolve_dynamic_function(config.postprocess)\n    if post_process && post_func !== nothing\n        @info \"Pass 3: $(dry_run ? \"checking\" : \"custom\") post-processing...\"\n        record = _postprocess_record(config.postprocess, post_func, metadata)\n        progress = Progress(n; desc = \"Post-processing...\", enabled = !dry_run)\n        for (i, params) in enumerate(tasks)\n            st, err = dry_run && would_run[i] ? (:ran, nothing) :\n                      Base.invokelatest(_post_task, params, post_func, record, force_postprocess, dry_run,\n                                        on_changed_sources === :ignore)\n            post[st] = get(post, st, 0) + 1\n            st === :failed && push!(post_failed, params => err)\n            next!(progress)\n        end\n        if get(post, :outdated, 0) > 0\n            @warn \"$(post[:outdated]) dataset(s) were post-processed by another version of $(config.postprocess) (other \" *\n                  \"source files or package version) and are kept. run_all_simulations(…; force_postprocess = true) \" *\n                  \"applies it again, to data it has processed already: only right for an idempotent post-processor.\"\n        end\n    end\n\n    summary = RunSummary(dry_run = dry_run, tasks = tasks, ran = ran, cached = cached, empty = empty_, failed = failed,\n                         changed = changed, stats = stats, stats_failed = stats_failed, postprocessing = post,\n                         postprocessing_failed = post_failed, elapsed = time() - t_start,\n                         files = Union{Nothing, String}[_stored_file(t) for t in tasks])\n    @info dry_run ? \"Dry run complete.\" : \"Batch simulation run complete!\"\n    return summary\nend\n\n# The data file of `params` that loading would use, or `nothing` (also for a file whose data doesn't load as a dataset\n# of this version: the pipeline recomputes it; nothing is written here)\nfunction _stored_file(params::AbstractDict)\n    path = _find_file(params)\n    return path !== nothing && _is_current_file(path; upgrade = false) ? path : nothing\nend\n\n# ==============================================================================\n# --- Reference generators ---\n# ==============================================================================\n\nfunction _grid_spacing(axes::Tuple, ::Type{T}) where {T}\n    return SVector{length(axes), T}(ntuple(d -> length(axes[d]) > 1 ?\n        (last(axes[d]) - first(axes[d])) / T(length(axes[d]) - 1) : one(T), length(axes)))\nend\n\n\"\"\"\n    generate_reference_simdata(ref_func, params, template_domain, res, Val(:eulerian))\n    generate_reference_simdata(ref_func, params, template_domain, res, Val(:lagrangian))\n    generate_reference_simdata(ref_func, params, template_domain, res, kind::Symbol)\n\nEvaluates the exact solution `ref_func(x::SVector{D})` on a uniform grid spanning the bounding box\nof `template_domain` with spacetime resolution `res`, as Eulerian data or as stationary particles.\n\"\"\"\ngenerate_reference_simdata(ref_func, params::AbstractDict, template_domain::DomainInfo, res::Tuple, kind::Symbol) =\n    generate_reference_simdata(ref_func, params, template_domain, res, Val(kind))\n\nfunction generate_reference_simdata(ref_func, params::AbstractDict, template_domain::DomainInfo{D, T}, res::Tuple,\n                                    ::Val{:eulerian}) where {D, T}\n    res_ = _check_res(res, D)\n    axes = ntuple(d -> _linspace(template_domain.mins[d], template_domain.maxs[d], res_[d]), Val(D))\n    M = length(ref_func(SVector{D, T}(ntuple(d -> axes[d][1], Val(D)))))\n    return _reference_eulerian(ref_func, params, template_domain, axes, Val(M))\nend\n\nfunction _reference_eulerian(ref_func, params, domain::DomainInfo{D, T}, axes::NTuple{D, Vector{T}}, ::Val{M}) where {D, T, M}\n    u = Array{SVector{M, T}, D}(undef, map(length, axes))\n    Threads.@threads for I in CartesianIndices(u)\n        u[I] = _as_svector(ref_func(SVector{D, T}(ntuple(d -> axes[d][I[d]], Val(D)))), Val(M), T)\n    end\n    ref_domain = _copy_domain(domain; spacing = _grid_spacing(axes, T))\n    return ESimData{D, _nspace(domain), M, T}(params, ref_domain, axes, u, StatDict{M, T}(),\n                                              _derived_metadata(Dict{Symbol, Any}(), :reference))\nend\n\nfunction generate_reference_simdata(ref_func, params::AbstractDict, template_domain::DomainInfo{D, T}, res::Tuple,\n                                    ::Val{:lagrangian}) where {D, T}\n    return _reference_lagrangian(ref_func, params, template_domain, _check_res(res, D), Val(_nspace(template_domain)))\nend\n\nfunction _reference_lagrangian(ref_func, params, domain::DomainInfo{D, T}, res::NTuple{D, Int}, ::Val{DS}) where {D, T, DS}\n    s_axes = ntuple(d -> _linspace(domain.mins[d], domain.maxs[d], res[d]), Val(DS))\n    points = vec([SVector{DS, T}(ntuple(d -> s_axes[d][I[d]], Val(DS))) for I in CartesianIndices(ntuple(d -> res[d], Val(DS)))])\n    t_vec = D > DS ? _linspace(domain.mins[D], domain.maxs[D], res[D]) : T[0]\n    first_point = D > DS ? SVector{D, T}(points[1]..., t_vec[1]) : SVector{D, T}(points[1]...)\n    M = length(ref_func(first_point))\n    spacing = D > DS ? _grid_spacing((s_axes..., t_vec), T) : _grid_spacing(s_axes, T)\n    return _reference_particles(ref_func, params, _copy_domain(domain; spacing = spacing), points, t_vec, Val(M))\nend\n\nfunction _reference_particles(ref_func, params, domain::DomainInfo{D, T}, points::Vector{SVector{DS, T}},\n                              t_vec::Vector{T}, ::Val{M}) where {D, T, DS, M}\n    nt = length(t_vec)\n    u = Vector{Vector{SVector{M, T}}}(undef, nt)\n    Threads.@threads for n in 1:nt\n        tv = t_vec[n]\n        u[n] = [_as_svector(ref_func(D > DS ? SVector{D, T}(p..., tv) : SVector{D, T}(p...)), Val(M), T) for p in points]\n    end\n    return LSimData{D, DS, M, T}(params, domain, t_vec, fill(points, nt), u, StatDict{M, T}(),\n                                 _derived_metadata(Dict{Symbol, Any}(), :reference))\nend\n","changed":[[397,399],[415,415],[423,424],[445,446],[459,460],[474,475],[521,530],[574,575],[580,586]],"added":31,"removed":6},{"name":"StatCalculation.jl","path":"src/StatCalculation.jl","type":"file","files":1,"lines":409,"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"errors":[],"counts":{"AI-Generation":{"files":{"G2":0.9144254278728606,"G3":0.08557457212713936},"lines":{"G2":374,"G3":35}},"Human-Review":{"files":{"H0":0.08068459657701711,"H1":0.004889975550122249,"H2":0.9144254278728606},"lines":{"H0":33,"H1":2,"H2":374}},"AI-Review":{"files":{"A0":0.039119804400977995,"A1":0.960880195599022},"lines":{"A0":16,"A1":393}}},"parts":[{"lines":374,"runs":[[1,209],[217,219],[226,235],[242,251],[262,264],[271,409]],"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":17,"runs":[[210,212],[216,216],[220,225],[259,261],[265,266],[269,270]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] 6e36904"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":16,"runs":[[213,215],[236,241],[252,258]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A0","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":[],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"commit d60e6c7 (restricted name lookup, derived datasets, hash …), pull request checkboxes"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A0"},"errors":[],"advisory":false},{"lines":2,"runs":[[267,268]],"declaration":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] 5dd99bd"},"levels":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"# ==============================================================================\n# --- Statistics: registry resolution, custom stats & the evaluation pipeline ---\n# ==============================================================================\n\n\"\"\"\n    set_stat_preset!(name::AbstractString)\n\nLoads a predefined set of statistics (registrations and `calc_stat` overloads) from `presets/\u003cname>.jl`.\n\n```julia-repl\njulia> set_stat_preset!(\"hyperbolic\")\n```\n\"\"\"\nfunction set_stat_preset!(name::AbstractString)\n    preset_path = joinpath(@__DIR__, \"..\", \"presets\", \"$name.jl\")\n    if !isfile(preset_path)\n        @error \"Preset file not found: $preset_path\"\n        return false\n    end\n    Base.include(@__MODULE__, preset_path)\n    @info \"Successfully loaded stat preset: $name\"\n    return true\nend\n\nfunction _kept_dims(reg_val, domain::DomainInfo)\n    if reg_val === :all\n        return collect(domain.dim_keys)\n    elseif reg_val === :space\n        return Symbol[d for d in domain.dim_keys if d !== domain.time_dim]\n    elseif reg_val === :time\n        return domain.time_dim === nothing ? Symbol[] : Symbol[domain.time_dim]\n    elseif reg_val isa Symbol  # a single dimension name\n        return Symbol[d for d in domain.dim_keys if d === reg_val]\n    elseif reg_val isa AbstractVector\n        # domain order, i.e. the order of the dimensions of the statistic's array\n        return Symbol[d for d in domain.dim_keys if d in reg_val]\n    end\n    return Symbol[]\nend\n\n_kept_indices(kept::AbstractVector{Symbol}, domain::DomainInfo) =\n    sort!(Int[i for (i, d) in enumerate(domain.dim_keys) if d in kept])\n\n\"\"\"\n    get_kept_dims(stat::Symbol, domain::DomainInfo)\n\nResolves the registry entry of `stat` (aliases `:all`, `:space`, `:time`, a dimension name or a\nvector of names) into the dimension names it keeps, in domain order (the order of the dimensions of\nthe statistic's array, whatever order the registry lists them in). `:Solution` always keeps all dimensions.\n\"\"\"\nfunction get_kept_dims(stat::Symbol, domain::DomainInfo)\n    stat === :Solution && return collect(domain.dim_keys)\n    return _kept_dims(get(domain.stat_registry, stat, Symbol[]), domain)\nend\n\n\"\"\"\n    get_kept_indices(stat::Symbol, domain::DomainInfo)\n\nSorted indices (into `domain.dim_keys`) of the dimensions kept by `stat`.\n\"\"\"\nget_kept_indices(stat::Symbol, domain::DomainInfo) = _kept_indices(get_kept_dims(stat, domain), domain)\n\n\"\"\"\n    get_integration_measure(stat::Symbol, domain::DomainInfo)\n\nProduct of the spacings of all dimensions that `stat` integrates out (e.g. `dx * dy`).\n\"\"\"\nfunction get_integration_measure(stat::Symbol, domain::DomainInfo{D, T}) where {D, T}\n    kept = get_kept_dims(stat, domain)\n    measure = one(T)\n    for d in 1:D\n        domain.dim_keys[d] in kept || (measure *= domain.spacing[d])\n    end\n    return measure\nend\n\n# --- add_stat! ---------------------------------------------------------------\n\n_stat_value(v::Real, ::Val{M}, ::Type{T}) where {M, T} = SVector{M, T}(ntuple(_ -> T(v), Val(M)))\n_stat_value(v::SVector{M, \u003c:Real}, ::Val{M}, ::Type{T}) where {M, T} = SVector{M, T}(v)\n_stat_value(v::AbstractArray{\u003c:Real}, m::Val{M}, ::Type{T}) where {M, T} = map(x -> _stat_value(x, m, T), v)\n# Per-particle scalar fields (one `Vector` per time step); SVector elements are left untouched.\n_stat_value(v::AbstractVector{\u003c:Vector{\u003c:Real}}, m::Val{M}, ::Type{T}) where {M, T} =\n    Vector{SVector{M, T}}[_stat_value(step, m, T) for step in v]\n_stat_value(v, ::Val{M}, ::Type{T}) where {M, T} = v\n\nfunction _check_stat_shape(data::ESimData, name::Symbol, value, kept::Vector{Symbol})\n    (value isa AbstractArray && !(value isa SVector)) || return nothing\n    idx = _kept_indices(kept, data.domain)\n    expected = Tuple(length(data.axes[i]) for i in idx)\n    size(value) == expected || throw(DimensionMismatch(\n        \"statistic :$name has size $(size(value)), but the dimensions it keeps $(Tuple(kept)) have lengths $expected\"))\n    return nothing\nend\n# Per-particle fields need one entry per particle and time step; time series one entry per step.\n_is_particle_field(value, data::LSimData) = value isa AbstractVector{\u003c:AbstractVector} &&\n    length(value) == length(data.x) && all(n -> length(value[n]) == length(data.x[n]), eachindex(value))\n\nfunction _check_stat_shape(data::LSimData, name::Symbol, value, kept::Vector{Symbol})\n    if length(kept) == length(data.domain.dim_keys)\n        _is_particle_field(value, data) || throw(DimensionMismatch(\n            \"statistic :$name keeps all dimensions, so it needs one vector per time step with one entry per particle\"))\n    elseif has_time(data) && kept == [data.domain.time_dim] && value isa AbstractVector && !(value isa SVector)\n        length(value) == length(data.t) || throw(DimensionMismatch(\n            \"time series :$name has $(length(value)) entries, but the data has $(length(data.t)) time steps\"))\n    end\n    return nothing\nend\n_check_stat_shape(::AbstractSimData, ::Symbol, value, kept) = nothing\n\n\"\"\"\n    add_stat!(data::AbstractSimData, name::Symbol, value, kept_dims)\n\nAttaches a pre-computed statistic and records the dimensions it keeps (`:all`, `:space`, `:time`,\ndimension names, or `Symbol[]` for a scalar) so that conversions and frontends can slice it.\nNumbers and arrays of numbers are converted to `SVector`s with the dataset's component count, and\nshapes are checked against the kept axes (Eulerian) or time steps and particles (Lagrangian).\n\n[`calculate_all_stats!`](@ref) leaves such statistics alone, unless the same name is registered\nglobally (then it is recomputed with `force_overwrite = true` or when the kept dimensions differ).\n\"\"\"\nfunction add_stat!(sim_data::AbstractSimData{D, DS, M, T}, name::Symbol, value, kept_dims) where {D, DS, M, T}\n    name === :Solution && throw(ArgumentError(\"use `data.u = ...` (or `data.stats[:Solution] = ...`) to replace the solution\"))\n    reg_val = _registry_value(kept_dims)\n    stored = _stat_value(value, Val(M), T)\n    _check_stat_shape(sim_data, name, stored, _kept_dims(reg_val, sim_data.domain))\n    global_dims = get(get_stat_registry(), name, nothing)\n    if global_dims !== nothing && global_dims != reg_val\n        @warn \"Statistic :$name is registered globally with kept dimensions $global_dims; \" *\n              \"`calculate_all_stats!` will replace the value added here.\"\n    end\n    sim_data.domain.stat_registry[name] = reg_val\n    _raw_stats(sim_data)[name] = stored\n    @info \"Added custom stat '$name' keeping dimensions: $reg_val\"\n    return stored\nend\n\nfunction delete_stat!(data::AbstractSimData, name::Symbol)\n    name === :Solution && throw(ArgumentError(\":Solution is the dataset's `u` field and cannot be removed.\"))\n    delete!(_raw_stats(data), name)\n    delete!(data.domain.stat_registry, name)\n    return data\nend\n\n\"\"\"\n    calc_stat(::Val{name}, fixed_coords, u, ana, domain)\n\nExtension point for statistics registered with [`register_stat!`](@ref). Called once per retained\nslice: `fixed_coords` holds the coordinates of the kept dimensions, `u`/`ana` iterate the numerical\nand reference values of the slice (`ana` is `NaN` without a reference function). Must return an\n`SVector{M}`. The fallback returns `NaN`s, which removes the statistic.\n\"\"\"\ncalc_stat(stat, fixed_coords, u, ana, domain) = zero(eltype(u)) .* NaN\n\n\"\"\"\n    is_all_nan(val)\n\n`true` if every entry of a statistic (scalar `SVector`, array or per-particle series) contains a NaN.\n\"\"\"\nfunction is_all_nan(val)\n    if val isa Vector{\u003c:Vector}\n        return all(step -> all(svec -> any(isnan, svec), step), val)\n    elseif val isa SVector\n        return any(isnan, val)\n    elseif val isa AbstractArray\n        return all(svec -> any(isnan, svec), val)\n    end\n    return false\nend\n\n\"\"\"\n    remove_nan_stats!(stats::AbstractDict)\n\nRemoves every statistic whose values are all `NaN` (`:Solution` is never removed).\n\"\"\"\nfunction remove_nan_stats!(stats::AbstractDict)\n    for name in [k for (k, v) in stats if k !== :Solution && is_all_nan(v)]\n        @info \"Removing statistic :$name because all values are NaN (no reference data).\"\n        delete!(stats, name)\n    end\n    return stats\nend\n\n# Brings the dataset registry in line with the global one. Values computed for different kept\n# dimensions are dropped as stale. Returns the (sorted) global statistic names and whether anything changed.\nfunction _sync_registry!(sim_data::AbstractSimData)\n    reg = sim_data.domain.stat_registry\n    raw = _raw_stats(sim_data)\n    changed = false\n    for (name, dims) in get_stat_registry()\n        name === :Solution && continue\n        old = get(reg, name, nothing)\n        if old === nothing || old != dims\n            old === nothing || delete!(raw, name)\n            reg[name] = dims isa Vector ? copy(dims) : dims\n            changed = true\n        end\n    end\n    names = sort!(Symbol[k for k in keys(get_stat_registry()) if k !== :Solution])\n    return names, changed\nend\n\n\"\"\"\n    calculate_all_stats!(sim_data::AbstractSimData, ref_func = nothing; force_overwrite = false, save = true)\n\nEvaluates every statistic of the global registry (see [`register_stat!`](@ref)) that is missing\nfrom the dataset (or all of them with `force_overwrite = true`). `ref_func(x)` is the exact solution\nat the spacetime point `x::SVector{D}`; it is evaluated once per node/particle. Statistics that come\nout all-`NaN` (e.g. errors without a reference) are dropped. Statistics added with\n[`add_stat!`](@ref) are kept unless the global registry has a statistic of the same name (see there).\nWith `save = true` the dataset is saved when a registered statistic changed (values attached with\n[`add_stat!`](@ref) alone don't trigger a save: use [`save_sim_data`](@ref) with `overwrite = true`), unless the\ndataset is derived (a conversion, a resampled grid or a reference dataset; `data.metadata[:derived]`) or the\nfile for its parameters holds a different solution: such a dataset shares the parameters (and hash) of the native\nrun, so saving it would replace, or pass for, the native data. Then nothing is saved and a warning is logged. Like [`save_sim_data`](@ref), saving normalises `sim_data.params`.\nReturns `sim_data`.\n\"\"\"\ncalculate_all_stats!(sim_data::NoSimData, ref_func = nothing; kwargs...) = sim_data\n\ncalculate_all_stats!(sim_data::AbstractSimData, ref_func = nothing; force_overwrite::Bool = false, save::Bool = true) =\n    _calculate_all_stats!(sim_data, ref_func, force_overwrite, save, false)\n\n# `known_native = true`: `sim_data` was just loaded as \"raw\" from its file (the pipeline), so the comparison\n# with the stored solution can be skipped.\nfunction _calculate_all_stats!(sim_data::AbstractSimData, ref_func, force_overwrite::Bool, save::Bool, known_native::Bool)\n    names, changed = _sync_registry!(sim_data)\n    raw = _raw_stats(sim_data)\n    pending = force_overwrite ? names : filter(n -> !haskey(raw, n), names)\n    if !isempty(pending)\n        # `invokelatest` makes `calc_stat` methods and reference functions that were defined after the\n        # caller started (e.g. by `set_stat_preset!` inside a function) visible.\n        u_ana = ref_func === nothing ? generate_pointwise_nan(sim_data) :\n                Base.invokelatest(generate_pointwise_reference, sim_data, ref_func)\n        for name in pending\n            result = Base.invokelatest(_calc_stat!, sim_data, u_ana, name)\n            if result === nothing\n                # not defined for this kind of data (e.g. a profile over `x` on particles): a value left from another\n                # representation is stale\n                haskey(raw, name) && (delete!(raw, name); changed = true)\n                continue\n            end\n            if is_all_nan(result)\n                haskey(raw, name) && (delete!(raw, name); changed = true)\n            else\n                raw[name] = result\n                changed = true\n            end\n        end\n    end\n    if save\n        path = _find_file(sim_data.params)\n        derived = get(sim_data.metadata, :derived, nothing)\n        if !known_native && derived !== nothing\n            # (also without a file: stored, it would pass for the solver's result and the run would be \"cached\")\n            @warn \"Statistics were not saved: this is a $derived dataset (it shares the parameters of a native run \" *\n                  \"without being one). Pass `save = false` for derived datasets, or use \" *\n                  \"`save_sim_data(data; overwrite = true)` to store it as the data of these parameters.\"\n        elseif path !== nothing && !known_native && !_is_native_representation(path, sim_data)\n            @warn \"Statistics were not saved: the file for these parameters holds a different solution \" *\n                  \"(a converted or reference dataset, or data changed after loading). Pass `save = false` for \" *\n                  \"derived datasets, or use `save_sim_data(data; overwrite = true)` to replace the stored data.\"\n        else\n            # Remember what was evaluated (and whether a reference was available), so the pipeline does\n            # not reload data for stats that came out NaN, but retries them once a reference exists.\n            # Written together with the data if that is (re)written; otherwise only if the entries differ.\n            evaluated = Dict{String, Any}(\"evaluated_stats\" => names, \"evaluated_with_reference\" => ref_func !== nothing)\n            # (the same data rewritten: it keeps the pipeline's entries of the stored metadata, see `_carry_metadata!`)\n            changed && path !== nothing && _carry_metadata!(sim_data, path)\n            path = _save_sim_data(sim_data, changed, false, evaluated)\n            _update_entries!(path, evaluated)\n        end\n    end\n    return sim_data\nend\n\n# ==============================================================================\n# --- Eulerian reductions ---\n# ==============================================================================\n\n@inline function _extract_coords(axes, kept_idx, I, ::Val{L}, ::Type{T}) where {L, T}\n    return SVector{L, T}(ntuple(d -> axes[kept_idx[d]][I[d]], Val(L)))\nend\n\n# The statistic is passed as `Val{S}` so that the loop body is compiled once per statistic and the\n# user's `calc_stat` method is dispatched statically instead of once per slice.\nfunction _batch_stat_calc!(res, u_slices, ana_slices, axes, kept_idx, domain, stat::Val, ::Val{L}, ::Val{M},\n                           ::Type{T}) where {L, M, T}\n    cart = CartesianIndices(u_slices)\n    @batch for i in eachindex(u_slices)\n        I = cart[i]\n        fixed_coords = _extract_coords(axes, kept_idx, I, Val(L), T)\n        res[i] = _as_svector(calc_stat(stat, fixed_coords, vec(u_slices[i]), vec(ana_slices[i]), domain), Val(M), T)\n    end\n    return res\nend\n\n\"\"\"\n    _calc_stat!(sim_data, u_ana, stat_name)\n\nInternal: slices the data along the kept dimensions of `stat_name` and evaluates `calc_stat` on\nevery slice (multithreaded). Every result is converted to an `SVector{M, T}` (numbers are\nbroadcast over the components). Returns `nothing` if the kept dimensions are not supported.\n\"\"\"\nfunction _calc_stat!(sim_data::ESimData, u_ana, stat_name::Symbol)\n    # `Val(stat_name)` is a runtime value: this is the one dynamic dispatch, the kernels below are specialised.\n    return _calc_stat_eulerian(sim_data, u_ana, Val(stat_name), get_kept_indices(stat_name, sim_data.domain))\nend\n\nfunction _calc_stat_eulerian(sim_data::ESimData{D, DS, M, T}, u_ana, stat::Val, kept_idx::Vector{Int}) where {D, DS, M, T}\n    if isempty(kept_idx)  # scalar\n        value = calc_stat(stat, SVector{0, T}(), vec(sim_data.u), vec(u_ana), sim_data.domain)\n        return _as_svector(value, Val(M), T)\n    end\n    L = length(kept_idx)\n    res = Array{SVector{M, T}, L}(undef, ntuple(d -> length(sim_data.axes[kept_idx[d]]), L)...)\n    u_slices = eachslice(sim_data.u, dims = Tuple(kept_idx))\n    ana_slices = eachslice(u_ana, dims = Tuple(kept_idx))\n    _batch_stat_calc!(res, u_slices, ana_slices, sim_data.axes, kept_idx, sim_data.domain, stat, Val(L), Val(M), T)\n    return res\nend\n\n# ==============================================================================\n# --- Lagrangian reductions ---\n# ==============================================================================\n\nfunction _calc_stat!(sim_data::LSimData, u_ana, stat_name::Symbol)\n    return _calc_stat_lagrangian(sim_data, u_ana, Val(stat_name), get_kept_dims(stat_name, sim_data.domain))\nend\n\nfunction _calc_stat_lagrangian(sim_data::LSimData{D, DS, M, T}, u_ana, stat::Val{S}, kept::Vector{Symbol}) where {D, DS, M, T, S}\n    domain = sim_data.domain\n    u = sim_data.u\n    t = sim_data.t\n    Nt = length(t)\n\n    if isempty(kept)  # scalar over all particles (and time steps)\n        value = calc_stat(stat, SVector{0, T}(), reduce(vcat, u), reduce(vcat, u_ana), domain)\n        return _as_svector(value, Val(M), T)\n    elseif D > DS && kept == [domain.time_dim]  # time series\n        series = Vector{SVector{M, T}}(undef, Nt)\n        @batch for n in 1:Nt\n            series[n] = _as_svector(calc_stat(stat, SVector{1, T}(t[n]), u[n], u_ana[n], domain), Val(M), T)\n        end\n        return series\n    elseif length(kept) == D  # per-particle field\n        field = Vector{Vector{SVector{M, T}}}(undef, Nt)\n        x = sim_data.x\n        @batch for n in 1:Nt\n            x_n = x[n]\n            values = Vector{SVector{M, T}}(undef, length(x_n))\n            for p in eachindex(x_n)\n                fixed = D > DS ? SVector{D, T}(x_n[p]..., t[n]) : SVector{D, T}(x_n[p]...)\n                values[p] = _as_svector(calc_stat(stat, fixed, (u[n][p],), (u_ana[n][p],), domain), Val(M), T)\n            end\n            field[n] = values\n        end\n        return field\n    end\n    @debug \"Statistic :$S keeps $kept, which is not supported for Lagrangian data; skipping.\"\n    return nothing\nend\n\n# ==============================================================================\n# --- Pointwise reference caches ---\n# ==============================================================================\n\n_as_svector(v::Real, ::Val{M}, ::Type{T}) where {M, T} = SVector{M, T}(ntuple(_ -> T(v), Val(M)))\n_as_svector(v, ::Val{M}, ::Type{T}) where {M, T} = SVector{M, T}(v)\n\n\"\"\"\n    generate_pointwise_nan(data)\n\n`NaN`-filled replica of `data.u`, used as the reference when no reference function is available.\n\"\"\"\ngenerate_pointwise_nan(data::LSimData{D, DS, M, T}) where {D, DS, M, T} =\n    [fill(SVector{M, T}(ntuple(_ -> T(NaN), Val(M))), length(x)) for x in data.x]\n\ngenerate_pointwise_nan(data::ESimData{D, DS, M, T}) where {D, DS, M, T} =\n    fill(SVector{M, T}(ntuple(_ -> T(NaN), Val(M))), size(data.u))\n\n\"\"\"\n    generate_pointwise_reference(data, ref_func)\n\nEvaluates `ref_func(x)` at the spacetime coordinates `x::SVector{D}` of every grid node or particle\n(multithreaded). `ref_func` may return an `SVector`, a tuple/vector or a number.\n\"\"\"\nfunction generate_pointwise_reference(ldata::LSimData{D, DS, M, T}, ref_func) where {D, DS, M, T}\n    Nt = length(ldata.t)\n    u_ana = Vector{Vector{SVector{M, T}}}(undef, Nt)\n    t = ldata.t\n    x = ldata.x\n    @batch for n in 1:Nt\n        t_n = t[n]\n        u_ana[n] = D > DS ? [_as_svector(ref_func(SVector{D, T}(p..., t_n)), Val(M), T) for p in x[n]] :\n                            [_as_svector(ref_func(SVector{D, T}(p...)), Val(M), T) for p in x[n]]\n    end\n    return u_ana\nend\n\nfunction generate_pointwise_reference(edata::ESimData{D, DS, M, T}, ref_func) where {D, DS, M, T}\n    u = edata.u\n    u_ana = similar(u)\n    axes = edata.axes\n    @batch for i in eachindex(u)\n        I = CartesianIndices(u)[i]\n        u_ana[i] = _as_svector(ref_func(SVector{D, T}(ntuple(d -> axes[d][I[d]], Val(D)))), Val(M), T)\n    end\n    return u_ana\nend\n","changed":[],"added":0,"removed":0},{"name":"Structs.jl","path":"src/Structs.jl","type":"file","files":1,"lines":235,"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"errors":[],"parts":[{"lines":235,"runs":[[1,235]],"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"# ==============================================================================\n# --- Type aliases & global state ---\n# ==============================================================================\n\n\"\"\"\n    ParamDict\n\nAlias for `Dict{Symbol, Any}`: the flat, resolved parameters of a single simulation run.\nIts normalised content is hashed to locate the run on disk (see [`calculate_hash`](@ref)).\n\"\"\"\nconst ParamDict = Dict{Symbol, Any}\n\n\"\"\"\n    MethodDict\n\nAlias for `Dict{Symbol, ParamDict}`: maps method names (e.g. `:upwind`) to their parameter overrides.\n\"\"\"\nconst MethodDict = Dict{Symbol, ParamDict}\n\n\"\"\"\n    VariedDict\n\nAlias for `Dict{Symbol, Vector}`: the parameter sweep. The pipeline runs the Cartesian product of\nall vectors. Keys of the form `:Ns__x`/`:Ns__1` sweep a single entry of the tuple parameter `:Ns`, `:Ns__xy`\nseveral entries and `:Ns__all` every entry at once (see [`generate_method_tasks`](@ref)).\n\"\"\"\nconst VariedDict = Dict{Symbol, Vector}\n\n\"\"\"\n    StatRegistry\n\nAlias for `Dict{Symbol, Union{Symbol, Vector{Symbol}}}`: maps a statistic name to the dimensions\nit keeps (`:all`, `:space`, `:time`, a single dimension name, or a vector of dimension names).\n\"\"\"\nconst StatRegistry = Dict{Symbol, Union{Symbol, Vector{Symbol}}}\n\n# Initialised in `__init__` so that the precompile-time values are never baked into the image.\nconst _SAVE_ROOT_PATH = Ref{String}(\"\")\nconst _TARGET_MODULE = Ref{Module}(Main)\nconst _ACTIVE_STAT_REGISTRY = Ref{StatRegistry}(StatRegistry())\n\n\"\"\"\n    set_target_module!(target_module::Module)\n\nSets the module in which solver, reference and post-processing functions are looked up by name.\n\"\"\"\nset_target_module!(target_module::Module) = (_TARGET_MODULE[] = target_module)\n\n\"\"\"\n    get_target_module()\n\nReturns the module in which functions referenced by name are resolved (default: `Main`).\n\"\"\"\nget_target_module() = _TARGET_MODULE[]\n\n# ==============================================================================\n# --- Dictionary creators ---\n# ==============================================================================\n\n_to_paramdict(d) = ParamDict(Symbol(k) => v for (k, v) in d)\n\n\"\"\"\n    create_param_dict(kv...)\n\nBuilds a [`ParamDict`](@ref) from pairs or any key-value iterable; `String` keys become `Symbol`s.\n\"\"\"\ncreate_param_dict(kv::Pair...) = _to_paramdict(kv)\ncreate_param_dict(kv) = _to_paramdict(kv)\ncreate_param_dict() = ParamDict()\n\n\"\"\"\n    create_method_dict(kv...)\n\nBuilds a [`MethodDict`](@ref); nested dictionaries are converted to [`ParamDict`](@ref)s.\n\"\"\"\ncreate_method_dict(kv::Pair...) = MethodDict(Symbol(k) => _to_paramdict(v) for (k, v) in kv)\ncreate_method_dict(kv) = MethodDict(Symbol(k) => _to_paramdict(v) for (k, v) in kv)\ncreate_method_dict() = MethodDict()\n\n\"\"\"\n    create_varied_dict(kv...)\n\nBuilds a [`VariedDict`](@ref) for a parameter sweep. Ranges are collected into vectors.\n\"\"\"\ncreate_varied_dict(kv::Pair...) = _to_varieddict(kv)\ncreate_varied_dict(kv) = _to_varieddict(kv)\ncreate_varied_dict() = VariedDict()\n\nfunction _to_varieddict(kv)\n    out = VariedDict()\n    for (k, v) in kv\n        v isa AbstractVector || throw(ArgumentError(\n            \"the swept values of :$k must be a vector (or range), got $(typeof(v))\"))\n        out[Symbol(k)] = collect(v)\n    end\n    return out\nend\n\n# ==============================================================================\n# --- Global statistic registry ---\n# ==============================================================================\n\n_registry_value(v::Symbol) = v\n_registry_value(v::AbstractString) = Symbol(v)\n_registry_value(v) = Symbol[Symbol(x) for x in v]\n\n\"\"\"\n    get_stat_registry()\n\nReturns the active global statistic registry (a [`StatRegistry`](@ref)). Datasets copy it on creation\nand [`calculate_all_stats!`](@ref) brings them back in sync with it.\n\"\"\"\nget_stat_registry() = _ACTIVE_STAT_REGISTRY[]\n\n\"\"\"\n    set_stat_registry!(new_registry::AbstractDict)\n\nReplaces the global statistic registry with a copy of `new_registry`.\n\"\"\"\nfunction set_stat_registry!(new_registry::AbstractDict)\n    _ACTIVE_STAT_REGISTRY[] = StatRegistry(Symbol(k) => _registry_value(v) for (k, v) in new_registry)\n    @info \"Global statistic registry has been overwritten.\"\n    return get_stat_registry()\nend\n\n\"\"\"\n    reset_stat_registry!()\n\nClears the global statistic registry.\n\"\"\"\nfunction reset_stat_registry!()\n    empty!(_ACTIVE_STAT_REGISTRY[])\n    @info \"Global statistic registry has been cleared.\"\n    return get_stat_registry()\nend\n\n\"\"\"\n    register_stat!(name::Symbol, kept_dims)\n\nRegisters a statistic evaluated through a [`calc_stat`](@ref) overload. `kept_dims` lists the dimensions\nthat are *retained*; all others are integrated out. Valid values: `:all`, `:space`, `:time`, a single\ndimension name (e.g. `:x`) or a vector of dimension names (e.g. `[:x, :t]`; `Symbol[]` gives a scalar).\n\n`:Solution` is always registered (keeping all dimensions); registering it is a no-op.\n\n```julia-repl\njulia> register_stat!(:l2error, :time)\n```\n\"\"\"\nfunction register_stat!(name::Symbol, kept_dims::Union{Symbol, AbstractString, AbstractVector})\n    name === :Solution && return :all\n    value = _registry_value(kept_dims)\n    _ACTIVE_STAT_REGISTRY[][name] = value\n    @info \"Registered statistic :$name keeping dimensions: $value\"\n    return value\nend\n\n\"\"\"\n    delete_stat!(name::Symbol)\n    delete_stat!(data::AbstractSimData, name::Symbol)\n\nRemoves a statistic from the global registry, or removes a statistic (value and registry entry)\nfrom a single dataset. `:Solution` cannot be removed.\n\"\"\"\nfunction delete_stat!(name::Symbol)\n    delete!(_ACTIVE_STAT_REGISTRY[], name)\n    return get_stat_registry()\nend\n\n# ==============================================================================\n# --- Domain metadata ---\n# ==============================================================================\n\n\"\"\"\n    DomainInfo{D, T \u003c: Real}\n\nMetadata describing the bounding box and dimension layout of a dataset.\n\n# Fields\n- `dim_keys::NTuple{D, Symbol}`: ordered axis identifiers, e.g. `(:x, :y, :t)`.\n- `mins`, `maxs::SVector{D, T}`: bounding box of the domain.\n- `spacing::SVector{D, T}`: mean node spacing per axis (used as integration measure).\n- `time_dim::Union{Nothing, Symbol}`: the time axis (always the last one), or `nothing` for static data.\n- `stat_registry::StatRegistry`: the dimensions kept by each statistic of this dataset.\n\nThe constructor validates the layout, copies the registry (datasets never share registries) and\nalways registers `:Solution => :all`.\n\"\"\"\nstruct DomainInfo{D, T \u003c: Real}\n    dim_keys::NTuple{D, Symbol}\n    mins::SVector{D, T}\n    maxs::SVector{D, T}\n    spacing::SVector{D, T}\n    time_dim::Union{Nothing, Symbol}\n    stat_registry::StatRegistry\n\n    function DomainInfo{D, T}(dim_keys, mins, maxs, spacing, time_dim::Union{Nothing, Symbol},\n                              stat_registry::AbstractDict = get_stat_registry()) where {D, T \u003c: Real}\n        length(dim_keys) == D || throw(ArgumentError(\"expected $D dimension keys, got $(length(dim_keys))\"))\n        dkeys = ntuple(i -> Symbol(dim_keys[i]), Val(D))\n        allunique(dkeys) || throw(ArgumentError(\"dimension keys must be unique, got $dkeys\"))\n        if time_dim !== nothing && (D == 0 || dkeys[D] !== time_dim)\n            throw(ArgumentError(\"the time dimension :$time_dim must be the last dimension key, got $dkeys\"))\n        end\n        registry = StatRegistry(Symbol(k) => _registry_value(v) for (k, v) in stat_registry)\n        registry[:Solution] = :all\n        return new{D, T}(dkeys, SVector{D, T}(mins), SVector{D, T}(maxs), SVector{D, T}(spacing),\n                         time_dim, registry)\n    end\nend\n\nfunction DomainInfo(dim_keys, mins, maxs, spacing, time_dim::Union{Nothing, Symbol},\n                    stat_registry::AbstractDict = get_stat_registry())\n    T = float(promote_type(eltype(collect(mins)), eltype(collect(maxs)), eltype(collect(spacing))))\n    return DomainInfo{length(dim_keys), T}(dim_keys, mins, maxs, spacing, time_dim, stat_registry)\nend\n\n\"\"\"\n    has_time(domain::DomainInfo)\n    has_time(data::AbstractSimData)\n\n`true` if the dataset is transient (has a time axis).\n\"\"\"\nhas_time(domain::DomainInfo) = domain.time_dim !== nothing\n\n\"\"\"\n    get_time_dim(domain::DomainInfo)\n\nIndex of the time axis within `domain.dim_keys`, or `nothing` for static data.\n\"\"\"\nget_time_dim(domain::DomainInfo) = domain.time_dim === nothing ? nothing :\n                                   findfirst(==(domain.time_dim), domain.dim_keys)\n\n# Number of spatial dimensions of a domain.\n_nspace(domain::DomainInfo{D}) where {D} = has_time(domain) ? D - 1 : D\n","changed":[],"added":0,"removed":0}],"added":31,"removed":6,"changed_files":1},{"name":"test","path":"test","type":"dir","files":16,"lines":2320,"counts":{"AI-Generation":{"files":{"G2":3.219349027622101,"G3":12.7806509723779},"lines":{"G2":592,"G3":1728}},"Human-Review":{"files":{"H0":0.8765810936868585,"H1":15.089999883176896,"undeclared":0.033419023136246784},"lines":{"H0":204,"H1":2103,"undeclared":13}},"AI-Review":{"files":{"A0":0.50829622117886,"A1":15.458284755684891,"undeclared":0.033419023136246784},"lines":{"A0":84,"A1":2223,"undeclared":13}}},"errors":0,"children":[{"name":"fixtures/v0.4","path":"test/fixtures/v0.4","type":"dir","files":3,"lines":18,"counts":{"AI-Generation":{"files":{"G3":3.0},"lines":{"G3":18}},"Human-Review":{"files":{"H1":3.0},"lines":{"H1":18}},"AI-Review":{"files":{"A1":3.0},"lines":{"A1":18}}},"errors":0,"children":[{"name":"data","path":"test/fixtures/v0.4/data","type":"dir","files":2,"lines":2,"counts":{"AI-Generation":{"files":{"G3":2.0},"lines":{"G3":2}},"Human-Review":{"files":{"H1":2.0},"lines":{"H1":2}},"AI-Review":{"files":{"A1":2.0},"lines":{"A1":2}}},"errors":0,"children":[{"name":"2026-11-10_07-32-00_161_59c7e2fe1044aef6f3f26bddb26524aaf093e7ddd29e30f491de3e02c8673576.jld2",
