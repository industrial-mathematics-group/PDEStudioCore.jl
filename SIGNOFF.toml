# AI declarations, checked by aisignoff: file-level annotations below, line-level declarations from [history].
# Scheme: https://github.com/industrial-mathematics-group/.github/blob/main/.github/CONTRIBUTING.md#ai-assisted-contributions
version = 4

# Line by line: the commit that landed a line on main declares it. For a pull request into main that is its
# merge commit, whose message is the PR description with the ticked AI declaration of the template; main_dev
# lands through the "Main dev" pull requests on GitHub. Lines whose commit declares nothing keep the
# file-level declarations of the annotations below.
[history]
default-branch = "main"
merge-method = "merge"

[[annotations]]
path = "**"
AI-Generation = "G3"
Human-Review = "H1"
Reviewed-by = "blhackslash <dev@blackslash.win>"
Assisted-by = "Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"
AI-Review = "A1"
AI-Reviewed-by = "Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"

[[annotations]]
path = "src/**"
AI-Generation = "G2"
Assisted-by = "Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"
Human-Review = "H2"
Reviewed-by = "blhackslash <dev@blackslash.win>"
AI-Review = "A1"
AI-Reviewed-by = "Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"

